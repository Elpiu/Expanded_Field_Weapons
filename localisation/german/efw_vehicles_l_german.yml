l_german:
 efw_tankette_equipment:0 "Tanketten"
 efw_tankette_equipment_desc:0 "Zwei Mann, ein Maschinengewehr und ein Lkw-Motor in einer Blechkiste. Schneller als der eigene Mut: billig und wendig, aber jede Panzerabwehrkanone öffnet sie wie eine Sardinenbüchse."
 efw_tankette_equipment_1:0 "EFW-Tankette"
 efw_tankette_equipment_1_short:0 "Tankette"
 efw_tankette_equipment_1_desc:0 "Zwei Mann, ein Maschinengewehr und ein Lkw-Motor in einer Blechkiste. Schneller als der eigene Mut: billig und wendig, aber jede Panzerabwehrkanone öffnet sie wie eine Sardinenbüchse."
 efw_tankette_battalion:0 "Tankettenbataillon"
 efw_tankette_battalion_desc:0 "Zweimann-Minipanzer. Ein Bataillon kostet etwa ein Viertel eines leichten Panzerbataillons und überrollt Infanterie ohne Panzerabwehr, aber die Panzerung ist dünn. Nutzt EFW-Tanketten."
 efw_tankette_unlock:0 "EFW: Tanketten"
 efw_motorcycle_mg_equipment:0 "MG-Motorräder"
 efw_motorcycle_mg_equipment_desc:0 "Ein Motorrad, ein Beiwagen und ein Maschinengewehr dort, wo eigentlich die Schwiegermutter sitzen sollte. Schnell, laut und erstaunlich tödlich auf Feldwegen."
 efw_motorcycle_mg_equipment_1:0 "EFW-MG-Motorrad"
 efw_motorcycle_mg_equipment_1_short:0 "MG-Motorrad"
 efw_motorcycle_mg_equipment_1_desc:0 "Ein Motorrad, ein Beiwagen und ein Maschinengewehr dort, wo eigentlich die Schwiegermutter sitzen sollte. Schnell, laut und erstaunlich tödlich auf Feldwegen."
 efw_motorcycle_mg_company:0 "Kradschützen-MG-Kompanie"
 efw_motorcycle_mg_company_desc:0 "Motorisierte Aufklärung auf Motorrädern mit bewaffnetem Beiwagen. Sieht so weit wie motorisierte Aufklärung, kostet weniger und gibt der gesamten Infanterie der Division §G+5 % Angriff§!. Belegt den Aufklärungsplatz."
 efw_motorcycle_unlock:0 "EFW: Kradschützen"
 efw_gun_truck_equipment:0 "Geschütz-Lkw"
 efw_gun_truck_equipment_desc:0 "Man nehme einen Lkw. Man nehme eine Panzerabwehrkanone. Man binde beides mit viel Seil und etwas Glauben zusammen. Schießt auf Infanterie und leichte Fahrzeuge und fährt davon, bevor jemand antwortet: Panzerung gibt es keine."
 efw_gun_truck_equipment_1:0 "Improvisierter EFW-Geschützwagen"
 efw_gun_truck_equipment_1_short:0 "Geschützwagen"
 efw_gun_truck_equipment_1_desc:0 "Man nehme einen Lkw. Man nehme eine Panzerabwehrkanone. Man binde beides mit viel Seil und etwas Glauben zusammen. Schießt auf Infanterie und leichte Fahrzeuge und fährt davon, bevor jemand antwortet: Panzerung gibt es keine."
 efw_gun_truck_battalion:0 "Geschützwagen-Batterie"
 efw_gun_truck_battalion_desc:0 "Panzerabwehrkanonen auf Lastwagen. Linienartillerie, so schnell wie motorisierte Infanterie, mit guter Durchschlagskraft und ohne Schutz. Nutzt improvisierte EFW-Geschützwagen."
 efw_gun_truck_unlock:0 "EFW: Improvisierte Geschützwagen"
 efw_wooden_transport_equipment:0 "Holztransporter"
 efw_wooden_transport_equipment_desc:0 "Sperrholz, Segeltuch und ein Motor, der schon bessere Tage gesehen hat. Bringt Fallschirmjäger und Nachschubkisten für weniger als die Hälfte des Preises eines echten Transporters, ohne Aluminium. Weniger zuverlässig, und wird er getroffen, zerfällt er: Luftüberlegenheit ist Pflicht."
 efw_wooden_transport_equipment_1:0 "EFW-Holztransporter"
 efw_wooden_transport_equipment_1_short:0 "Holztransporter"
 efw_wooden_transport_equipment_1_desc:0 "Sperrholz, Segeltuch und ein Motor, der schon bessere Tage gesehen hat. Bringt Fallschirmjäger und Nachschubkisten für weniger als die Hälfte des Preises eines echten Transporters, ohne Aluminium. Weniger zuverlässig, und wird er getroffen, zerfällt er: Luftüberlegenheit ist Pflicht."
 efw_wooden_transport:0 "Holztransporter"
 efw_wooden_transport_desc:0 "Ein Geschwader EFW-Holztransporter: Fallschirmabsprünge und Luftversorgung."
 efw_air_transport_unlock:0 "EFW: Improvisierte Lufttransporte"
 efw_militia_paratrooper:0 "Miliz-Fallschirmjäger"
 efw_militia_paratrooper_desc:0 "Freiwillige mit einem zweiwöchigen Kurs und einem Fallschirm, den jemand anderes gefaltet hat. Keine Spezialkräfte, also beliebig viele ausbildbar. Schwächer als echte Fallschirmjäger, aber viel leichter: Für den Absprung braucht es etwa ein Drittel weniger Flugzeuge."
