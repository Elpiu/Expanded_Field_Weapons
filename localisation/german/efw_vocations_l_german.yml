l_german:
 efw_welcome.1.t:0 "Ein Inspektor mit einem Hydraulikrohr"
 efw_welcome.1.d:0 "Ein Beamter des Rüstungsministeriums tritt ohne anzuklopfen ein. Unter dem Arm trägt er ein Hydraulikrohr, eine Rolle Isolierband und eine Mappe mit der Aufschrift §YEXPANDED FIELD WEAPONS§!.\n\n„Exzellenz, Maschinengewehre, Mörser und Panzerabwehrwaffen haben jetzt eigene Produktionslinien, mit §YUnterstützungswaffen I§!. Wir haben ein Gewehr, das keinen Stahl kostet. Einen Holzjäger, Segelschiffe und eine Flotte aus Motorbooten. Und vier neue Gesetzesbereiche.“\n\nDann senkt er die Stimme: „Aber die eigentliche Neuheit sind die §YNationalen Berufungen§!. Wählt einen Weg, baut die richtigen Gebäude, erlasst die richtigen Gesetze ... und das Ministerium vervielfacht alles. Bis zu §G+40 % Forschung§!, wenn Ihr stur genug seid.“\n\nEr legt das Rohr auf den Schreibtisch. „In der Zwischenzeit ein kleines Willkommensgeschenk. Was ist Euch lieber?“"
 efw_welcome.1.a:0 "„In die Labore!“"
 efw_welcome.1.b:0 "„Mehr Fabriken, weniger Gerede.“"
 efw_welcome.1.c:0 "„Der Soldat kommt zuerst.“"
 efw_welcome.1.e:0 "„Wir haben ein paar Rohre im Keller gefunden.“"
 efw_welcome.1.f:0 "„Keine Geschenke. Ich habe einen Krieg vorzubereiten.“"
 efw_welcome_vocation_tt:0 "§YTipp:§! Die Entscheidungskategorie §YNationale Berufungen§! erklärt, wie man dieses Geschenk in einen dauerhaften Bonus verwandelt."
 efw_welcome_research_idea:0 "Begeisterung in den Laboren"
 efw_welcome_research_idea_desc:0 "Die Forscher haben einen aufmunternden Brief der Regierung erhalten. Sie haben ihn eingerahmt."
 efw_welcome_industry_idea:0 "Erste Baustellen"
 efw_welcome_industry_idea_desc:0 "Neue Bulldozer, neue Helme, dieselben Arbeiter. Aber motiviert."
 efw_welcome_army_idea:0 "Motivierte Rekruten"
 efw_welcome_army_idea_desc:0 "Der Feldwebel hat jedem Urlaub versprochen, der das Gewehr mit verbundenen Augen zusammensetzt."
 efw_vocation_category:0 "Nationale Berufungen"
 efw_vocation_category_desc:0 "Jede Nation ist in etwas gut. Wählt §YEINE§! und setzt alles darauf: Jede Stufe verlangt EFW-Gebäude und passende Gesetze, und auf der dritten Stufe wird der Bonus gewaltig. Doch wer sich auf alles spezialisiert, ist auf nichts spezialisiert: Die Nachteile treffen die anderen Bereiche.\n\n§REine Berufung pro Nation. Zwischen den Stufen müssen 120 Tage vergehen.§!"
 efw_vocation_settling_tt:0 "Das Ministerium organisiert sich noch (§Y120 Tage§! zwischen den Stufen)"
 efw_vocation_crisis_tt:0 "Keine §Rnationale Identitätskrise§! im Gange"
 efw_vocation_research_1:0 "Berufung: Republik der Wissenschaftler"
 efw_vocation_research_1_desc:0 "Mikroskope statt Kanonen: Die Nation setzt alles auf die Forschung.\n\n§YDer Weg:§!\n§YI§! §G+10 % Forschung§!\n§YII§! §G+22 % Forschung§!: 2 Nationale Forschungszentren, 4 Forschungsplätze und ein Gesetz aus Stipendien, Eliteuniversitäten, Wissenschaftlicher Austausch oder Militärforschung\n§YIII§! §G+40 % Forschung§!: 4 Forschungszentren, 5 Forschungsplätze, Eliteuniversitäten oder Wissenschaftlicher Austausch, Forschungsförderung oder Wissenschaftsstadt\n\n§RWachsende Nachteile:§! Konsumgüter, Militärproduktion und am Ende Kriegsunterstützung."
 efw_vocation_research_2:0 "Wissenschaftler: Das große Labor"
 efw_vocation_research_2_desc:0 "Die Professoren haben mehr Geld verlangt. Seltsamerweise haben sie es bekommen."
 efw_vocation_research_3:0 "Wissenschaftler: Köpfe an der Macht"
 efw_vocation_research_3_desc:0 "Das Kabinett tagt jetzt in einem Hörsaal. Folien sind Pflicht."
 efw_voc_research_1:0 "Republik der Wissenschaftler I"
 efw_voc_research_1_desc:0 "Jede Schule hat ein Labor, jedes Labor einen Traum."
 efw_voc_research_2:0 "Republik der Wissenschaftler II"
 efw_voc_research_2_desc:0 "Die Fabriken geben Ingenieure an die Labore ab. Die Fabriken sind nicht glücklich."
 efw_voc_research_3:0 "Republik der Wissenschaftler III"
 efw_voc_research_3_desc:0 "Die Nation denkt schneller als alle anderen. Kämpfen mag sie dagegen weniger."
 efw_vocation_industry_1:0 "Berufung: Werkstatt der Nation"
 efw_vocation_industry_1_desc:0 "Schlote, Schichten und Sirenen: Die Nation wird zur Fabrik.\n\n§YDer Weg:§!\n§YI§! §G+6 % Fabrikleistung, +8 % Bau§!\n§YII§! §G+14 % Leistung, +15 % Bau, +10 % Effizienzzuwachs§!: 2 Arbeitsdirektionen und ein Gesetz aus Schwerindustrie, Fünfjahresplan oder Wissenschaftliche Betriebsführung\n§YIII§! §G+28 % Leistung, +25 % Bau, +20 % Effizienzzuwachs, +5 % maximale Effizienz§!: 4 Arbeitsdirektionen, 2 Propagandazentren, Schwerindustrie oder Fünfjahresplan, ein Gesetz aus Lange Schichten, Arbeitsmobilisierung oder Korporatismus\n\n§RWachsende Nachteile:§! Forschung, Stabilität und Bevölkerungswachstum."
 efw_vocation_industry_2:0 "Werkstatt: Schlote überall"
 efw_vocation_industry_2_desc:0 "Der Himmel ist grau, das BIP ist grün."
 efw_vocation_industry_3:0 "Werkstatt: Das Land ist eine Fabrik"
 efw_vocation_industry_3_desc:0 "Die Sirene der Nachtschicht ist zur inoffiziellen Hymne geworden."
 efw_voc_industry_1:0 "Werkstatt der Nation I"
 efw_voc_industry_1_desc:0 "Die erste Schicht beginnt um sechs. Die zweite auch, nur woanders."
 efw_voc_industry_2:0 "Werkstatt der Nation II"
 efw_voc_industry_2_desc:0 "Jede Stadt hat eine Fabrik. Manche Städte sind eine Fabrik."
 efw_voc_industry_3:0 "Werkstatt der Nation III"
 efw_voc_industry_3_desc:0 "Die Nation produziert mehr als alle anderen. Die Bürger schlafen, wenn sie können."
 efw_vocation_army_1:0 "Berufung: Nation in Waffen"
 efw_vocation_army_1_desc:0 "Jeder Platz hat eine Kaserne, jeder Junge einen Tornister.\n\n§YDer Weg:§!\n§YI§! §G+3 % Angriff und Verteidigung, -5 % Ausbildungszeit§!\n§YII§! §G+8 % Angriff und Verteidigung, +3 % Wehrpflicht, -10 % Ausbildungszeit§!: 2 Propagandazentren und ein Gesetz aus Schwere Waffen für alle, Sturmtrupps oder Tiefenverteidigung\n§YIII§! §G+16 % Angriff und Verteidigung, +5 % Organisation, +6 % Wehrpflicht, -20 % Ausbildungszeit, +15 % Erfahrung§!: 4 Propagandazentren, 2 Logistikzentren, ein Feldwaffengesetz für 100 PM und eines aus Kriegsakademie, Großer Generalstab oder Veteranenkader\n\n§RWachsende Nachteile:§! Forschung, Konsumgüter und Stabilität."
 efw_vocation_army_2:0 "Waffen: Jeder Bürger ein Soldat"
 efw_vocation_army_2_desc:0 "Sogar der Briefträger kann ein Maschinengewehr zerlegen. Die Post kommt zu spät."
 efw_vocation_army_3:0 "Waffen: Die nationale Kaserne"
 efw_vocation_army_3_desc:0 "Das ganze Land steht um fünf auf. Per Gesetz."
 efw_voc_army_1:0 "Nation in Waffen I"
 efw_voc_army_1_desc:0 "Die Samstagsparade ist zur festen Einrichtung geworden."
 efw_voc_army_2:0 "Nation in Waffen II"
 efw_voc_army_2_desc:0 "Die Schulen lehren Erdkunde mit den Karten des Generalstabs."
 efw_voc_army_3:0 "Nation in Waffen III"
 efw_voc_army_3_desc:0 "Das beste Heer des Kontinents. Die Labore schließen derweil um fünf."
 efw_vocation_navy_1:0 "Berufung: Herren der Meere"
 efw_vocation_navy_1_desc:0 "Die Zukunft der Nation schwimmt.\n\n§YDer Weg:§!\n§YI§! §G+6 % Werftleistung, +3 % Seeschaden§!\n§YII§! §G+15 % Werftleistung, +6 % Seeschaden und -verteidigung, +10 % Reparaturen§!: 10 Werften und ein Gesetz aus Große Werften, Hochseeflotte, Torpedodoktrin oder Umrüstarsenale\n§YIII§! §G+30 % Werftleistung, +12 % Seeschaden und -verteidigung, +25 % Reparaturen und Umrüstungen§!: 25 Werften, Große Werften und ein Gesetz aus Hochseeflotte, Torpedodoktrin, Umrüstarsenale oder Geleitzugsystem\n\n§RWachsende Nachteile:§! Militärproduktion und Heeresausbildung."
 efw_vocation_navy_2:0 "Meer: Stapellauf am laufenden Band"
 efw_vocation_navy_2_desc:0 "Jeden Montag zerbricht eine Flasche an einem Bug. Das Glas recyceln wir."
 efw_vocation_navy_3:0 "Meer: Herren der Wellen"
 efw_vocation_navy_3_desc:0 "Die feindlichen Seekarten haben ein neues Symbol: unseres."
 efw_voc_navy_1:0 "Herren der Meere I"
 efw_voc_navy_1_desc:0 "Die Kinder spielen mit Spielzeugbooten. Das Ministerium macht sich Notizen."
 efw_voc_navy_2:0 "Herren der Meere II"
 efw_voc_navy_2_desc:0 "Die Werften arbeiten Tag und Nacht; die Regimenter warten auf ihre Lastwagen."
 efw_voc_navy_3:0 "Herren der Meere III"
 efw_voc_navy_3_desc:0 "Die beste Flotte der Ozeane. Das Heer übt derweil am Kai."
 efw_vocation_scrap_1:0 "Berufung: Die Kunst des Improvisierens"
 efw_vocation_scrap_1_desc:0 "Kein Stahl? Kein Kautschuk? Kein Problem. Wir haben Draht.\n\n§YDer Weg:§!\n§YI§! §G-15 % Malus für fehlende Ressourcen, +5 % Anfangseffizienz§!\n§YII§! §G-35 % Malus, +10 % Anfangseffizienz, +5 % lokale Ressourcen, +5 % Fabrikleistung§!: §Y5.000 Rohrgewehre§! im Lager und Schrottsammlung oder Ersatzstoffe\n§YIII§! §G-60 % Malus, +20 % Anfangseffizienz, +5 % maximale Effizienz, +10 % lokale Ressourcen, +12 % Fabrikleistung§!: §Y20.000 Rohrgewehre§! im Lager, Schrottsammlung oder Ersatzstoffe, Autarkie oder Importquoten\n\nIdeal für rohstoffarme Nationen.\n\n§RWachsende Nachteile:§! Forschung und Stabilität."
 efw_vocation_scrap_2:0 "Improvisieren: Alles ist nützlich"
 efw_vocation_scrap_2_desc:0 "Die Parkgitter sind verschwunden. Die Bänke auch. Und ein paar Laternen."
 efw_vocation_scrap_3:0 "Improvisieren: Genie des Drahts"
 efw_vocation_scrap_3_desc:0 "Ausländische Ingenieure besuchen unsere Fabriken und verstehen nicht, wie sie funktionieren. Wir auch nicht."
 efw_voc_scrap_1:0 "Die Kunst des Improvisierens I"
 efw_voc_scrap_1_desc:0 "Isolierband wurde zum strategischen Material erklärt."
 efw_voc_scrap_2:0 "Die Kunst des Improvisierens II"
 efw_voc_scrap_2_desc:0 "Jeder Keller ist ein Depot, jeder Großvater ein technischer Berater."
 efw_voc_scrap_3:0 "Die Kunst des Improvisierens III"
 efw_voc_scrap_3_desc:0 "Die Fabriken laufen mit halben Ressourcen auf Hochtouren. Niemand fragt, wie."
 efw_vocation_abandon:0 "Der Berufung abschwören"
 efw_vocation_abandon_desc:0 "Wir haben den falschen Weg genommen. Das passiert. Wir kehren um, verlieren die erreichte Stufe, und für §Y180 Tage§! erleidet das Land eine §Rnationale Identitätskrise§!: keine neue Berufung, bis sie vorbei ist."
 efw_vocation_crisis_idea:0 "Nationale Identitätskrise"
 efw_vocation_crisis_idea_desc:0 "Die Zeitungen fragen, wer wir sind. Die Regierung weiß es ehrlich gesagt auch nicht."
