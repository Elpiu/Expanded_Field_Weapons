l_german:
 efw_national_mobilization_category:0 "Nationale Mobilisierung und Investitionen"
 efw_national_mobilization_category_desc:0 "Ein Netz aus Propaganda, Arbeitsorganisation, Forschung und Logistik kann das Land schrittweise in eine voll mobilisierte Wirtschafts- und Kriegsmaschine verwandeln."
 efw_propaganda_center:0 "Propaganda- und Mobilisierungszentrum"
 efw_propaganda_center_desc:0 "Ein Verwaltungs- und Propagandazentrum, das politische Kampagnen, zivile Anwerbung und öffentliche Mobilisierung koordiniert."
 efw_labor_directorate:0 "Nationale Arbeitsdirektion"
 efw_labor_directorate_desc:0 "Eine Organisation, die Arbeit, Bau, Produktion und die Nutzung lokaler Ressourcen koordiniert."
 efw_research_center:0 "Nationales Forschungszentrum"
 efw_research_center_desc:0 "Ein Komplex für angewandte Forschung, der Institute, Universitäten und nationale Labore koordiniert."
 efw_logistics_center:0 "Logistik- und Zivilschutzzentrum"
 efw_logistics_center_desc:0 "Ein regionaler Knotenpunkt für Lager, Transport, Instandhaltung, Infrastruktur und Zivilschutz."
