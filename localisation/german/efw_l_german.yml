 efw_national_investments_idea:0 "Nationales Investitionsprogramm"
 efw_national_investments_idea_desc:0 "Der Staat bündelt politische und administrative Mittel für den Ausbau der Propaganda und der nationalen Arbeitsorganisation."
 efw_coordinated_economy_idea:0 "Koordinierte Volkswirtschaft"
 efw_coordinated_economy_idea_desc:0 "Industrie, Werften und Verwaltung werden nach einem nationalen Wirtschaftsplan koordiniert – zu einem sozialen Preis."
 efw_research_funding_idea:0 "Nationale Forschungsförderung"
 efw_research_funding_idea_desc:0 "Fördermittel und beschleunigte Verfahren unterstützen den Aufbau eines nationalen Forschungsnetzes."
 efw_logistics_plan_idea:0 "Nationaler Infrastrukturplan"
 efw_logistics_plan_idea_desc:0 "Die Regierung fördert den Aufbau regionaler Logistikzentren und der zugehörigen Infrastruktur."
 efw_national_mobilization_idea:0 "Nationale Mobilisierung"
 efw_national_mobilization_idea_desc:0 "Der wirtschaftliche und administrative Apparat des Landes ist ganz auf die nationalen Anstrengungen ausgerichtet."
 efw_commission_propaganda_center:0 "Propagandazentrum bauen"
 efw_commission_propaganda_center_desc:0 "§Y10.000 öffentliche Arbeiter§! für den Bau eines Propaganda- und Mobilisierungszentrums im gewählten Staat einsetzen."
 efw_commission_labor_directorate:0 "Arbeitsdirektion gründen"
 efw_commission_labor_directorate_desc:0 "§Y20.000 Arbeiter§! für die Gründung einer Nationalen Arbeitsdirektion im gewählten Staat einsetzen."
 efw_commission_research_center:0 "Nationales Forschungszentrum bauen"
 efw_commission_research_center_desc:0 "§Y15.000 Techniker, Forscher und Mitarbeiter§! für die Gründung eines Nationalen Forschungszentrums einsetzen."
 efw_commission_logistics_center:0 "Logistikzentrum bauen"
 efw_commission_logistics_center_desc:0 "§Y12.000 Arbeiter und Logistikpersonal§! für die Gründung eines Logistik- und Zivilschutzzentrums einsetzen."
 efw_launch_national_investments:0 "Nationale Investitionen starten"
 efw_launch_national_investments_desc:0 "Mit dem ersten funktionierenden Propagandanetz lassen sich öffentliche Investitionen zentralisieren und beschleunigen."
 efw_coordinate_national_economy:0 "Volkswirtschaft koordinieren"
 efw_coordinate_national_economy_desc:0 "Das Verwaltungs- und Arbeitsnetz ist groß genug, um Industrie und Bau landesweit zu koordinieren."
 efw_fund_national_research:0 "Nationale Forschung fördern"
 efw_fund_national_research_desc:0 "Politische und administrative Mittel für ein koordiniertes nationales Forschungsnetz bereitstellen."
 efw_launch_national_infrastructure_plan:0 "Nationaler Infrastrukturplan"
 efw_launch_national_infrastructure_plan_desc:0 "Ein nationales Programm für Logistik, Transport, Lager und Zivilschutz schaffen."
 efw_mobilize_the_nation:0 "Die Nation mobilisieren"
 efw_mobilize_the_nation_desc:0 "Propaganda, Arbeit, Forschung und Logistik sind weit genug entwickelt für die volle wirtschaftliche Mobilisierung der Nation."
 efw_issue_national_bonds:0 "Staatsanleihen ausgeben"
 efw_issue_national_bonds_desc:0 "Sofort §G+100 politische Macht§! erhalten, aber nach §Y365 Tagen§! §R150 politische Macht§! zurückzahlen."
 efw_issue_long_term_national_loan:0 "Große Nationalanleihe"
 efw_issue_long_term_national_loan_desc:0 "Sofort §G+120 politische Macht§! erhalten, aber nach §Y730 Tagen§! §R200 politische Macht§! zurückzahlen."
 efw_national_mobilization.1.t:0 "Staatsanleihen werden fällig"
 efw_national_mobilization.1.d:0 "Die vor einem Jahr ausgegebenen Anleihen sind fällig. Kapital und Zinsen müssen nun zurückgezahlt werden."
 efw_national_mobilization.1.a:0 "Wir halten unsere Verpflichtungen ein."
 efw_national_mobilization.2.t:0 "Die Große Nationalanleihe wird fällig"
 efw_national_mobilization.2.d:0 "Die vor zwei Jahren aufgenommene Nationalanleihe ist fällig. Kapital und Zinsen müssen nun zurückgezahlt werden."
 efw_national_mobilization.2.a:0 "Die Schuld wird beglichen."
 EFW_MOD_NAME:0 "Expanded Field Weapons"
 efw_machinegun_equipment:0 "Unterstützungs-Maschinengewehre"
 efw_machinegun_equipment_desc:0 "Leichte, mittlere und schwere Maschinengewehre in einer Produktionskategorie zusammengefasst. Die Ausrüstung bleibt gleich, während die Forschung an Unterstützungswaffen die Verbände verbessert, die sie nutzen."
 efw_machinegun_equipment_standard:0 "Maschinengewehre"
 efw_machinegun_equipment_standard_short:0 "MGs"
 efw_mortar_equipment:0 "Infanteriemörser"
 efw_mortar_equipment_desc:0 "Leichte und mittlere Mörser für organische Steilfeuerunterstützung auf kurze Distanz."
 efw_mortar_equipment_standard:0 "Mörser"
 efw_mortar_equipment_standard_short:0 "Mörser"
 efw_antitank_equipment:0 "Tragbare Panzerabwehrwaffen"
 efw_antitank_equipment_desc:0 "Organische Panzerabwehrwaffen der Infanterie. Verbesserte Doktrin, Munition und Einsatz werden durch Technologieboni statt durch neue Modelle dargestellt."
 efw_antitank_equipment_standard:0 "Panzerabwehrwaffen"
 efw_antitank_equipment_standard_short:0 "Pak-Waffen"
 efw_machinegun_company:0 "Maschinengewehrkompanie"
 efw_machinegun_company_desc:0 "Eine Unterstützungskompanie für anhaltendes Dauerfeuer. Nutzt EFW-Maschinengewehre."
 efw_mortar_company:0 "Mörserkompanie"
 efw_mortar_company_desc:0 "Eine Unterstützungskompanie für Steilfeuer auf kurze Distanz. Nutzt EFW-Mörser."
 efw_antitank_company:0 "Panzerabwehrkompanie"
 efw_antitank_company_desc:0 "Tragbare Panzerabwehrtrupps im Verband. Nutzt EFW-Panzerabwehrwaffen."
 efw_elite_heavy_weapons_battalion:0 "Elite-Bataillon schwerer Waffen"
 efw_elite_heavy_weapons_battalion_desc:0 "Ein teures und nachschubhungriges Frontbataillon, das Maschinengewehre, Mörser und Panzerabwehrwaffen mit ausgewählter Infanterie verbindet."
 efw_legionari_dellimpero:0 "Legionari dell'Impero"
 efw_legionari_dellimpero_desc:0 "Ein großes Milizbataillon mit Gewehren und organischen Maschinengewehren. Starke Unterdrückung und defensive Feuerkraft, etwas geringerer Nachschubbedarf als normale Infanterie, aber lange Ausbildung: Unerfahrene Verbände sind fragil, voll ausgebildete Legionäre übertreffen reguläre Infanterie."
 efw_unlock_core_weapons:0 "EFW: Integrierte Unterstützungswaffen"
 efw_legionari_unlock:0 "EFW: Legionari dell'Impero"
 efw_support_upgrade_2:0 "EFW: Unterstützungswaffen II"
 efw_support_upgrade_3:0 "EFW: Unterstützungswaffen III"
 efw_support_upgrade_4:0 "EFW: Unterstützungswaffen IV"
 efw_at_upgrade_1:0 "EFW: Panzerabwehrverbesserungen I"
 efw_at_upgrade_2:0 "EFW: Panzerabwehrverbesserungen II"
 efw_improvised_naval_modules_unlock:0 "Improvisiertes Marineprogramm"
 efw_motorboat_engine:0 "Improvisierter Motorbootmotor"
 efw_motorboat_engine_desc:0 "Ein einfacher Motor für winzige Küstenboote. Senkt Kosten, Reichweite und Haltbarkeit des Schiffs drastisch."
 efw_motorboat_machinegun:0 "Marine-MG-Lafette"
 efw_motorboat_machinegun_desc:0 "Ein schweres Maschinengewehr für den Einsatz auf See."
 efw_midget_sub_engine:0 "Kleinst-U-Boot-Antrieb"
 efw_midget_sub_engine_desc:0 "Ein winziger Antrieb für extrem kleine U-Boote."
 efw_midget_sub_torpedo:0 "Leichter Torpedo für Kleinst-U-Boote"
 efw_midget_sub_torpedo_desc:0 "Eine kompakte Torpedoanlage für Kleinst-U-Boote."
 efw_scrap_multirole_mount:0 "Improvisierte Mehrzwecklafette"
 efw_scrap_multirole_mount_desc:0 "Eine geschweißte Doppelzwecklafette aus übrigen leichten Geschützen und improvisierten Flakvisieren. Bringt etwas leichte und Flugabwehr-Feuerkraft, passt in mehrere Plätze, senkt aber leicht Geschwindigkeit und Zuverlässigkeit."
 efw_improvised_torpedo_rack:0 "Improvisiertes Torpedogestell"
 efw_improvised_torpedo_rack_desc:0 "Ein einfaches Deckgestell für Reservetorpedos mit selbstgebauter Auslösung. Etwas Torpedoschlagkraft und Trefferchance, stapelbar, kostet aber Geschwindigkeit und Zuverlässigkeit."
 efw_improvised_depth_charge_rack:0 "Improvisiertes Wasserbombengestell"
 efw_improvised_depth_charge_rack_desc:0 "Ein leichtes Wasserbombengestell mit einfacher Hydrophonverkabelung. Etwas mehr U-Jagd-Angriff und Ortung, stapelbar, verlangsamt das Schiff aber leicht und senkt die Zuverlässigkeit."
 efw_improvised_fuel_tank:0 "Improvisierter Zusatztank"
 efw_improvised_fuel_tank_desc:0 "Ein billiger Tank, aus Schrottstahl geschweißt. Mehr Reichweite für wenig Geld, senkt aber leicht Geschwindigkeit und Zuverlässigkeit und kann bei Treffern lecken."
 efw_wooden_sub_coating:0 "Holzbeplankung für U-Boote"
 efw_wooden_sub_coating_desc:0 "Schichten aus behandeltem Holz, Segeltuch und Teer ersetzen knappe Metallplatten. Senkt die Kosten, schwächt aber den Rumpf und macht das U-Boot leichter auffindbar."
 efw_wooden_surface_refit:0 "Hölzerner Umbau"
 efw_wooden_surface_refit_desc:0 "Ein Notumbau mit hölzernen Aufbauten und nicht-strategischen Materialien. Senkt die Kosten, schwächt aber den Rumpf, verlangsamt das Schiff und schadet der Zuverlässigkeit."
 efw_improvised_mine_rack:0 "Improvisiertes Minengestell (10 Minen)"
 efw_improvised_mine_rack_desc:0 "Ein einfaches Deckgestell für etwa zehn Kontaktminen. Erhöht die Minenlegekapazität stark, kostet aber Geschwindigkeit und Zuverlässigkeit."
 efw_improvised_sub_mine_rack:0 "Improvisiertes U-Boot-Minengestell (10 Minen)"
 efw_improvised_sub_mine_rack_desc:0 "Ein kompaktes Außengestell für etwa zehn Minen. Erhöht die Minenlegekapazität des U-Boots stark bei geringen Einbußen an Geschwindigkeit und Zuverlässigkeit."
 efw_small_sail:0 "Kleines improvisiertes Segel"
 efw_small_sail_desc:0 "Ein kleines Segeltuchsegel an Deck. +15 % Geschwindigkeit, aber das Schiff wird sichtbarer und etwas unzuverlässiger. Passt in den Treibstofftankplatz."
 efw_large_sail:0 "Großes improvisiertes Segel"
 efw_large_sail_desc:0 "Ein riesiges Notsegel macht das Schiff zu einem behelfsmäßigen Windjammer. +25 % Geschwindigkeit, aber stark erhöhte Sichtbarkeit und weniger Zuverlässigkeit und Rumpfstärke. Passt in den Treibstofftankplatz."
 efw_careened_hull:0 "Gekielholter und polierter Rumpf"
 efw_careened_hull_desc:0 "Der Rumpf wird abgekratzt, geteert und poliert, wo möglich mit improvisiertem Kupferbeschlag. Verbessert Zuverlässigkeit, Geschwindigkeit, Reichweite und Ortung, senkt leicht die Sichtbarkeit und gibt etwas Rumpfstärke. Ein solides Allzweckmodul für den Treibstofftankplatz."
 efw_fishing_net_armor:0 "Fischernetzpanzerung"
 efw_fishing_net_armor_desc:0 "Tarnnetze und verhedderte Fischernetze statt echter Panzerung. Senkt leicht Sichtbarkeit und Torpedoschaden und spart sogar etwas Kosten, bietet aber keinen Panzerwert."
 efw_wooden_plank_armor:0 "Holzplankenpanzerung"
 efw_wooden_plank_armor_desc:0 "Geschichtete Holzplanken, an den Rumpf geschraubt. Billiger Zusatzschutz und etwas Haltbarkeit auf Kosten von Geschwindigkeit und Zuverlässigkeit."
 efw_scrap_plate_armor:0 "Schrottplattenpanzerung"
 efw_scrap_plate_armor_desc:0 "Zusammengeschweißte Altstahlplatten. Besserer Schutz als Holz, aber schwerer, langsamer und unzuverlässiger."
 efw_fishing_net_armor_heavy:0 "Fischernetzpanzerung (schwer)"
 efw_fishing_net_armor_heavy_desc:0 "Schwere Tarn- und Fischernetze über einem Großkampfschiff. Senken leicht Sichtbarkeit und Torpedoschaden, bieten aber keine echte Panzerung."
 efw_wooden_plank_armor_heavy:0 "Holzplankenpanzerung (schwer)"
 efw_wooden_plank_armor_heavy_desc:0 "Massive Holzplanken am Rumpf eines Großkampfschiffs. Billiger Schutz und zusätzliche Haltbarkeit auf Kosten von Geschwindigkeit und Zuverlässigkeit."
 efw_scrap_plate_armor_heavy:0 "Schrottplattenpanzerung (schwer)"
 efw_scrap_plate_armor_heavy_desc:0 "Dicke Altstahlplatten am Rumpf eines Großkampfschiffs. Solider Behelfsschutz, aber schwer, langsam und unzuverlässig."
 efw_wooden_fighter_equipment:0 "Improvisierter Holzjäger"
 efw_wooden_fighter_equipment_desc:0 "Ein extrem billiges Flugzeug aus nicht-strategischen Materialien und einfachen Bauteilen. Leicht herzustellen, aber langsam, zerbrechlich und schwach bewaffnet."
 efw_tin_tank_equipment:0 "Blechpanzer"
 efw_tin_tank_equipment_desc:0 "Ein primitiver leichter Panzer mit dünnen genieteten Platten, vor allem mit einem Maschinengewehr bewaffnet. Billig herzustellen, aber verwundbar durch fast jede Panzerabwehrwaffe."
 efw_wooden_air_bba_unlock:0 "Improvisiertes Flugzeugprogramm"
 efw_wooden_air_legacy_unlock:0 "Improvisiertes Flugzeugprogramm"
 efw_tin_tank_nsb_unlock:0 "Improvisiertes Panzerprogramm"
 efw_tin_tank_legacy_unlock:0 "Improvisiertes Panzerprogramm"
