 efw_labor_directorate_unlock:0 "EFW-Arbeitsorganisation"
 efw_research_center_unlock:0 "EFW-Forschungsnetz"
 efw_logistics_center_unlock:0 "EFW-Logistiknetz"
 efw_industrialization_campaign_idea:0 "Nationale Industrialisierungskampagne"
 efw_state_industry_subsidies_idea:0 "Staatliche Industriesubventionen"
 efw_national_infrastructure_program_idea:0 "Nationales Infrastrukturprogramm"
 efw_early_industrialization_campaign:0 "Industrialisierungskampagne starten"
 efw_army_public_works:0 "Armee für öffentliche Arbeiten einsetzen"
 efw_state_industry_subsidies:0 "Staatliche Industriesubventionen"
 efw_national_infrastructure_program:0 "Nationales Infrastrukturprogramm"
 efw_pipe_gun_rifle:0 "Rohrgewehr"
 efw_pipe_gun_rifle_short:0 "Rohrgewehr"
 efw_pipe_gun_rifle_desc:0 "Eine grobe improvisierte Waffe, hastig aus Hydraulikrohr und Altteilen zusammengebaut. Primitiv, unzuverlässig und ohne jeden Industriestandard, aber fast ohne Ressourcen herstellbar."
 efw_army_munitions_works:0 "Bau von Heeresarsenalen"
 efw_army_munitions_works_desc:0 "100.000 Rekruten für ein Jahr in die Rüstungsfertigung schicken, um dauerhaft 4 externe Militärfabriken zu errichten."
 efw_naval_yard_expansion:0 "Werftenbauoffensive"
 efw_naval_yard_expansion_desc:0 "100.000 Rekruten für ein Jahr in den Küstenbau schicken und 4 dauerhafte externe Werften errichten."
 efw_industrial_plan_phase_1:0 "Industrieller Gesamtplan: Phase I – Fundamente"
 efw_industrial_plan_phase_1_desc:0 "Investiert politisches Kapital, Züge und Arbeitskräfte in die Fundamente einer gewaltigen nationalen Industrierenaissance. Liefert sofort §G+8 zivile Fabriken§! und §G+2 Militärfabriken§! extern und beschleunigt den Bau. Schaltet nach 180 Tagen Phase II frei."
 efw_industrial_phase_1_idea:0 "Industrieplan: Mobilisierung Phase I"
 efw_industrial_plan_phase_2:0 "Industrieller Gesamtplan: Phase II – Schwerer Ausbau"
 efw_industrial_plan_phase_2_desc:0 "Die abschließende Phase des Industrieausbaus. Fügt weitere §G+7 zivile Fabriken§! und §G+4 Militärfabriken§! extern hinzu. Nach Abschluss werden alle Ausrüstung und die Hälfte der mobilisierten Arbeitskräfte zurückgegeben."
 efw_industrial_phase_2_idea:0 "Industrieplan: Mobilisierung Phase II"
 efw_national_mobilization.30.t:0 "Industrieplan: Phase I abgeschlossen"
 efw_national_mobilization.30.d:0 "Die ersten Schwerfabriken und Hüttenwerke sind voll in Betrieb. Das Fundament ist gelegt, die Nation ist bereit für Phase II des Gesamtplans."
 efw_national_mobilization.30.a:0 "Weiter mit Phase II!"
 efw_national_mobilization.31.t:0 "Industrieplan: Industrieller Triumph"
 efw_national_mobilization.31.d:0 "Genau ein Jahr nach Programmbeginn ist der Ausbau abgeschlossen: 15 zivile Komplexe und 6 Rüstungsfabriken arbeiten mit höchster Effizienz. Züge und Lastwagen sind in die Bestände zurückgekehrt."
 efw_national_mobilization.31.a:0 "Ein Produktionsriese ist entstanden!"
 efw_grand_public_works:0 "Mobilisierung für große öffentliche Arbeiten"
 efw_grand_public_works_desc:0 "Setzt Arbeitsbrigaden, Ingenieure und Lastwagen ein, um die Kapazität des Heimatlandes zu erweitern. Gibt allen Kernstaaten des Mutterlands §G+1 Infrastruktur§! (wenn unter 5) und §G+2 Bauplätze§! sowie §G+30 %§! Baugeschwindigkeit für 540 Tage."
 efw_grand_works_idea:0 "Aufschwung der großen Bauvorhaben"
 efw_social_welfare_and_workshops:0 "Sozialpakt und verstreute Werkstätten"
 efw_social_welfare_and_workshops_desc:0 "Verbindet Familienförderung mit der logistischen Einbindung kleiner Handwerksbetriebe. Stabilisiert das Wachstum der Mannstärke, hilft der Forschung und erhöht Fabrikleistung und maximale Effizienz für 3 Jahre."
 efw_social_welfare_workshops_idea:0 "Sozialpakt und Werkstattnetz"
 efw_emergency_naval_program:0 "Notprogramm zum Flottenausbau"
 efw_emergency_naval_program_desc:0 "Bündelt spezialisierte Werftarbeiter und Ausrüstung für §G+6 dauerhafte externe Werften§!. Mobilisiertes Personal und Lastwagen kehren nach einem Jahr zurück."
 efw_national_mobilization.34.t:0 "Fälligkeit der Staatsanleihen"
 efw_national_mobilization.34.d:0 "Die im Vorjahr ausgegebenen Schatzanleihen sind fällig. Die Regierung muss die Gläubiger mit Zinsen auszahlen, um ihre finanzielle Glaubwürdigkeit zu wahren."
 efw_national_mobilization.34.a:0 "Unsere finanziellen Zusagen einhalten."
 efw_wooden_construction:0 "Leichte Holzstruktur"
 efw_wooden_construction_desc:0 "Sperrholzrumpf und Holme mit behandeltem Segeltuch. Senkt die Industriekosten des Flugzeugs drastisch."
 efw_wooden_frame_component:0 "Hölzerne Strukturverkleidung"
 efw_wooden_frame_component_desc:0 "Ersetzt Metallteile durch Holz und Segeltuch. Senkt Gewicht und Kosten bei geringerer Stabilität. Mehrfach einbaubar."
 efw_extended_fuel_tank:0 "Externer Zusatztank"
 efw_extended_fuel_tank_desc:0 "Abwerfbarer Unterflügeltank, der die Reichweite deutlich erhöht."
 efw_airdrop_supply_pod:0 "Abwurf-Versorgungsbehälter"
 efw_airdrop_supply_pod_desc:0 "Notfall-Fallschirmbehälter zur Versorgung eingeschlossener Truppen und für taktische Bodenunterstützung."
 efw_boost_power_system:0 "Aufladesystem „Kraftstoß“"
 efw_boost_power_system_desc:0 "Hilfsverdichter, der die Höchstgeschwindigkeit erhöht und zusätzlichen Schub für schwere Lasten liefert."
 efw_universal_hardpoint:0 "Universelle Aufhängung für Sonderbewaffnung"
 efw_universal_hardpoint_desc:0 "Mehrzweck-Unterflügelaufhängung: Bomben für Luftnahunterstützung, Zusatzfeuer für Luftüberlegenheit oder Torpedos und Ladungen für Seeeinsätze."
 efw_plywood_frame_module:0 "Zelle aus Sperrholz und Stoff"
 efw_plywood_frame_module_desc:0 "Ersetzt knappes Aluminium durch verleimtes Sperrholz und behandelten Stoff. Senkt Kosten und Gewicht drastisch, bietet hervorragende Wendigkeit, ist aber zerbrechlich."
 efw_overboost_compressor_module:0 "Handgefertigter „Overboost“-Verdichter"
 efw_overboost_compressor_module_desc:0 "Übertaktet den Motor mit Hochdruck-Alkoholeinspritzung. Gibt enormen Schub (+8 Schub) und Höchstgeschwindigkeit auf Kosten starken Verschleißes."
 efw_improvised_bomb_rack_module:0 "Improvisiertes Splitter- und Bombengestell"
 efw_improvised_bomb_rack_module_desc:0 "Unterflügelgestelle für Mörsergranaten und Streumunition. Erlaubt leichten Behelfsflugzeugen verheerende Luftnahunterstützung gegen feindliche Verbände (+6 Bodenangriff)."
 efw_infantry_mg_pod_module:0 "Behälter mit schwerem Infanterie-MG"
 efw_infantry_mg_pod_module_desc:0 "Schwere Infanterie-MGs in Flügelbehältern. Macht billige Flugzeuge zu gefährlichen Abfangjägern im Nahkampf (+8 Luftangriff)."
 efw_paper_drop_tank_module:0 "Abwurftanks aus Pressspan"
 efw_paper_drop_tank_module_desc:0 "Einweg-Zusatztanks aus lackiertem Pappmaché und billigem Harz. Riesige Reichweite fast ohne Kosten, aber bei Treffern hohe Brandgefahr."
 efw_stripped_cockpit_module:0 "Entkerntes Cockpit und Ringvisier"
 efw_stripped_cockpit_module_desc:0 "Cockpitpanzerung, Heizung und schwere Instrumente entfernt – übrig bleiben offene Haube und einfaches Ringvisier. Spart Gewicht und verbessert das Schießen, lässt den Piloten aber völlig ungeschützt."
 efw_wooden_boost_airframe:0 "Holzzelle und „Overboost“-Verdichter"
 efw_wooden_boost_airframe_desc:0 "Federleichtes Sperrholz statt Metalllegierungen plus aufgeladener Motor. Senkt Kosten und Gewicht, mit moderatem Gewinn an Geschwindigkeit und Schub (+5 Schub). Jedes Exemplar kostet 6 % Zuverlässigkeit und 8 % Luftverteidigung, aber die Abzüge steigen nur sanft: Zwei oder drei Exemplare bleiben brauchbar und machen das Flugzeug viel billiger."
 efw_improvised_drop_tank:0 "Zusatz-Abwurftank aus Pressspan"
 efw_improvised_drop_tank_desc:0 "Einweg-Zusatztank aus lackiertem Pappmaché und billigem Harz. Erhöht die Reichweite deutlich (+300 km) bei vernachlässigbaren Kosten, ist aber leicht entflammbar."
 efw_multirole_combat_rack:0 "Feld-Mehrzweckwaffengestell"
 efw_multirole_combat_rack_desc:0 "Ein kompaktes Feldgestell, das jede Zelle zu einem bescheidenen Mehrzweckflugzeug macht: +2 Luftangriff, +2 Bodenangriff, +2 strategische Bombardierung, +2 Seeangriff und +2 Seezielerfassung. Ermöglicht außerdem Luftüberlegenheit, Abfangen, Luftnahunterstützung, Logistikangriff, Seeangriff, Seepatrouille, Hafenangriff und strategische Bombardierung. Der zusätzliche Luftwiderstand kostet 15 Höchstgeschwindigkeit und 1,5 Wendigkeit, aber das Modul ist stapelbar: Boni und Nachteile addieren sich."
 efw_cast_iron_stove_armor:0 "Improvisierte „Feldofen“-Panzerung"
 efw_cast_iron_stove_armor_desc:0 "Eine schwere Gusseisenplatte oder ein Kanaldeckel unter dem Pilotensitz. Solider ballistischer Schutz (+7 Verteidigung), aber deutlich schwerere Zelle (+4 Gewicht) und etwas weniger Höchstgeschwindigkeit und Reichweite."
 efw_bazooka_charlie_tubes:0 "„Bazooka Charlie“-Raketenrohre"
 efw_bazooka_charlie_tubes_desc:0 "Eine Batterie handgeschweißter Infanterie-Raketenrohre unter den Flügelstreben. Verheerende Salven gegen Panzerdivisionen und Seeziele (+8 Bodenangriff), aber hohe Kosten und viel Gewicht verschlechtern Wendigkeit und Verteidigung spürbar."
