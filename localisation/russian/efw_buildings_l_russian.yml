 efw_wheat_fields:0 "Пшеничные поля"
 efw_wheat_fields_plural:0 "Пшеничные поля"
 efw_wheat_fields_desc:0 "Государственные хозяйства, которые делают страну независимой в продовольствии: хлеб для городов и фронта без всякого импорта. Каждый регион с пшеничными полями снижает §Yтовары народного потребления на 1%§! и повышает стабильность и рост населения. Мелиорация открывает новое место для строительства, а амбары снабжают проходящие войска."
 modifier_production_speed_efw_wheat_fields_factor:0 "Скорость строительства: Пшеничные поля"
