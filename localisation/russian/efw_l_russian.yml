l_russian:
 efw_national_mobilization_category:0 "Национальная мобилизация и инвестиции"
 efw_national_mobilization_category_desc:0 "Сеть пропаганды, организации труда, науки и логистики может постепенно превратить страну в полностью мобилизованную экономическую и военную машину."
 efw_propaganda_center:0 "Центр пропаганды и мобилизации"
 efw_propaganda_center_desc:0 "Административный и пропагандистский центр, координирующий политические кампании, набор гражданских и общественную мобилизацию."
 efw_labor_directorate:0 "Национальное управление труда"
 efw_labor_directorate_desc:0 "Организация, координирующая труд, строительство, производство и использование местных ресурсов."
 efw_research_center:0 "Национальный исследовательский центр"
 efw_research_center_desc:0 "Комплекс прикладных исследований, координирующий институты, университеты и национальные лаборатории."
 efw_logistics_center:0 "Центр логистики и гражданской обороны"
 efw_logistics_center_desc:0 "Региональный узел складов, транспорта, ремонта, инфраструктуры и гражданской обороны."
 modifier_production_speed_efw_propaganda_center_factor:0 "Скорость строительства: Центр пропаганды и мобилизации"
 modifier_production_speed_efw_propaganda_center_factor_desc:0 "Изменяет скорость строительства: Центр пропаганды и мобилизации."
 modifier_state_production_efw_propaganda_center_factor:0 "Местная скорость строительства: Центр пропаганды и мобилизации"
 modifier_state_production_efw_propaganda_center_factor_desc:0 "Изменяет местную скорость строительства: Центр пропаганды и мобилизации."
 modifier_production_speed_efw_labor_directorate_factor:0 "Скорость строительства: Национальное управление труда"
 modifier_production_speed_efw_labor_directorate_factor_desc:0 "Изменяет скорость строительства: Национальное управление труда."
 modifier_state_production_efw_labor_directorate_factor:0 "Местная скорость строительства: Национальное управление труда"
 modifier_state_production_efw_labor_directorate_factor_desc:0 "Изменяет местную скорость строительства: Национальное управление труда."
 modifier_production_speed_efw_research_center_factor:0 "Скорость строительства: Национальный исследовательский центр"
 modifier_production_speed_efw_research_center_factor_desc:0 "Изменяет скорость строительства: Национальный исследовательский центр."
 modifier_state_production_efw_research_center_factor:0 "Местная скорость строительства: Национальный исследовательский центр"
 modifier_state_production_efw_research_center_factor_desc:0 "Изменяет местную скорость строительства: Национальный исследовательский центр."
 modifier_production_speed_efw_logistics_center_factor:0 "Скорость строительства: Центр логистики и гражданской обороны"
 modifier_production_speed_efw_logistics_center_factor_desc:0 "Изменяет скорость строительства: Центр логистики и гражданской обороны."
 modifier_state_production_efw_logistics_center_factor:0 "Местная скорость строительства: Центр логистики и гражданской обороны"
 modifier_state_production_efw_logistics_center_factor_desc:0 "Изменяет местную скорость строительства: Центр логистики и гражданской обороны."
 efw_national_investments_idea:0 "Программа национальных инвестиций"
 efw_national_investments_idea_desc:0 "Государство сосредотачивает политические и административные ресурсы на расширении пропаганды и национальной организации труда."
 efw_coordinated_economy_idea:0 "Скоординированная национальная экономика"
 efw_coordinated_economy_idea_desc:0 "Промышленность, верфи и администрация координируются национальным экономическим планом — ценой социальных издержек."
 efw_research_funding_idea:0 "Национальное финансирование науки"
 efw_research_funding_idea_desc:0 "Финансирование и ускоренные процедуры поддерживают развитие национальной научной сети."
 efw_logistics_plan_idea:0 "Национальный план инфраструктуры"
 efw_logistics_plan_idea_desc:0 "Правительство поддерживает развитие региональных логистических центров и сопутствующей инфраструктуры."
 efw_national_mobilization_idea:0 "Национальная мобилизация"
 efw_national_mobilization_idea_desc:0 "Экономический и административный аппарат страны полностью направлен на общие усилия нации."
 efw_commission_propaganda_center:0 "Построить центр пропаганды"
 efw_commission_propaganda_center_desc:0 "Направить §Y10 000 общественных работников§! на строительство центра пропаганды и мобилизации в выбранном регионе."
 efw_commission_labor_directorate:0 "Учредить управление труда"
 efw_commission_labor_directorate_desc:0 "Направить §Y20 000 рабочих§! на создание национального управления труда в выбранном регионе."
 efw_commission_research_center:0 "Построить исследовательский центр"
 efw_commission_research_center_desc:0 "Направить §Y15 000 техников, учёных и сотрудников§! на создание национального исследовательского центра."
 efw_commission_logistics_center:0 "Построить логистический центр"
 efw_commission_logistics_center_desc:0 "Направить §Y12 000 рабочих и логистов§! на создание центра логистики и гражданской обороны."
 efw_launch_national_investments:0 "Запустить национальные инвестиции"
 efw_launch_national_investments_desc:0 "Когда первая сеть пропаганды заработала, государственные инвестиции можно централизовать и ускорить."
 efw_coordinate_national_economy:0 "Скоординировать национальную экономику"
 efw_coordinate_national_economy_desc:0 "Административная и трудовая сеть достаточно широка, чтобы координировать промышленность и строительство в масштабах страны."
 efw_fund_national_research:0 "Финансировать национальную науку"
 efw_fund_national_research_desc:0 "Выделить политические и административные ресурсы на скоординированную национальную научную сеть."
 efw_launch_national_infrastructure_plan:0 "Национальный план инфраструктуры"
 efw_launch_national_infrastructure_plan_desc:0 "Создать национальную программу логистики, транспорта, складов и гражданской обороны."
 efw_mobilize_the_nation:0 "Мобилизовать нацию"
 efw_mobilize_the_nation_desc:0 "Пропаганда, труд, наука и логистика достаточно развиты для полной экономической мобилизации страны."
 efw_issue_national_bonds:0 "Выпустить государственные облигации"
 efw_issue_national_bonds_desc:0 "Сразу получить §G+100 политической власти§!, но вернуть §R150 политической власти§! через §Y365 дней§!."
 efw_issue_long_term_national_loan:0 "Большой национальный заём"
 efw_issue_long_term_national_loan_desc:0 "Сразу получить §G+120 политической власти§!, но вернуть §R200 политической власти§! через §Y730 дней§!."
 efw_national_mobilization.1.t:0 "Срок погашения облигаций"
 efw_national_mobilization.1.d:0 "Облигации, выпущенные год назад, подлежат погашению. Пора вернуть долг с процентами."
 efw_national_mobilization.1.a:0 "Мы выполним свои обязательства."
 efw_national_mobilization.2.t:0 "Срок погашения большого займа"
 efw_national_mobilization.2.d:0 "Национальный заём, взятый два года назад, подлежит погашению. Пора вернуть долг с процентами."
 efw_national_mobilization.2.a:0 "Долг будет возвращён."
 EFW_MOD_NAME:0 "Expanded Field Weapons"
 efw_machinegun_equipment:0 "Пулемёты поддержки"
 efw_machinegun_equipment_desc:0 "Ручные, станковые и крупнокалиберные пулемёты, объединённые в одну производственную категорию. Снаряжение не меняется, а исследования «Оружия поддержки» улучшают использующие его части."
 efw_machinegun_equipment_standard:0 "Пулемёты"
 efw_machinegun_equipment_standard_short:0 "Пулемёты"
 efw_mortar_equipment:0 "Пехотные миномёты"
 efw_mortar_equipment_desc:0 "Лёгкие и средние миномёты для штатной огневой поддержки навесным огнём на малой дистанции."
 efw_mortar_equipment_standard:0 "Миномёты"
 efw_mortar_equipment_standard_short:0 "Миномёты"
 efw_antitank_equipment:0 "Переносное противотанковое оружие"
 efw_antitank_equipment_desc:0 "Штатное противотанковое оружие пехоты. Улучшенные доктрины, боеприпасы и тактика отражены бонусами технологий, а не новыми моделями."
 efw_antitank_equipment_standard:0 "Противотанковое оружие"
 efw_antitank_equipment_standard_short:0 "ПТ-оружие"
 efw_machinegun_company:0 "Пулемётная рота"
 efw_machinegun_company_desc:0 "Рота поддержки, ведущая непрерывный автоматический огонь. Использует пулемёты EFW."
 efw_mortar_company:0 "Миномётная рота"
 efw_mortar_company_desc:0 "Рота поддержки для навесного огня на малой дистанции. Использует миномёты EFW."
 efw_antitank_company:0 "Противотанковая рота"
 efw_antitank_company_desc:0 "Переносные противотанковые расчёты в составе соединения. Использует противотанковое оружие EFW."
 efw_elite_heavy_weapons_battalion:0 "Элитный батальон тяжёлого вооружения"
 efw_elite_heavy_weapons_battalion_desc:0 "Дорогой и прожорливый фронтовой батальон, сочетающий пулемёты, миномёты и противотанковое оружие с отборной пехотой."
 efw_legionari_dellimpero:0 "Legionari dell'Impero"
 efw_legionari_dellimpero_desc:0 "Крупный батальон ополчения с винтовками и штатными пулемётами. Сильное подавление и оборонительный огонь, расходует чуть меньше снабжения, чем обычная пехота, но требует долгой подготовки: необученные части хрупки, а полностью обученные легионеры превосходят регулярную пехоту."
 efw_unlock_core_weapons:0 "EFW: комплексное оружие поддержки"
 efw_legionari_unlock:0 "EFW: Legionari dell'Impero"
 efw_support_upgrade_2:0 "EFW: оружие поддержки II"
 efw_support_upgrade_3:0 "EFW: оружие поддержки III"
 efw_support_upgrade_4:0 "EFW: оружие поддержки IV"
 efw_at_upgrade_1:0 "EFW: противотанковые улучшения I"
 efw_at_upgrade_2:0 "EFW: противотанковые улучшения II"
 efw_improvised_naval_modules_unlock:0 "Программа импровизированного флота"
 efw_motorboat_engine:0 "Самодельный мотор катера"
 efw_motorboat_engine_desc:0 "Простой мотор для крошечных прибрежных судов. Резко снижает стоимость, дальность и прочность корабля."
 efw_motorboat_machinegun:0 "Корабельная пулемётная установка"
 efw_motorboat_machinegun_desc:0 "Крупнокалиберный пулемёт, приспособленный для флота."
 efw_midget_sub_engine:0 "Двигатель сверхмалой подлодки"
 efw_midget_sub_engine_desc:0 "Крошечная силовая установка для очень маленьких подводных лодок."
 efw_midget_sub_torpedo:0 "Лёгкая торпеда сверхмалой подлодки"
 efw_midget_sub_torpedo_desc:0 "Компактная торпедная установка для сверхмалых подводных лодок."
 efw_scrap_multirole_mount:0 "Самодельная многоцелевая установка"
 efw_scrap_multirole_mount_desc:0 "Сварная двухцелевая установка из запасных лёгких орудий и самодельных зенитных прицелов. Немного усиливает лёгкое и зенитное вооружение, ставится в несколько слотов, но слегка снижает скорость и надёжность."
 efw_improvised_torpedo_rack:0 "Самодельный торпедный стеллаж"
 efw_improvised_torpedo_rack_desc:0 "Простой палубный стеллаж для запасных торпед с самодельным сбрасывателем. Добавляет немного торпедного удара и точности, суммируется, но стоит скорости и надёжности."
 efw_improvised_depth_charge_rack:0 "Самодельный бомбосбрасыватель"
 efw_improvised_depth_charge_rack_desc:0 "Лёгкий стеллаж глубинных бомб с простой проводкой гидрофона. Немного усиливает ПЛО и обнаружение, суммируется, но слегка замедляет корабль и снижает надёжность."
 efw_improvised_fuel_tank:0 "Самодельный дополнительный бак"
 efw_improvised_fuel_tank_desc:0 "Дешёвый бак, сваренный из металлолома. Увеличивает дальность за малые деньги, но слегка снижает скорость и надёжность и может протечь при попадании."
 efw_wooden_sub_coating:0 "Деревянная обшивка подлодки"
 efw_wooden_sub_coating_desc:0 "Слои пропитанного дерева, парусины и смолы вместо дефицитного металла. Снижает стоимость, но ослабляет корпус и облегчает обнаружение подлодки."
 efw_wooden_surface_refit:0 "Деревянная переделка корабля"
 efw_wooden_surface_refit_desc:0 "Временная переделка с деревянными надстройками и нестратегическими материалами. Снижает стоимость, но ослабляет корпус, замедляет корабль и вредит надёжности."
 efw_improvised_mine_rack:0 "Самодельный минный стеллаж (10 мин)"
 efw_improvised_mine_rack_desc:0 "Простой палубный стеллаж примерно на десять контактных мин. Сильно увеличивает возможности минирования ценой скорости и надёжности."
 efw_improvised_sub_mine_rack:0 "Самодельный минный стеллаж подлодки (10 мин)"
 efw_improvised_sub_mine_rack_desc:0 "Компактный наружный стеллаж примерно на десять мин. Сильно увеличивает возможности минирования подлодки при небольшой потере скорости и надёжности."
 efw_small_sail:0 "Малый самодельный парус"
 efw_small_sail_desc:0 "Небольшой парусиновый парус на палубе. Даёт +15% к скорости, но делает корабль заметнее и чуть менее надёжным. Ставится в слот топливного бака."
 efw_large_sail:0 "Большой самодельный парус"
 efw_large_sail_desc:0 "Огромный парус на скорую руку превращает корабль в импровизированный парусник. Даёт +25% к скорости, но сильно повышает заметность и снижает надёжность и прочность корпуса. Ставится в слот топливного бака."
 efw_careened_hull:0 "Очищенный и отполированный корпус"
 efw_careened_hull_desc:0 "Корпус очищен, просмолён и отполирован, где возможно — с самодельной медной обшивкой. Повышает надёжность, скорость, дальность и обнаружение, немного снижает заметность и добавляет прочности. Хороший универсальный модуль для слота топливного бака."
 efw_fishing_net_armor:0 "Броня из рыболовных сетей"
 efw_fishing_net_armor_desc:0 "Маскировочные сетки и спутанные рыболовные сети вместо настоящей брони. Немного снижает заметность и урон от торпед и даже экономит немного средств, но брони не даёт."
 efw_wooden_plank_armor:0 "Броня из досок"
 efw_wooden_plank_armor_desc:0 "Слои досок, прикрученных к корпусу. Дешёвая дополнительная защита и немного прочности ценой скорости и надёжности."
 efw_scrap_plate_armor:0 "Броня из металлолома"
 efw_scrap_plate_armor_desc:0 "Сваренные трофейные стальные листы. Лучше защищают, чем дерево, но тяжелее, медленнее и менее надёжны."
 efw_fishing_net_armor_heavy:0 "Броня из рыболовных сетей (тяжёлая)"
 efw_fishing_net_armor_heavy_desc:0 "Тяжёлые маскировочные и рыболовные сети на крупном корабле. Немного снижают заметность и урон от торпед, но настоящей брони не дают."
 efw_wooden_plank_armor_heavy:0 "Броня из досок (тяжёлая)"
 efw_wooden_plank_armor_heavy_desc:0 "Массивные доски, прикрученные к корпусу крупного корабля. Дешёвая защита и дополнительная прочность ценой скорости и надёжности."
 efw_scrap_plate_armor_heavy:0 "Броня из металлолома (тяжёлая)"
 efw_scrap_plate_armor_heavy_desc:0 "Толстые трофейные стальные листы на корпусе крупного корабля. Надёжная самодельная защита, но тяжёлая, медленная и ненадёжная."
 efw_wooden_fighter_equipment:0 "Самодельный деревянный истребитель"
 efw_wooden_fighter_equipment_desc:0 "Очень дешёвый самолёт из нестратегических материалов и простых деталей. Легко производить, но он медленный, хрупкий и слабо вооружён."
 efw_tin_tank_equipment:0 "Жестяной танк"
 efw_tin_tank_equipment_desc:0 "Примитивный лёгкий танк с тонкими клёпаными листами, вооружённый в основном пулемётом. Дешёв в производстве, но уязвим почти для любого противотанкового оружия."
 efw_wooden_air_bba_unlock:0 "Программа импровизированной авиации"
 efw_wooden_air_legacy_unlock:0 "Программа импровизированной авиации"
 efw_tin_tank_nsb_unlock:0 "Программа импровизированной бронетехники"
