 efw_national_infrastructure_program_idea:0 "Национальная программа инфраструктуры"
 efw_early_industrialization_campaign:0 "Начать кампанию индустриализации"
 efw_army_public_works:0 "Задействовать армию на общественных работах"
 efw_state_industry_subsidies:0 "Государственные промышленные субсидии"
 efw_national_infrastructure_program:0 "Национальная программа инфраструктуры"
 efw_pipe_gun_rifle:0 "Трубная винтовка"
 efw_pipe_gun_rifle_short:0 "Трубная винтовка"
 efw_pipe_gun_rifle_desc:0 "Грубое самодельное оружие, наспех собранное из гидравлической трубы и подручных деталей. Примитивное, ненадёжное и без всякого промышленного стандарта, но его можно производить почти без ресурсов."
 efw_army_munitions_works:0 "Строительство армейских арсеналов"
 efw_army_munitions_works_desc:0 "Направить 100 000 новобранцев на год в военное производство, чтобы навсегда построить 4 внешних военных завода."
 efw_naval_yard_expansion:0 "Строительство военных верфей"
 efw_naval_yard_expansion_desc:0 "Направить 100 000 новобранцев на год на прибрежное строительство и создать 4 постоянные внешние верфи."
 efw_industrial_plan_phase_1:0 "Генеральный промышленный план: фаза I — фундамент"
 efw_industrial_plan_phase_1_desc:0 "Вложить политический капитал, поезда и людей в фундамент масштабного промышленного возрождения. Сразу даёт §G+8 гражданских заводов§! и §G+2 военных завода§! вне регионов и ускоряет строительство. Через 180 дней открывает фазу II."
 efw_industrial_phase_1_idea:0 "Промышленный план: мобилизация фазы I"
 efw_industrial_plan_phase_2:0 "Генеральный промышленный план: фаза II — тяжёлое расширение"
 efw_industrial_plan_phase_2_desc:0 "Завершающая фаза промышленного расширения. Добавляет ещё §G+7 гражданских заводов§! и §G+4 военных завода§! вне регионов. По завершении вся техника и половина мобилизованных рабочих возвращаются."
 efw_industrial_phase_2_idea:0 "Промышленный план: мобилизация фазы II"
 efw_national_mobilization.30.t:0 "Промышленный план: фаза I завершена"
 efw_national_mobilization.30.d:0 "Первые тяжёлые заводы и металлургические комбинаты полностью заработали. Фундамент заложен, страна готова начать фазу II."
 efw_national_mobilization.30.a:0 "Переходим к фазе II!"
 efw_national_mobilization.31.t:0 "Промышленный план: промышленный триумф"
 efw_national_mobilization.31.d:0 "Ровно через год после начала программы расширение завершено: 15 гражданских комплексов и 6 военных заводов работают на пике эффективности. Поезда и грузовики возвращены на склады."
 efw_national_mobilization.31.a:0 "Родился производственный гигант!"
 efw_grand_public_works:0 "Мобилизация на великие общественные работы"
 efw_grand_public_works_desc:0 "Бригады общественных работ, инженеры и грузовики расширяют возможности родной земли. Добавляет §G+1 инфраструктуры§! (если меньше 5) и §G+2 слота строительства§! во всех основных регионах метрополии и даёт §G+30%§! к скорости строительства на 540 дней."
 efw_grand_works_idea:0 "Подъём великих общественных работ"
 efw_social_welfare_and_workshops:0 "Общественный договор и сеть мастерских"
 efw_social_welfare_and_workshops_desc:0 "Сочетает поддержку семей с логистической интеграцией небольших ремесленных мастерских. Стабилизирует рост призывного населения, помогает науке и повышает выпуск и предел эффективности заводов на 3 года."
 efw_social_welfare_workshops_idea:0 "Общественный договор и сеть мастерских"
 efw_emergency_naval_program:0 "Чрезвычайная программа расширения флота"
 efw_emergency_naval_program_desc:0 "Собирает специалистов-корабелов и оборудование, чтобы создать §G+6 постоянных внешних верфей§!. Мобилизованные люди и грузовики возвращаются через год."
 efw_national_mobilization.34.t:0 "Погашение государственных облигаций"
 efw_national_mobilization.34.d:0 "Облигации казначейства, выпущенные в прошлом году, подлежат погашению. Правительство должно выплатить держателям долг с процентами, чтобы сохранить доверие."
 efw_national_mobilization.34.a:0 "Выполнить финансовые обязательства."
 efw_wooden_construction:0 "Лёгкая деревянная конструкция"
 efw_wooden_construction_desc:0 "Фанерный фюзеляж и лонжероны с пропитанной парусиной. Резко снижает промышленную стоимость самолёта."
 efw_wooden_frame_component:0 "Деревянные панели каркаса"
 efw_wooden_frame_component_desc:0 "Заменяет металлические детали деревом и парусиной. Снижает вес и стоимость ценой прочности. Можно ставить несколько раз."
 efw_extended_fuel_tank:0 "Подвесной дополнительный бак"
 efw_extended_fuel_tank_desc:0 "Сбрасываемый подкрыльевой бак, заметно увеличивающий дальность."
 efw_airdrop_supply_pod:0 "Контейнер для сброса снабжения"
 efw_airdrop_supply_pod_desc:0 "Аварийные парашютные контейнеры для снабжения окружённых войск и тактической поддержки."
 efw_boost_power_system:0 "Система наддува «Рывок»"
 efw_boost_power_system_desc:0 "Вспомогательный компрессор, повышающий максимальную скорость и тягу для больших нагрузок."
 efw_universal_hardpoint:0 "Универсальный узел подвески спецвооружения"
 efw_universal_hardpoint_desc:0 "Многоцелевой подкрыльевой узел: бомбы для штурмовки, доп. огонь для завоевания превосходства в воздухе или торпеды и заряды для морских миссий."
 efw_plywood_frame_module:0 "Каркас из фанеры и ткани"
 efw_plywood_frame_module_desc:0 "Заменяет дефицитный алюминий клеёной фанерой и пропитанной тканью. Резко снижает стоимость и вес, даёт великолепную манёвренность ценой хрупкости."
 efw_overboost_compressor_module:0 "Самодельный компрессор «Овербуст»"
 efw_overboost_compressor_module_desc:0 "Форсирует двигатель впрыском спирта под высоким давлением. Даёт огромную тягу (+8 тяги) и скорость ценой сильного износа."
 efw_improvised_bomb_rack_module:0 "Самодельный бомбодержатель"
 efw_improvised_bomb_rack_module_desc:0 "Подкрыльевые держатели для миномётных мин и кассетных боеприпасов. Позволяет лёгким самолётам вести мощную поддержку пехоты (+6 к атаке по наземным целям)."
 efw_infantry_mg_pod_module:0 "Контейнер с пехотным пулемётом"
 efw_infantry_mg_pod_module_desc:0 "Пехотные крупнокалиберные пулемёты в подкрыльевых контейнерах. Превращает дешёвый самолёт в опасный перехватчик для ближнего боя (+8 к атаке в воздухе)."
 efw_paper_drop_tank_module:0 "Сбрасываемые баки из прессованной бумаги"
 efw_paper_drop_tank_module_desc:0 "Одноразовые баки из лакированного папье-маше и дешёвой смолы. Огромная дальность почти бесплатно, но при попадании серьёзный риск пожара."
 efw_stripped_cockpit_module:0 "Облегчённая кабина и кольцевой прицел"
 efw_stripped_cockpit_module_desc:0 "Снята броня кабины, отопление и тяжёлые приборы — остались открытый фонарь и простой кольцевой прицел. Экономит вес и улучшает стрельбу, но пилот полностью беззащитен."
 efw_wooden_boost_airframe:0 "Деревянный каркас и компрессор «Овербуст»"
 efw_wooden_boost_airframe_desc:0 "Лёгкая фанера вместо металлических сплавов плюс форсированный двигатель. Снижает стоимость и вес, умеренно повышает скорость и тягу (+5 тяги). Каждая копия стоит 6% надёжности и 8% защиты в воздухе, но штрафы растут мягко: две-три копии остаются пригодными и сильно удешевляют самолёт."
 efw_improvised_drop_tank:0 "Сбрасываемый бак из прессованной бумаги"
 efw_improvised_drop_tank_desc:0 "Одноразовый бак из лакированного папье-маше и дешёвой смолы. Заметно увеличивает дальность (+300 км) почти бесплатно, но очень огнеопасен."
 efw_multirole_combat_rack:0 "Полевая многоцелевая подвеска"
 efw_multirole_combat_rack_desc:0 "Компактная полевая подвеска превращает любой планер в скромный многоцелевой самолёт: +2 к атаке в воздухе, +2 к атаке по наземным целям, +2 к стратегическим бомбардировкам, +2 к атаке по кораблям и +2 к наведению на корабли. Открывает миссии завоевания превосходства, перехвата, штурмовки, удара по логистике, ударов по кораблям, морского патрулирования, удара по порту и стратегических бомбардировок. Лишнее сопротивление стоит 15 скорости и 1,5 манёвренности, но модуль суммируется: бонусы и штрафы складываются."
 efw_cast_iron_stove_armor:0 "Самодельная броня «Полевая печка»"
 efw_cast_iron_stove_armor_desc:0 "Тяжёлая чугунная плита или крышка люка под сиденьем пилота. Хорошая защита от пуль (+7 к защите), но заметно утяжеляет планер (+4 к весу) и немного снижает скорость и дальность."
 efw_bazooka_charlie_tubes:0 "Пусковые трубы «Базука Чарли»"
 efw_bazooka_charlie_tubes_desc:0 "Батарея самодельных сварных пехотных ракетных труб под подкосами крыла. Сокрушительные залпы по бронетехнике и кораблям (+8 к атаке по наземным целям), но стоимость и вес велики, заметно ухудшая манёвренность и защиту."
