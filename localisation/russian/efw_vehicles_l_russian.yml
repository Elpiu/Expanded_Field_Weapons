l_russian:
 efw_tankette_equipment:0 "Танкетки"
 efw_tankette_equipment_desc:0 "Два человека, пулемёт и мотор от грузовика в жестяной коробке. Быстрее собственной храбрости: дешёвая и манёвренная, но любая противотанковая пушка вскрывает её как банку сардин."
 efw_tankette_equipment_1:0 "Танкетка EFW"
 efw_tankette_equipment_1_short:0 "Танкетка"
 efw_tankette_equipment_1_desc:0 "Два человека, пулемёт и мотор от грузовика в жестяной коробке. Быстрее собственной храбрости: дешёвая и манёвренная, но любая противотанковая пушка вскрывает её как банку сардин."
 efw_tankette_battalion:0 "Батальон танкеток"
 efw_tankette_battalion_desc:0 "Двухместные мини-танки. Батальон стоит примерно четверть батальона лёгких танков и сминает пехоту без противотанковых средств, но броня тонкая. Использует танкетки EFW."
 efw_tankette_unlock:0 "EFW: танкетки"
 efw_motorcycle_mg_equipment:0 "Пулемётные мотоциклы"
 efw_motorcycle_mg_equipment_desc:0 "Мотоцикл, коляска и пулемёт там, где должна сидеть тёща. Быстрый, шумный и удивительно смертоносный на просёлках."
 efw_motorcycle_mg_equipment_1:0 "Пулемётный мотоцикл EFW"
 efw_motorcycle_mg_equipment_1_short:0 "Мотоцикл с пулемётом"
 efw_motorcycle_mg_equipment_1_desc:0 "Мотоцикл, коляска и пулемёт там, где должна сидеть тёща. Быстрый, шумный и удивительно смертоносный на просёлках."
 efw_motorcycle_mg_company:0 "Рота мотоциклистов-пулемётчиков"
 efw_motorcycle_mg_company_desc:0 "Моторизованная разведка на мотоциклах с вооружёнными колясками. Видит так же далеко, как моторизованная разведка, стоит дешевле и даёт §G+5% к атаке§! всей пехоте дивизии. Занимает слот разведки."
 efw_motorcycle_unlock:0 "EFW: мотоциклисты-пулемётчики"
 efw_gun_truck_equipment:0 "Грузовики с пушкой"
 efw_gun_truck_equipment_desc:0 "Возьмите грузовик. Возьмите противотанковую пушку. Свяжите их вместе большим количеством верёвки и капелькой веры. Стреляет по пехоте и лёгкой технике и уезжает раньше, чем кто-то ответит: брони нет."
 efw_gun_truck_equipment_1:0 "Самодельная автопушка EFW"
 efw_gun_truck_equipment_1_short:0 "Автопушка"
 efw_gun_truck_equipment_1_desc:0 "Возьмите грузовик. Возьмите противотанковую пушку. Свяжите их вместе большим количеством верёвки и капелькой веры. Стреляет по пехоте и лёгкой технике и уезжает раньше, чем кто-то ответит: брони нет."
 efw_gun_truck_battalion:0 "Батарея автопушек"
 efw_gun_truck_battalion_desc:0 "Противотанковые пушки на грузовиках. Линейная артиллерия, быстрая как моторизованная пехота, с хорошей бронепробиваемостью и без защиты. Использует самодельные автопушки EFW."
 efw_gun_truck_unlock:0 "EFW: самодельные автопушки"
 efw_wooden_transport_equipment:0 "Деревянные транспортники"
 efw_wooden_transport_equipment_desc:0 "Фанера, парусина и мотор, видавший лучшие дни. Возит десантников и ящики снабжения меньше чем за половину цены настоящего транспортника и без алюминия. Менее надёжен, а при попадании разваливается: нужно господство в воздухе."
 efw_wooden_transport_equipment_1:0 "Деревянный транспортник EFW"
 efw_wooden_transport_equipment_1_short:0 "Деревянный транспортник"
 efw_wooden_transport_equipment_1_desc:0 "Фанера, парусина и мотор, видавший лучшие дни. Возит десантников и ящики снабжения меньше чем за половину цены настоящего транспортника и без алюминия. Менее надёжен, а при попадании разваливается: нужно господство в воздухе."
 efw_wooden_transport:0 "Деревянные транспортники"
 efw_wooden_transport_desc:0 "Авиакрыло деревянных транспортников EFW: высадка десанта и снабжение по воздуху."
 efw_air_transport_unlock:0 "EFW: самодельный воздушный транспорт"
 efw_militia_paratrooper:0 "Десантники ополчения"
 efw_militia_paratrooper_desc:0 "Добровольцы с двухнедельными курсами и парашютом, сложенным кем-то другим. Это не спецназ, поэтому их можно готовить сколько угодно. Слабее настоящих десантников, но гораздо легче: для высадки нужно примерно на треть меньше самолётов."
 efw_sten_smg:0 "Пистолет-пулемёт STEN"
 efw_sten_smg_short:0 "STEN"
 efw_sten_smg_desc:0 "Стальная труба, магазин сбоку и проволочный приклад. Стоит чуть дороже трубной винтовки, но стреляет гораздо лучше: отлично для ближнего штурма, на дальней дистанции менее точен, чем винтовки. Нужна 1 сталь."
 efw_sten_unlock:0 "EFW: пистолет-пулемёт STEN"
