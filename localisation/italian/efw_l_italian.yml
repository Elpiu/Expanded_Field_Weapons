 modifier_state_production_efw_propaganda_center_factor_desc:0 "Modifica la velocità locale di costruzione dei Centri di Propaganda."
 modifier_production_speed_efw_labor_directorate_factor:0 "Velocità costruzione Direzione del Lavoro"
 modifier_production_speed_efw_labor_directorate_factor_desc:0 "Modifica la velocità di costruzione delle Direzioni del Lavoro Nazionale."
 modifier_state_production_efw_labor_directorate_factor:0 "Velocità locale costruzione Direzione del Lavoro"
 modifier_state_production_efw_labor_directorate_factor_desc:0 "Modifica la velocità locale di costruzione delle Direzioni del Lavoro."
 modifier_production_speed_efw_research_center_factor:0 "Velocità costruzione Centro di Ricerca"
 modifier_production_speed_efw_research_center_factor_desc:0 "Modifica la velocità di costruzione dei Centri Nazionali di Ricerca."
