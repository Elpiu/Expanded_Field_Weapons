l_italian:
 EFW_MOD_NAME:0 "Expanded Field Weapons"

 efw_machinegun_equipment:0 "Mitragliatrici di supporto"
 efw_machinegun_equipment_desc:0 "Mitragliatrici leggere, medie e pesanti astratte in una singola categoria produttiva. Il materiale rimane lo stesso: l'efficacia delle unita aumenta con la ricerca Support Weapons."
 efw_machinegun_equipment_standard:0 "Mitragliatrici"
 efw_machinegun_equipment_standard_short:0 "Mitragliatrici"

 efw_mortar_equipment:0 "Mortai da fanteria"
 efw_mortar_equipment_desc:0 "Mortai leggeri e medi per il fuoco indiretto organico della fanteria."
 efw_mortar_equipment_standard:0 "Mortai"
 efw_mortar_equipment_standard_short:0 "Mortai"

 efw_antitank_equipment:0 "Armi anticarro portatili"
 efw_antitank_equipment_desc:0 "Armi anticarro organiche della fanteria, dai primi sistemi portatili alle tattiche e munizioni migliorate rappresentate dai bonus tecnologici."
 efw_antitank_equipment_standard:0 "Armi anticarro"
 efw_antitank_equipment_standard_short:0 "Armi AT"

 efw_machinegun_company:0 "Compagnia mitragliatrici"
 efw_machinegun_company_desc:0 "Compagnia di supporto dedicata al fuoco automatico sostenuto. Consuma Mitragliatrici EFW."
 efw_mortar_company:0 "Compagnia mortai"
 efw_mortar_company_desc:0 "Compagnia di supporto per il fuoco indiretto a corto raggio. Consuma Mortai EFW."
 efw_antitank_company:0 "Compagnia anticarro"
 efw_antitank_company_desc:0 "Squadre anticarro portatili integrate nella formazione. Consuma Armi anticarro EFW."
 efw_elite_heavy_weapons_battalion:0 "Battaglione d'elite armi pesanti"
 efw_elite_heavy_weapons_battalion_desc:0 "Battaglione di linea costoso e logisticamente pesante che combina mitragliatrici, mortai e armi anticarro con fanteria scelta."
 efw_legionari_dellimpero:0 "Legionari dell'Impero"
 efw_legionari_dellimpero_desc:0 "Grande battaglione di milizia equipaggiato con fucili e mitragliatrici organiche. Ha una forte capacita di repressione e un buon fuoco difensivo, consuma leggermente meno rifornimenti della fanteria standard, ma richiede un addestramento lungo: le formazioni verdi sono fragili, mentre i legionari pienamente addestrati rendono piu della fanteria regolare."

 efw_unlock_core_weapons:0 "EFW: Armi di supporto integrate"
 efw_legionari_unlock:0 "EFW: Legionari dell'Impero"
 efw_support_upgrade_2:0 "EFW: Support Weapons II"
 efw_support_upgrade_3:0 "EFW: Support Weapons III"
 efw_support_upgrade_4:0 "EFW: Support Weapons IV"
 efw_at_upgrade_1:0 "EFW: Miglioramenti anticarro I"
 efw_at_upgrade_2:0 "EFW: Miglioramenti anticarro II"

 efw_test.1.t:0 "EXPANDED FIELD WEAPONS v1.2 ATTIVA!"
 efw_test.1.d:0 "Support Weapons I sblocca tre linee produttive permanenti: Mitragliatrici, Mortai e Armi anticarro. Le ricerche Support Weapons successive migliorano direttamente le statistiche delle nuove unita."
 efw_test.1.a:0 "Perfetto."

 efw_improvised_naval_modules_unlock:0 "Programma Navale Improvvisato"

 efw_motorboat_engine:0 "Motore da Motobarca Improvvisato"
 efw_motorboat_engine_desc:0 "Un motore semplice per piccoli scafi costieri. Riduce drasticamente costo, autonomia e robustezza della nave."
 efw_motorboat_machinegun:0 "Postazione Mitragliatrice Navale"
 efw_motorboat_machinegun_desc:0 "Una postazione di mitragliatrice pesante adattata all'impiego navale."

 efw_midget_sub_engine:0 "Motore per Sommergibile Tascabile"
 efw_midget_sub_engine_desc:0 "Un piccolo sistema propulsivo per sommergibili di dimensioni minime."
 efw_midget_sub_torpedo:0 "Siluro Leggero per Mini-Sub"
 efw_midget_sub_torpedo_desc:0 "Un impianto silurante compatto destinato a sommergibili tascabili."
 efw_scrap_multirole_mount:0 "Affusto Multiruolo Improvvisato"
 efw_scrap_multirole_mount_desc:0 "Un affusto bivalente saldato con cannoni leggeri di recupero e mirini antiaerei artigianali. Aggiunge un moderato fuoco leggero e antiaereo e puo essere installato in piu slot, ma riduce leggermente velocita e affidabilita."
 efw_improvised_torpedo_rack:0 "Rastrelliera Siluri Improvvisata"
 efw_improvised_torpedo_rack_desc:0 "Una semplice rastrelliera da ponte per siluri di riserva e sgancio artigianale. Aggiunge un piccolo attacco silurante e probabilita di colpire, ed e impilabile, ma costa velocita e affidabilita."
 efw_improvised_depth_charge_rack:0 "Rastrelliera Cariche di Profondita Improvvisata"
 efw_improvised_depth_charge_rack_desc:0 "Una leggera rastrelliera per cariche di profondita con idrofoni di fortuna. Aggiunge un moderato attacco e rilevamento ASW, ed e impilabile, ma rallenta leggermente la nave e riduce l'affidabilita."
 efw_improvised_fuel_tank:0 "Serbatoio Ausiliario Improvvisato"
 efw_improvised_fuel_tank_desc:0 "Un serbatoio saldato con acciaio di recupero. Aumenta l'autonomia a basso costo, ma riduce leggermente velocita e affidabilita e puo perdere quando colpito."
 efw_wooden_sub_coating:0 "Rivestimento in Legno per Sommergibile"
 efw_wooden_sub_coating_desc:0 "Strati di legno trattato, tela e catrame sostituiscono il metallo scarso. Abbassa il costo di produzione, ma indebolisce lo scafo e rende il sommergibile piu facilmente rilevabile."
 efw_wooden_surface_refit:0 "Rifacimento in Legno per Unita di Superficie"
 efw_wooden_surface_refit_desc:0 "Un rifacimento di fortuna con sovrastrutture in legno e materiali non strategici. Abbassa il costo di produzione, ma indebolisce lo scafo, rallenta la nave e peggiora l'affidabilita."
 efw_improvised_mine_rack:0 "Rastrelliera Mine Improvvisata (10 Mine)"
 efw_improvised_mine_rack_desc:0 "Una semplice rastrelliera da ponte con circa dieci mine da contatto. Aumenta molto la capacita di posa mine a costo di velocita e affidabilita."
 efw_improvised_sub_mine_rack:0 "Rastrelliera Mine per Sommergibile (10 Mine)"
 efw_improvised_sub_mine_rack_desc:0 "Una compatta rastrelliera esterna per circa dieci mine. Aumenta molto la capacita di posa mine dei sommergibili con un piccolo costo in velocita e affidabilita."
 efw_small_sail:0 "Vela Piccola Improvvisata"
 efw_small_sail_desc:0 "Una piccola vela di tela issata sul ponte. Aumenta del 15% la velocita, ma rende la nave piu visibile e leggermente meno affidabile. Usa lo slot serbatoio carburante esistente."
 efw_large_sail:0 "Vela Grande Improvvisata"
 efw_large_sail_desc:0 "Un'enorme vela di fortuna che trasforma la nave in un veliero improvvisato. Aumenta del 25% la velocita, ma aumenta molto la visibilita e riduce affidabilita e robustezza. Usa lo slot serbatoio carburante esistente."
 efw_careened_hull:0 "Carena Pulita e Lucidata"
 efw_careened_hull_desc:0 "La carena viene raschiata, incatramata e lucidata, con rivestimento in rame improvvisato dove disponibile. Migliora affidabilita, velocita, autonomia e rilevamento, riducendo leggermente la visibilita e aggiungendo un po' di robustezza. Un solido modulo utility per lo slot serbatoio carburante."
 efw_fishing_net_armor:0 "Corazza Rete da Pesca"
 efw_fishing_net_armor_desc:0 "Reti mimetiche e reti da pesca aggrovigliate al posto della corazza. Riduce leggermente visibilita e danni da siluro e risparmia un po' di costo, ma non offre alcun valore di corazza."
 efw_wooden_plank_armor:0 "Corazza in Assi di Legno"
 efw_wooden_plank_armor_desc:0 "Assi di legno inchiodate sullo scafo. Protezione extra economica e un po' di robustezza, a costo di velocita e affidabilita."
 efw_scrap_plate_armor:0 "Corazza in Lamiera di Recupero"
 efw_scrap_plate_armor_desc:0 "Lastre d'acciaio di recupero saldate insieme. Protezione migliore del legno, ma piu pesante, lenta e meno affidabile."
 efw_fishing_net_armor_heavy:0 "Corazza Rete da Pesca (Pesante)"
 efw_fishing_net_armor_heavy_desc:0 "Reti mimetiche pesanti e reti da pesca tese su una nave capitale. Riduce leggermente visibilita e danni da siluro, ma non offre vera corazza."
 efw_wooden_plank_armor_heavy:0 "Corazza in Assi di Legno (Pesante)"
 efw_wooden_plank_armor_heavy_desc:0 "Enormi assi di legno inchiodate su uno scafo capitale. Protezione economica e robustezza extra, a costo di velocita e affidabilita."
 efw_scrap_plate_armor_heavy:0 "Corazza in Lamiera di Recupero (Pesante)"
 efw_scrap_plate_armor_heavy_desc:0 "Spesse lastre d'acciaio di recupero saldate su uno scafo capitale. Solida protezione improvvisata, ma pesante, lenta e inaffidabile."

 efw_wooden_fighter_equipment:0 "Caccia in Legno Improvvisato"
 efw_wooden_fighter_equipment_desc:0 "Un velivolo estremamente economico costruito con materiali non strategici e componenti semplici. Facile da produrre, ma lento, fragile e scarsamente armato."

 efw_tin_tank_equipment:0 "Carro Armato in Latta"
 efw_tin_tank_equipment_desc:0 "Un carro leggerissimo e rudimentale protetto da sottili piastre rivettate e armato principalmente con una mitragliatrice. Economico, ma vulnerabile praticamente a qualsiasi arma anticarro."

 efw_wooden_air_bba_unlock:0 "Programma Aereo Improvvisato"
 efw_wooden_air_legacy_unlock:0 "Programma Aereo Improvvisato"
 efw_tin_tank_nsb_unlock:0 "Programma Corazzato Improvvisato"
 efw_tin_tank_legacy_unlock:0 "Programma Corazzato Improvvisato"

 efw_national_mobilization_category:0 "Mobilitazione e Investimenti Nazionali"
 efw_national_mobilization_category_desc:0 "Una rete di propaganda, organizzazione del lavoro, ricerca e logistica può trasformare gradualmente il paese in una macchina economica e militare pienamente mobilitata."

 efw_propaganda_center:0 "Centro di Propaganda e Mobilitazione"
 efw_propaganda_center_desc:0 "Un centro amministrativo e propagandistico che coordina campagne politiche, reclutamento civile e mobilitazione dell'opinione pubblica."
 efw_labor_directorate:0 "Direzione del Lavoro Nazionale"
 efw_labor_directorate_desc:0 "Un organismo incaricato di coordinare manodopera, cantieri, produzione e sfruttamento delle risorse locali."
 efw_research_center:0 "Centro Nazionale di Ricerca"
 efw_research_center_desc:0 "Un complesso dedicato alla ricerca applicata e al coordinamento di istituti, università e laboratori nazionali."
 efw_logistics_center:0 "Centro Logistico e Difesa Civile"
 efw_logistics_center_desc:0 "Un centro regionale per scorte, trasporti, manutenzione, infrastrutture e organizzazione della difesa civile."

 modifier_production_speed_efw_propaganda_center_factor:0 "Velocità costruzione Centro di Propaganda"
 modifier_production_speed_efw_propaganda_center_factor_desc:0 "Modifica la velocità di costruzione dei Centri di Propaganda e Mobilitazione."
