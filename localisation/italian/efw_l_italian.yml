 efw_launch_national_investments_desc:0 "Dopo aver costruito almeno §Y2 Centri di Propaganda§!, possiamo spendere §Y75 Potere Politico§! per avviare un programma nazionale di investimenti. Sblocca le §YDirezioni del Lavoro Nazionale§! e accelera la costruzione di entrambi gli edifici."

