 modifier_state_production_efw_logistics_center_factor_desc:0 "Modifica la velocità locale di costruzione dei Centri Logistici."

 efw_national_investments_idea:0 "Programma di Investimenti Nazionali"
 efw_national_investments_idea_desc:0 "Lo Stato concentra risorse politiche e amministrative sull'espansione della rete di propaganda e sull'organizzazione nazionale del lavoro."
 efw_coordinated_economy_idea:0 "Economia Nazionale Coordinata"
 efw_coordinated_economy_idea_desc:0 "Industria, cantieri e amministrazione vengono coordinati da un piano economico centrale. La maggiore pressione sulla società comporta però un costo in stabilità."
 efw_research_funding_idea:0 "Finanziamenti alla Ricerca Nazionale"
 efw_research_funding_idea_desc:0 "Finanziamenti e procedure accelerate permettono di sviluppare più rapidamente una rete nazionale di centri di ricerca."
 efw_logistics_plan_idea:0 "Piano Nazionale delle Infrastrutture"
 efw_logistics_plan_idea_desc:0 "Il governo favorisce la creazione di centri logistici regionali e infrastrutture di supporto."
 efw_national_mobilization_idea:0 "Mobilitazione Nazionale"
 efw_national_mobilization_idea_desc:0 "L'intero apparato economico e amministrativo della nazione è orientato allo sforzo nazionale. La produzione aumenta sensibilmente, ma la pressione sulla società è considerevole."

 efw_commission_propaganda_center:0 "Costruire un Centro di Propaganda"
 efw_commission_propaganda_center_desc:0 "Impegnare §Y10.000 lavoratori pubblici§! per avviare la costruzione di un Centro di Propaganda e Mobilitazione nello stato selezionato."
 efw_commission_labor_directorate:0 "Istituire una Direzione del Lavoro"
 efw_commission_labor_directorate_desc:0 "Impegnare §Y20.000 lavoratori§! per costruire una Direzione del Lavoro Nazionale nello stato selezionato."
 efw_commission_research_center:0 "Costruire un Centro Nazionale di Ricerca"
 efw_commission_research_center_desc:0 "Impegnare §Y15.000 tecnici, ricercatori e personale§! per avviare un nuovo Centro Nazionale di Ricerca."
 efw_commission_logistics_center:0 "Costruire un Centro Logistico"
 efw_commission_logistics_center_desc:0 "Impegnare §Y12.000 lavoratori e personale logistico§! per creare un Centro Logistico e di Difesa Civile."

 efw_launch_national_investments:0 "Avviare gli Investimenti Nazionali"
 efw_launch_national_investments_desc:0 "Con una prima rete di propaganda già operativa, possiamo centralizzare gli investimenti pubblici e accelerare l'espansione del programma nazionale."
 efw_coordinate_national_economy:0 "Coordinare l'Economia Nazionale"
 efw_coordinate_national_economy_desc:0 "La rete amministrativa e del lavoro è sufficientemente estesa per coordinare industria, cantieri e mobilitazione economica su scala nazionale."
 efw_fund_national_research:0 "Finanziare la Ricerca Nazionale"
 efw_fund_national_research_desc:0 "Stanziare risorse politiche e amministrative per una rete di istituti di ricerca coordinati dallo Stato."
 efw_launch_national_infrastructure_plan:0 "Piano Nazionale delle Infrastrutture"
 efw_launch_national_infrastructure_plan_desc:0 "Creare un programma nazionale per scorte, logistica, trasporti e difesa civile."
 efw_mobilize_the_nation:0 "Mobilitare la Nazione"
 efw_mobilize_the_nation_desc:0 "Propaganda, lavoro, ricerca e logistica sono ormai sufficientemente sviluppati da consentire una mobilitazione economica nazionale completa."

 efw_issue_national_bonds:0 "Emettere Obbligazioni Nazionali"
 efw_issue_national_bonds_desc:0 "Otteniamo §G+100 Potere Politico§! immediatamente, ma tra §Y365 giorni§! dovremo ripagare §R150 Potere Politico§!."
 efw_issue_long_term_national_loan:0 "Grande Prestito Nazionale"
 efw_issue_long_term_national_loan_desc:0 "Otteniamo §G+120 Potere Politico§! immediatamente. Dopo §Y730 giorni§! dovremo ripagare §R200 Potere Politico§!."

 efw_national_mobilization.1.t:0 "Scadenza delle Obbligazioni Nazionali"
 efw_national_mobilization.1.d:0 "Le obbligazioni emesse un anno fa sono giunte a scadenza. Il governo deve ora onorare capitale e interessi, riducendo la propria capacità politica."
 efw_national_mobilization.1.a:0 "Onoreremo i nostri impegni."
 efw_national_mobilization.2.t:0 "Scadenza del Grande Prestito Nazionale"
 efw_national_mobilization.2.d:0 "Il prestito nazionale contratto due anni fa è giunto a scadenza. Capitale e interessi devono essere ripagati."
 efw_national_mobilization.2.a:0 "Il debito sarà ripagato."
 
