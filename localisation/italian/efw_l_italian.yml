 efw_national_mobilization_idea:0 "Mobilitazione Nazionale"
 efw_national_mobilization_idea_desc:0 "L'intero apparato economico e amministrativo della nazione è orientato allo sforzo nazionale."

 efw_launch_national_investments:0 "Avviare gli Investimenti Nazionali"
 efw_launch_national_investments_desc:0 "Richiede §Y2 Centri di Propaganda§! e costa §Y75 PP§!.\n\nEffetti: §G+25%§! costruzione Propaganda, §G+25%§! Direzioni del Lavoro e §G+5%§! costruzione generale."

 efw_coordinate_national_economy:0 "Coordinare l'Economia Nazionale"
 efw_coordinate_national_economy_desc:0 "Richiede Investimenti Nazionali, §Y5 Propaganda§!, §Y2 Direzioni del Lavoro§! e costa §Y100 PP§!."

 efw_mobilize_the_nation:0 "Mobilitare la Nazione"
 efw_mobilize_the_nation_desc:0 "Richiede Economia Coordinata, §Y5 Propaganda§!, §Y3 Direzioni del Lavoro§!, §Y2 Ricerca§!, §Y2 Logistica§! e costa §Y150 PP§!."

 efw_issue_national_bonds:0 "Emettere Obbligazioni Nazionali"
 efw_issue_national_bonds_desc:0 "Visibile dall'inizio. Richiede Investimenti Nazionali. §G+100 PP§! subito, §R-150 PP§! dopo §Y365 giorni§!."

 efw_issue_long_term_national_loan:0 "Grande Prestito Nazionale"
 efw_issue_long_term_national_loan_desc:0 "Visibile dall'inizio. Richiede Investimenti Nazionali. §G+120 PP§! subito, §R-200 PP§! dopo §Y730 giorni§!."

 efw_national_mobilization.1.t:0 "Scadenza delle Obbligazioni Nazionali"
 efw_national_mobilization.1.d:0 "Le obbligazioni sono giunte a scadenza. Capitale e interessi devono ora essere ripagati."
 efw_national_mobilization.1.a:0 "Onoreremo i nostri impegni."

 efw_national_mobilization.2.t:0 "Scadenza del Grande Prestito Nazionale"
 efw_national_mobilization.2.d:0 "Il grande prestito nazionale è giunto a scadenza."
 efw_national_mobilization.2.a:0 "Il debito sarà ripagato."
 efw_national_mobilization_category:0 "Mobilitazione e Investimenti Nazionali"
 efw_national_mobilization_category_desc:0 "Programmi economici, propaganda, lavoro, ricerca e logistica possono accelerare la preparazione nazionale già nei primi anni."

 efw_propaganda_center:0 "Centro di Propaganda e Mobilitazione"
 efw_propaganda_center_desc:0 "Centro amministrativo e propagandistico. Ogni centro aumenta il Potere Politico nazionale e fornisce piccoli bonus a stabilità e sostegno alla guerra."
 efw_labor_directorate:0 "Direzione del Lavoro Nazionale"
 efw_labor_directorate_desc:0 "Coordina manodopera, cantieri, produzione industriale e sfruttamento delle risorse locali."
 efw_research_center:0 "Centro Nazionale di Ricerca"
 efw_research_center_desc:0 "Coordina università, laboratori e istituti di ricerca applicata. Ogni centro aumenta la velocità di ricerca nazionale."
 efw_logistics_center:0 "Centro Logistico e Difesa Civile"
 efw_logistics_center_desc:0 "Centro regionale per scorte, trasporti, infrastrutture, manutenzione e difesa civile."

 modifier_production_speed_efw_propaganda_center_factor:0 "Velocità costruzione Centri di Propaganda"
 modifier_production_speed_efw_labor_directorate_factor:0 "Velocità costruzione Direzioni del Lavoro"
 modifier_production_speed_efw_research_center_factor:0 "Velocità costruzione Centri di Ricerca"
 modifier_production_speed_efw_logistics_center_factor:0 "Velocità costruzione Centri Logistici"

 efw_national_investments_idea:0 "Programma di Investimenti Nazionali"
 efw_national_investments_idea_desc:0 "Lo Stato concentra risorse e capacità amministrativa sulla rapida espansione dell'industria, della propaganda e dell'organizzazione del lavoro."
 efw_coordinated_economy_idea:0 "Economia Nazionale Coordinata"
 efw_coordinated_economy_idea_desc:0 "Industria, cantieri e amministrazione vengono coordinati in un unico programma economico nazionale."
 efw_national_mobilization_idea:0 "Mobilitazione Nazionale"
 efw_national_mobilization_idea_desc:0 "L'intero apparato economico e amministrativo della nazione è orientato allo sforzo nazionale."

 efw_industrialization_campaign_idea:0 "Campagna Nazionale di Industrializzazione"
 efw_industrialization_campaign_idea_desc:0 "Una grande parte della forza lavoro e delle capacità logistiche nazionali è stata concentrata sui nuovi cantieri industriali."
 efw_state_industry_subsidies_idea:0 "Sovvenzioni Statali all'Industria"
 efw_state_industry_subsidies_idea_desc:0 "Lo Stato finanzia direttamente imprese, cantieri e istituti di ricerca. Il programma accelera lo sviluppo ma aumenta sensibilmente il peso dei beni di consumo."
 efw_national_infrastructure_program_idea:0 "Programma Nazionale di Infrastrutture"
 efw_national_infrastructure_program_idea_desc:0 "Treni, tecnici e risorse vengono concentrati sulla modernizzazione delle infrastrutture e della rete ferroviaria."

 efw_early_industrialization_campaign:0 "Lanciare una Campagna di Industrializzazione"
 efw_early_industrialization_campaign_desc:0 "Costo: §Y25 PP§!.\n\nImpegna §R200.000 uomini§! e §R10 treni§!. Per §Y180 giorni§! otteniamo §G+20% Velocità di Costruzione§!.\n\nI treni vengono restituiti dopo 180 giorni. I 200.000 lavoratori tornano disponibili dopo §Y2 anni§!."

 efw_army_public_works:0 "Impiegare l'Esercito nei Lavori Pubblici"
 efw_army_public_works_desc:0 "Costo: §Y40 PP§!.\n\nImpegna §R100.000 uomini§! per un anno e utilizza personale militare e del genio per ampliare rapidamente la capacità produttiva civile.\n\nEffetto immediato: §G+4 Fabbriche Civili offsite§! permanenti. I 100.000 uomini vengono restituiti dopo §Y365 giorni§!."

 efw_state_industry_subsidies:0 "Sovvenzioni Statali all'Industria"
 efw_state_industry_subsidies_desc:0 "Costo: §Y50 PP§!.\n\nPer §Y2 anni§!: §R+10% Consumer Goods Factor§!, §G+6% Velocità di Ricerca§!, §G+3% Factory Output§!, §G+3% Dockyard Output§! e §G+10% Political Power Gain§!."

 efw_national_infrastructure_program:0 "Programma Nazionale di Infrastrutture"
 efw_national_infrastructure_program_desc:0 "Costo: §Y25 PP§! e §R5 treni§! per un anno.\n\nPer §Y365 giorni§!: §G+20% costruzione Infrastrutture§!, §G+20% costruzione Ferrovie§! e §G+5% Velocità di Costruzione§!. I treni vengono restituiti alla fine del programma."

 efw_launch_national_investments:0 "Avviare gli Investimenti Nazionali"
 efw_launch_national_investments_desc:0 "Richiede §Y1 Centro di Propaganda§! e costa §Y50 PP§!.\n\nEffetti permanenti: §G+40%§! costruzione Propaganda, §G+40%§! Direzioni del Lavoro, §G+10%§! Velocità di Costruzione generale e §G+5%§! Factory Output."
 efw_coordinate_national_economy:0 "Coordinare l'Economia Nazionale"
 efw_coordinate_national_economy_desc:0 "Richiede §YInvestimenti Nazionali§!, §Y3 Centri di Propaganda§!, §Y1 Direzione del Lavoro§! e costa §Y100 PP§!.\n\nFornisce forti bonus economici e accelera la costruzione dei Centri di Ricerca e Logistici."
 efw_mobilize_the_nation:0 "Mobilitare la Nazione"
 efw_mobilize_the_nation_desc:0 "Richiede §YEconomia Nazionale Coordinata§!, §Y4 Propaganda§!, §Y2 Direzioni del Lavoro§!, §Y1 Centro di Ricerca§!, §Y1 Centro Logistico§! e costa §Y150 PP§!."

 efw_issue_national_bonds:0 "Emettere Obbligazioni Nazionali"
 efw_issue_national_bonds_desc:0 "Richiede Investimenti Nazionali.\n\n§G+100 PP§! immediatamente; dopo §Y365 giorni§! vengono sottratti §R150 PP§!."
 efw_issue_long_term_national_loan:0 "Grande Prestito Nazionale"
 efw_issue_long_term_national_loan_desc:0 "Richiede Investimenti Nazionali.\n\n§G+120 PP§! immediatamente; dopo §Y730 giorni§! vengono sottratti §R200 PP§!."

 efw_national_mobilization.1.t:0 "Scadenza delle Obbligazioni Nazionali"
 efw_national_mobilization.1.d:0 "Le obbligazioni nazionali sono giunte a scadenza. Capitale e interessi devono ora essere ripagati."
 efw_national_mobilization.1.a:0 "Onoreremo i nostri impegni."
 efw_national_mobilization.2.t:0 "Scadenza del Grande Prestito Nazionale"
 efw_national_mobilization.2.d:0 "Il grande prestito nazionale è giunto a scadenza."
 efw_national_mobilization.2.a:0 "Il debito sarà ripagato."

 efw_pipe_gun_rifle:0 "Fucile artigianale a tubo"
 efw_pipe_gun_rifle_short:0 "Fucile a tubo"
 efw_pipe_gun_rifle_desc:0 "Un'arma grezza e improvvisata, assemblata rapidamente usando tubi idraulici e componenti di recupero. Rudimentale, inaffidabile e priva di qualsiasi standard industriale, ma capace di essere prodotta con risorse quasi inesistenti."

 efw_army_munitions_works:0 "Costruzione Arsenali dell'Esercito"
 efw_army_munitions_works_desc:0 "Mobilita 100.000 coscritti nei programmi di produzione militare per un anno per costruire permanentemente 4 fabbriche militari fuori mappa."

 efw_naval_yard_expansion:0 "Espansione Cantieri Navali"
 efw_naval_yard_expansion_desc:0 "Assegna 100.000 coscritti alle infrastrutture marittime per un anno, realizzando permanentemente 4 cantieri navali fuori mappa."




 efw_national_mobilization_category:0 "Mobilitazione Economica Nazionale"
 efw_national_mobilization_category_desc:0 "Piani strategici di coordinamento industriale, infrastrutturale e sociale per massimizzare la preparazione bellica del paese."

 efw_industrial_plan_phase_1:0 "Piano Industriale: Fase I — Rilancio e Fondazioni"
 efw_industrial_plan_phase_1_desc:0 "Investe capitali, convogli ferroviari e manodopera per costruire le fondamenta della rinascita industriale nazionale. Fornisce subito §G+8 Fabbriche Civili§! e §G+2 Fabbriche Militari§! e accelera la costruzione. Al termine dei 180 giorni renderà accessibile la Fase II."
 efw_industrial_phase_1_idea:0 "Piano Industriale: Mobilitazione Fase I"

 efw_industrial_plan_phase_2:0 "Piano Industriale: Fase II — Consolidamento Pesante"
 efw_industrial_plan_phase_2_desc:0 "La seconda e decisiva tappa dell'espansione industriale. Integra altri §G+7 Complessi Civili§! e §G+4 Stabilimenti d'Armamento§! nella rete produttiva. Al termine dei lavori, i mezzi logistici e parte della manodopera torneranno alle proprie mansioni."
 efw_industrial_phase_2_idea:0 "Piano Industriale: Mobilitazione Fase II"

 efw_national_mobilization.30.t:0 "Piano Industriale: Completamento Fase I"
 efw_national_mobilization.30.d:0 "I primi cantieri pesanti e gli impianti metallurgici sono entrati in servizio con successo. Con le basi operative completate, la nazione è ora pronta a lanciare la Fase II del programma."
 efw_national_mobilization.30.a:0 "Avanti con la Fase II!"

 efw_national_mobilization.31.t:0 "Piano Industriale: Trionfo Produttivo"
 efw_national_mobilization.31.d:0 "Ad un anno esatto dall'avvio del piano, l'intero apparato produttivo è completato: 15 complessi civili e 6 stabilimenti bellici lavorano a pieno regime. I convogli e i mezzi speciali vengono restituiti alle riserve nazionali."
 efw_national_mobilization.31.a:0 "Un colosso industriale è nato!"

 efw_grand_public_works:0 "Mobilitazione delle Grandi Opere Nazionali"
 efw_grand_public_works_desc:0 "Impiega il genio civile e una flotta di autocarri per ampliare il potenziale del territorio metropolitano. Aggiunge §G+1 Infrastruttura§! (se inferiore a 5) e §G+2 Slot Fabbrica§! in tutti gli stati nazionali Core, garantendo inoltre un bonus del §G+30%§! alla velocità di costruzione per 540 giorni."
 efw_grand_works_idea:0 "Corsa alle Grandi Opere"

 efw_social_welfare_and_workshops:0 "Patto Sociale e Produzione Diffusa"
 efw_social_welfare_and_workshops_desc:0 "Combina il supporto demografico alle famiglie numerose con la razionalizzazione logistica della fitta rete di botteghe artigiane. Aumenta costantemente la popolazione e il manpower di riserva, stimola la ricerca e innalza il rendimento e il tetto massimo di efficienza delle linee produttive per 3 anni."
 efw_social_welfare_workshops_idea:0 "Patto Sociale e Officine Diffuse"

 efw_emergency_naval_program:0 "Programma Navale Straordinario"
 efw_emergency_naval_program_desc:0 "Concentra manodopera specializzata edili e forniture per istituire §G+6 Cantieri Navali offsite permanenti§!. Il personale e i mezzi logistici requisiti verranno restituiti alla riserva al termine dell'anno di mobilitazione."

 efw_issue_national_bonds:0 "Emissione di Obbligazioni Statali"
 efw_issue_national_bonds_desc:0 "Emette titoli di debito pubblico per ottenere immediatamente §G+120 Potere Politico§!. Dopo 365 giorni lo Stato dovrà saldare il debito con gli interessi rimettendo §R-180 Potere Politico§!."
 efw_national_mobilization.34.t:0 "Scadenza delle Obbligazioni Statali"
 efw_national_mobilization.34.d:0 "I titoli di debito emessi l'anno scorso sono giunti a maturazione. Il tesoro deve saldare gli interessi agli investitori nazionali per preservare il credito e la fiducia politica."
 efw_national_mobilization.34.a:0 "Onoriamo i nostri impegni finanziari."

 efw_coordinate_national_economy:0 "Coordinamento dell'Economia Nazionale"
 efw_coordinate_national_economy_desc:0 "Coordina l'azione dei Centri di Propaganda e della Direzione del Lavoro verso una pianificazione economica centralizzata, aumentando la produzione industriale e navale e accelerando la costruzione dei centri avanzati."
 efw_coordinated_economy_idea:0 "Economia Nazionale Coordinata"

 efw_mobilize_the_nation:0 "Piena Mobilitazione Nazionale"
 efw_mobilize_the_nation_desc:0 "Il vertice dell'impegno economico e statale: salda propaganda, lavoro, ricerca e logistica in una sola macchina da guerra. Fornisce massimi incrementi alla conscrizione e all'output produttivo a fronte di un moderato sforzo sociale."
 efw_national_mobilization_idea:0 "Mobilitazione Totale della Nazione"


  efw_wooden_construction:0 "Struttura Leggera in Legno"
 efw_wooden_construction_desc:0 "Fusoliera e longheroni in compensato e tela trattata. Abbassa drasticamente i costi industriali del velivolo."

 efw_wooden_frame_component:0 "Pannellatura Strutturale in Legno"
 efw_wooden_frame_component_desc:0 "Sostituisce componenti metallici con legno e tela. Riduce peso e costo IC a fronte di una minore integrità. Può essere installato più volte."

 efw_extended_fuel_tank:0 "Serbatoio Ausiliario Esterno"
 efw_extended_fuel_tank_desc:0 "Serbatoio sganciabile subalare che incrementa considerevolmente l'autonomia operativa."

 efw_airdrop_supply_pod:0 "Pod Rifornimento Aviolanciato"
 efw_airdrop_supply_pod_desc:0 "Contenitori d'emergenza con paracadute per rifornire truppe isolate e fornire supporto tattico al suolo."

 efw_boost_power_system:0 "Sistema di Sovralimentazione 'Burst Power'"
 efw_boost_power_system_desc:0 "Compressore ausiliario che incrementa la velocità massima e genera spinta aggiuntiva per sostenere carichi pesanti."

 efw_universal_hardpoint:0 "Gancio Universale per Armamenti Speciali"
 efw_universal_hardpoint_desc:0 "Attacco subalare polivalente: attiva bombe in CAS, fuoco ausiliario in superiorità aerea o siluri e cariche in missioni navali."

 efw_plywood_frame_module:0 "Plywood & Fabric Airframe"
 efw_plywood_frame_module_desc:0 "Replaces scarce aluminum with glued plywood sheets and treated canvas. Drastically slashes industrial cost and weight, offering sublime agility at the cost of fragile survivability."

 efw_overboost_compressor_module:0 "Handmade 'Overboost' Compressor"
 efw_overboost_compressor_module_desc:0 "Overclocks the engine manifold with high-pressure alcohol injection. Grants phenomenal engine thrust (+8 Thrust) and top speed at the expense of severe mechanical wear."

 efw_improvised_bomb_rack_module:0 "Improvised Shrapnel & Bomb Rack"
 efw_improvised_bomb_rack_module_desc:0 "Underwing racks fitting ground mortar rounds and cluster munitions. Enables expedient light aircraft to deliver blistering close air support against enemy formations (+6 Ground Attack)."

 efw_infantry_mg_pod_module:0 "Infantry Heavy Machine Gun Pod"
 efw_infantry_mg_pod_module_desc:0 "Repurposes ground infantry machine guns into wing-mounted pods. Turns low-cost aircraft into deadly, high-firepower interceptors in close-in dogfights (+8 Air Attack)."

 efw_paper_drop_tank_module:0 "Pressed-Paper Drop Tanks"
 efw_paper_drop_tank_module_desc:0 "Disposable external fuel tanks crafted from lacquered papier-mache and cheap resin. Grants immense operational range at almost zero cost, but poses severe fire hazards when hit."

 efw_stripped_cockpit_module:0 "Stripped Cockpit & Ring Sight"
 efw_stripped_cockpit_module_desc:0 "Strips cockpit armor, heating, and heavy avionics down to an open canopy and simple wire-ring sight. Saves weight and boosts gunnery response, leaving the pilot completely exposed."

 efw_wooden_boost_airframe:0 "Telaio in Legno e Compressore Overboost"
 efw_wooden_boost_airframe_desc:0 "Sostituisce le leghe metalliche con compensato ultraleggero e modifica il motore con iniezione ad alta pressione. Riduce sensibilmente peso e costo di fabbricazione, con incrementi moderati di velocità e spinta (+5 Thrust). Ogni copia costa il 6% di affidabilità e l'8% di difesa aerea, ma le penalità si sommano in modo morbido: due o tre copie restano utilizzabili e rendono comunque il velivolo molto più economico."

 efw_improvised_drop_tank:0 "Serbatoio Ausiliario in Carta Pressata"
 efw_improvised_drop_tank_desc:0 "Serbatoio sganciabile economico realizzato in cartone laccato e resina. Aumenta notevolmente il raggio d'azione del velivolo (+300 km) a costo irrisorio, ma risulta vulnerabile alle fiamme."

 efw_multirole_combat_rack:0 "Rastrelliera d'Armamento Polivalente da Campo"
 efw_multirole_combat_rack_desc:0 "Una rastrelliera compatta da campo che trasforma qualsiasi cellula in un velivolo multiruolo discreto: +2 attacco aereo, +2 attacco al suolo, +2 bombardamento strategico, +2 attacco navale e +2 mira navale. Abilita anche superiorità aerea, intercettazione, CAS, attacco alla logistica, attacco navale, pattugliamento navale, attacco ai porti e bombardamento strategico. La maggiore resistenza aerodinamica costa 15 di velocità massima e 1,5 di agilità, ma il modulo è impilabile: bonus e penalità si sommano."

 
 efw_cast_iron_stove_armor:0 "Blindatura Improvvisata 'Stufa da Campo'"
 efw_cast_iron_stove_armor_desc:0 "Una pesante piastra di ghisa o un coperchio di tombino fissato sotto il sedile del pilota. Garantisce una solida protezione balistica (+7 Difesa), ma appesantisce notevolmente la cellula (+4 Peso) riducendo leggermente velocità massima e autonomia."

 efw_bazooka_charlie_tubes:0 "Tubi Lanciarazzi 'Bazooka Charlie'"
 efw_bazooka_charlie_tubes_desc:0 "Una batteria di tubi lanciarazzi di fanteria saldati a mano sotto i montanti alari. Sgancia salve devastating contro divisioni corazzate e bersagli navali (+8 Attacco al Suolo), ma il costo industriale e il peso sono consistenti, peggiorando sensibilmente agilità e difesa del velivolo."