l_italian:
 EFW_MOD_NAME:0 "Expanded Field Weapons"

 efw_machinegun_equipment:0 "Mitragliatrici di supporto"
 efw_machinegun_equipment_desc:0 "Mitragliatrici leggere, medie e pesanti astratte in una singola categoria produttiva. Il materiale rimane lo stesso: l'efficacia delle unita aumenta con la ricerca Support Weapons."
 efw_machinegun_equipment_standard:0 "Mitragliatrici"
 efw_machinegun_equipment_standard_short:0 "Mitragliatrici"

 efw_mortar_equipment:0 "Mortai da fanteria"
 efw_mortar_equipment_desc:0 "Mortai leggeri e medi per il fuoco indiretto organico della fanteria."
 efw_mortar_equipment_standard:0 "Mortai"
 efw_mortar_equipment_standard_short:0 "Mortai"

 efw_antitank_equipment:0 "Armi anticarro portatili"
 efw_antitank_equipment_desc:0 "Armi anticarro organiche della fanteria, dai primi sistemi portatili alle tattiche e munizioni migliorate rappresentate dai bonus tecnologici."
 efw_antitank_equipment_standard:0 "Armi anticarro"
 efw_antitank_equipment_standard_short:0 "Armi AT"

 efw_machinegun_company:0 "Compagnia mitragliatrici"
 efw_machinegun_company_desc:0 "Compagnia di supporto dedicata al fuoco automatico sostenuto. Consuma Mitragliatrici EFW."
 efw_mortar_company:0 "Compagnia mortai"
 efw_mortar_company_desc:0 "Compagnia di supporto per il fuoco indiretto a corto raggio. Consuma Mortai EFW."
 efw_antitank_company:0 "Compagnia anticarro"
 efw_antitank_company_desc:0 "Squadre anticarro portatili integrate nella formazione. Consuma Armi anticarro EFW."
 efw_elite_heavy_weapons_battalion:0 "Battaglione d'elite armi pesanti"
 efw_elite_heavy_weapons_battalion_desc:0 "Battaglione di linea costoso e logisticamente pesante che combina mitragliatrici, mortai e armi anticarro con fanteria scelta."

 efw_unlock_core_weapons:0 "EFW: Armi di supporto integrate"
 efw_support_upgrade_2:0 "EFW: Support Weapons II"
 efw_support_upgrade_3:0 "EFW: Support Weapons III"
 efw_support_upgrade_4:0 "EFW: Support Weapons IV"
 efw_at_upgrade_1:0 "EFW: Miglioramenti anticarro I"
 efw_at_upgrade_2:0 "EFW: Miglioramenti anticarro II"

 efw_test.1.t:0 "EXPANDED FIELD WEAPONS v1.2 ATTIVA!"
 efw_test.1.d:0 "Support Weapons I sblocca tre linee produttive permanenti: Mitragliatrici, Mortai e Armi anticarro. Le ricerche Support Weapons successive migliorano direttamente le statistiche delle nuove unita."
 efw_test.1.a:0 "Perfetto."

 efw_improvised_naval_modules_unlock:0 "Programma Navale Improvvisato"

 efw_motorboat_engine:0 "Motore da Motobarca Improvvisato"
 efw_motorboat_engine_desc:0 "Un motore semplice per piccoli scafi costieri. Riduce drasticamente costo, autonomia e robustezza della nave."
 efw_motorboat_machinegun:0 "Postazione Mitragliatrice Navale"
 efw_motorboat_machinegun_desc:0 "Una postazione di mitragliatrice pesante adattata all'impiego navale."

 efw_midget_sub_engine:0 "Motore per Sommergibile Tascabile"
 efw_midget_sub_engine_desc:0 "Un piccolo sistema propulsivo per sommergibili di dimensioni minime."
 efw_midget_sub_torpedo:0 "Siluro Leggero per Mini-Sub"
 efw_midget_sub_torpedo_desc:0 "Un impianto silurante compatto destinato a sommergibili tascabili."

 efw_wooden_fighter_equipment:0 "Caccia in Legno Improvvisato"
 efw_wooden_fighter_equipment_desc:0 "Un velivolo estremamente economico costruito con materiali non strategici e componenti semplici. Facile da produrre, ma lento, fragile e scarsamente armato."

 efw_tin_tank_equipment:0 "Carro Armato in Latta"
 efw_tin_tank_equipment_desc:0 "Un carro leggerissimo e rudimentale protetto da sottili piastre rivettate e armato principalmente con una mitragliatrice. Economico, ma vulnerabile praticamente a qualsiasi arma anticarro."

 efw_wooden_air_bba_unlock:0 "Programma Aereo Improvvisato"
 efw_wooden_air_legacy_unlock:0 "Programma Aereo Improvvisato"
 efw_tin_tank_nsb_unlock:0 "Programma Corazzato Improvvisato"
 efw_tin_tank_legacy_unlock:0 "Programma Corazzato Improvvisato"

 efw_national_mobilization_category:0 "Mobilitazione e Investimenti Nazionali"
 efw_national_mobilization_category_desc:0 "Una rete di propaganda, organizzazione del lavoro, ricerca e logistica può trasformare gradualmente il paese in una macchina economica e militare pienamente mobilitata."

 efw_propaganda_center:0 "Centro di Propaganda e Mobilitazione"
 efw_propaganda_center_desc:0 "Un centro amministrativo e propagandistico che coordina campagne politiche, reclutamento civile e mobilitazione dell'opinione pubblica."
 efw_labor_directorate:0 "Direzione del Lavoro Nazionale"
 efw_labor_directorate_desc:0 "Un organismo incaricato di coordinare manodopera, cantieri, produzione e sfruttamento delle risorse locali."
 efw_research_center:0 "Centro Nazionale di Ricerca"
 efw_research_center_desc:0 "Un complesso dedicato alla ricerca applicata e al coordinamento di istituti, università e laboratori nazionali."
 efw_logistics_center:0 "Centro Logistico e Difesa Civile"
 efw_logistics_center_desc:0 "Un centro regionale per scorte, trasporti, manutenzione, infrastrutture e organizzazione della difesa civile."

 modifier_production_speed_efw_propaganda_center_factor:0 "Velocità costruzione Centro di Propaganda"
 modifier_production_speed_efw_propaganda_center_factor_desc:0 "Modifica la velocità di costruzione dei Centri di Propaganda e Mobilitazione."
 modifier_state_production_efw_propaganda_center_factor:0 "Velocità locale costruzione Centro di Propaganda"
 modifier_state_production_efw_propaganda_center_factor_desc:0 "Modifica la velocità locale di costruzione dei Centri di Propaganda."
 modifier_production_speed_efw_labor_directorate_factor:0 "Velocità costruzione Direzione del Lavoro"
 modifier_production_speed_efw_labor_directorate_factor_desc:0 "Modifica la velocità di costruzione delle Direzioni del Lavoro Nazionale."
 modifier_state_production_efw_labor_directorate_factor:0 "Velocità locale costruzione Direzione del Lavoro"
 modifier_state_production_efw_labor_directorate_factor_desc:0 "Modifica la velocità locale di costruzione delle Direzioni del Lavoro."
 modifier_production_speed_efw_research_center_factor:0 "Velocità costruzione Centro di Ricerca"
 modifier_production_speed_efw_research_center_factor_desc:0 "Modifica la velocità di costruzione dei Centri Nazionali di Ricerca."
 modifier_state_production_efw_research_center_factor:0 "Velocità locale costruzione Centro di Ricerca"
 modifier_state_production_efw_research_center_factor_desc:0 "Modifica la velocità locale di costruzione dei Centri di Ricerca."
 modifier_production_speed_efw_logistics_center_factor:0 "Velocità costruzione Centro Logistico"
 modifier_production_speed_efw_logistics_center_factor_desc:0 "Modifica la velocità di costruzione dei Centri Logistici e di Difesa Civile."
 modifier_state_production_efw_logistics_center_factor:0 "Velocità locale costruzione Centro Logistico"
 modifier_state_production_efw_logistics_center_factor_desc:0 "Modifica la velocità locale di costruzione dei Centri Logistici."

 efw_national_investments_idea:0 "Programma di Investimenti Nazionali"
 efw_national_investments_idea_desc:0 "Lo Stato concentra risorse politiche e amministrative sull'espansione della rete di propaganda e sull'organizzazione nazionale del lavoro."
 efw_coordinated_economy_idea:0 "Economia Nazionale Coordinata"
 efw_coordinated_economy_idea_desc:0 "Industria, cantieri e amministrazione vengono coordinati da un piano economico centrale. La maggiore pressione sulla società comporta però un costo in stabilità."
 efw_research_funding_idea:0 "Finanziamenti alla Ricerca Nazionale"
 efw_research_funding_idea_desc:0 "Finanziamenti e procedure accelerate permettono di sviluppare più rapidamente una rete nazionale di centri di ricerca."
 efw_logistics_plan_idea:0 "Piano Nazionale delle Infrastrutture"
 efw_logistics_plan_idea_desc:0 "Il governo favorisce la creazione di centri logistici regionali e infrastrutture di supporto."
 efw_national_mobilization_idea:0 "Mobilitazione Nazionale"
 efw_national_mobilization_idea_desc:0 "L'intero apparato economico e amministrativo della nazione è orientato allo sforzo nazionale. La produzione aumenta sensibilmente, ma la pressione sulla società è considerevole."

 efw_commission_propaganda_center:0 "Costruire un Centro di Propaganda"
 efw_commission_propaganda_center_desc:0 "Impegnare §Y10.000 lavoratori pubblici§! per avviare la costruzione di un Centro di Propaganda e Mobilitazione nello stato selezionato."
 efw_commission_labor_directorate:0 "Istituire una Direzione del Lavoro"
 efw_commission_labor_directorate_desc:0 "Impegnare §Y20.000 lavoratori§! per costruire una Direzione del Lavoro Nazionale nello stato selezionato."
 efw_commission_research_center:0 "Costruire un Centro Nazionale di Ricerca"
 efw_commission_research_center_desc:0 "Impegnare §Y15.000 tecnici, ricercatori e personale§! per avviare un nuovo Centro Nazionale di Ricerca."
 efw_commission_logistics_center:0 "Costruire un Centro Logistico"
 efw_commission_logistics_center_desc:0 "Impegnare §Y12.000 lavoratori e personale logistico§! per creare un Centro Logistico e di Difesa Civile."

 efw_launch_national_investments:0 "Avviare gli Investimenti Nazionali"
 efw_launch_national_investments_desc:0 "Con una prima rete di propaganda già operativa, possiamo centralizzare gli investimenti pubblici e accelerare l'espansione del programma nazionale."
 efw_coordinate_national_economy:0 "Coordinare l'Economia Nazionale"
 efw_coordinate_national_economy_desc:0 "La rete amministrativa e del lavoro è sufficientemente estesa per coordinare industria, cantieri e mobilitazione economica su scala nazionale."
 efw_fund_national_research:0 "Finanziare la Ricerca Nazionale"
 efw_fund_national_research_desc:0 "Stanziare risorse politiche e amministrative per una rete di istituti di ricerca coordinati dallo Stato."
 efw_launch_national_infrastructure_plan:0 "Piano Nazionale delle Infrastrutture"
 efw_launch_national_infrastructure_plan_desc:0 "Creare un programma nazionale per scorte, logistica, trasporti e difesa civile."
 efw_mobilize_the_nation:0 "Mobilitare la Nazione"
 efw_mobilize_the_nation_desc:0 "Propaganda, lavoro, ricerca e logistica sono ormai sufficientemente sviluppati da consentire una mobilitazione economica nazionale completa."

 efw_issue_national_bonds:0 "Emettere Obbligazioni Nazionali"
 efw_issue_national_bonds_desc:0 "Otteniamo §G+100 Potere Politico§! immediatamente, ma tra §Y365 giorni§! dovremo ripagare §R150 Potere Politico§!."
 efw_issue_long_term_national_loan:0 "Grande Prestito Nazionale"
 efw_issue_long_term_national_loan_desc:0 "Otteniamo §G+120 Potere Politico§! immediatamente. Dopo §Y730 giorni§! dovremo ripagare §R200 Potere Politico§!."

 efw_national_mobilization.1.t:0 "Scadenza delle Obbligazioni Nazionali"
 efw_national_mobilization.1.d:0 "Le obbligazioni emesse un anno fa sono giunte a scadenza. Il governo deve ora onorare capitale e interessi, riducendo la propria capacità politica."
 efw_national_mobilization.1.a:0 "Onoreremo i nostri impegni."
 efw_national_mobilization.2.t:0 "Scadenza del Grande Prestito Nazionale"
 efw_national_mobilization.2.d:0 "Il prestito nazionale contratto due anni fa è giunto a scadenza. Capitale e interessi devono essere ripagati."
 efw_national_mobilization.2.a:0 "Il debito sarà ripagato."
 
