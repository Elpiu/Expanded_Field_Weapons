l_italian:
 # === EVENTO DI BENVENUTO ===
 efw_welcome.1.t:0 "Un Ispettore con un Tubo Idraulico"
 efw_welcome.1.d:0 "Un funzionario del Ministero degli Armamenti entra senza bussare. Sotto il braccio ha un tubo idraulico, un rotolo di nastro isolante e una cartella con scritto §YEXPANDED FIELD WEAPONS§!.\n\n«Eccellenza, abbiamo mitragliatrici, mortai e anticarro in linee di produzione dedicate, con §YSupport Weapons I§!. Un fucile che non costa acciaio. Un caccia di legno, navi a vela e una flotta di motoscafi. E quattro nuove sezioni di leggi.»\n\nPoi abbassa la voce: «Ma la vera novità sono le §YVocazioni Nazionali§!. Scegliete una strada, costruite gli edifici giusti, approvate le leggi giuste... e il ministero moltiplicherà tutto. Fino a §G+40% di ricerca§!, se siete abbastanza testardi.»\n\nAppoggia il tubo sulla scrivania. «Intanto, un piccolo regalo di benvenuto. Cosa preferite?»"
 efw_welcome.1.a:0 "«Ai laboratori!»"
 efw_welcome.1.b:0 "«Più fabbriche, meno chiacchiere.»"
 efw_welcome.1.c:0 "«Il soldato prima di tutto.»"
 efw_welcome.1.e:0 "«Abbiamo trovato dei tubi in cantina.»"
 efw_welcome.1.f:0 "«Niente regali. Ho una guerra da preparare.»"
 efw_welcome_vocation_tt:0 "§YSuggerimento:§! la categoria di decisioni §YVocazioni Nazionali§! spiega come trasformare questo regalo in un bonus permanente."
 efw_welcome_research_idea:0 "Entusiasmo nei Laboratori"
 efw_welcome_research_idea_desc:0 "I ricercatori hanno ricevuto una lettera di incoraggiamento dal governo. L'hanno incorniciata."
 efw_welcome_industry_idea:0 "Primi Cantieri"
 efw_welcome_industry_idea_desc:0 "Ruspe nuove, caschi nuovi, stessi operai. Ma motivati."
 efw_welcome_army_idea:0 "Reclute Motivate"
 efw_welcome_army_idea_desc:0 "Il sergente ha promesso una licenza a chi impara a montare il fucile bendato."

 # === CATEGORIA ===
 efw_vocation_category:0 "Vocazioni Nazionali"
 efw_vocation_category_desc:0 "Ogni nazione è brava in qualcosa. Sceglietene §YUNA§! e puntateci tutto: ogni livello richiede edifici EFW e leggi a tema, e al terzo livello il bonus diventa enorme. Ma chi è specializzato in tutto non è specializzato in niente: i malus colpiscono gli altri campi.\n\n§RUna sola vocazione per nazione. Tra un livello e l'altro passano 120 giorni.§!"
 efw_vocation_settling_tt:0 "Il ministero si sta ancora organizzando (servono §Y120 giorni§! tra un livello e l'altro)"
 efw_vocation_crisis_tt:0 "Non è in corso una §RCrisi d'Identità Nazionale§!"

 # === REPUBBLICA DEGLI SCIENZIATI ===
 efw_vocation_research_1:0 "Vocazione: Repubblica degli Scienziati"
 efw_vocation_research_1_desc:0 "Microscopi al posto dei cannoni: la nazione punta tutto sulla ricerca.\n\n§YIl percorso:§!\n§YI§! §G+10% ricerca§!\n§YII§! §G+22% ricerca§!: 2 Centri Nazionali di Ricerca, 4 slot di ricerca e una legge tra Borse di Studio, Università d'Eccellenza, Scambi Scientifici o Ricerca Militare\n§YIII§! §G+40% ricerca§!: 4 Centri di Ricerca, 5 slot di ricerca, Università d'Eccellenza o Scambi Scientifici, Borse di Ricerca o Città della Scienza\n\n§RMalus crescenti:§! beni di consumo, produzione militare e, alla fine, supporto alla guerra."
 efw_vocation_research_2:0 "Scienziati: il Grande Laboratorio"
 efw_vocation_research_2_desc:0 "I professori hanno chiesto più fondi. Stranamente, li hanno ottenuti."
 efw_vocation_research_3:0 "Scienziati: Cervelli al Potere"
 efw_vocation_research_3_desc:0 "Il consiglio dei ministri ora si riunisce in un'aula universitaria. Le slide sono obbligatorie."
 efw_voc_research_1:0 "Repubblica degli Scienziati I"
 efw_voc_research_1_desc:0 "Ogni scuola ha un laboratorio, ogni laboratorio ha un sogno."
 efw_voc_research_2:0 "Repubblica degli Scienziati II"
 efw_voc_research_2_desc:0 "Le fabbriche cedono ingegneri ai laboratori. Le fabbriche non sono contente."
 efw_voc_research_3:0 "Repubblica degli Scienziati III"
 efw_voc_research_3_desc:0 "La nazione pensa più in fretta di chiunque altro. Combattere, invece, le piace meno."

 # === OFFICINA DELLA NAZIONE ===
 efw_vocation_industry_1:0 "Vocazione: Officina della Nazione"
 efw_vocation_industry_1_desc:0 "Ciminiere, turni e sirene: la nazione diventa una fabbrica.\n\n§YIl percorso:§!\n§YI§! §G+6% produzione, +8% costruzione§!\n§YII§! §G+14% produzione, +15% costruzione, +10% crescita efficienza§!: 2 Direzioni del Lavoro e una legge tra Industria Pesante, Piano Quinquennale o Organizzazione Scientifica del Lavoro\n§YIII§! §G+28% produzione, +25% costruzione, +20% crescita efficienza, +5% efficienza massima§!: 4 Direzioni del Lavoro, 2 Centri di Propaganda, Industria Pesante o Piano Quinquennale, una legge tra Turni Lunghi, Mobilitazione del Lavoro o Corporativismo\n\n§RMalus crescenti:§! ricerca, stabilità e crescita della popolazione."
 efw_vocation_industry_2:0 "Officina: Ciminiere Ovunque"
 efw_vocation_industry_2_desc:0 "Il cielo è grigio, il PIL è verde."
 efw_vocation_industry_3:0 "Officina: il Paese è una Fabbrica"
 efw_vocation_industry_3_desc:0 "La sirena del turno di notte è diventata l'inno non ufficiale."
 efw_voc_industry_1:0 "Officina della Nazione I"
 efw_voc_industry_1_desc:0 "Il primo turno inizia alle sei. Il secondo pure, ma da un'altra parte."
 efw_voc_industry_2:0 "Officina della Nazione II"
 efw_voc_industry_2_desc:0 "Ogni città ha una fabbrica. Alcune città sono una fabbrica."
 efw_voc_industry_3:0 "Officina della Nazione III"
 efw_voc_industry_3_desc:0 "La nazione produce più di chiunque altro. I cittadini dormono quando possono."

 # === NAZIONE IN ARMI ===
 efw_vocation_army_1:0 "Vocazione: Nazione in Armi"
 efw_vocation_army_1_desc:0 "Ogni piazza ha una caserma, ogni ragazzo uno zaino.\n\n§YIl percorso:§!\n§YI§! §G+3% attacco e difesa, -5% addestramento§!\n§YII§! §G+8% attacco e difesa, +3% coscrizione, -10% addestramento§!: 2 Centri di Propaganda e una legge tra Armi Pesanti per Tutti, Squadre d'Assalto o Difesa in Profondità\n§YIII§! §G+16% attacco e difesa, +5% organizzazione, +6% coscrizione, -20% addestramento, +15% esperienza§!: 4 Centri di Propaganda, 2 Centri Logistici, una legge delle Armi da Campo da 100 PP e una tra Scuola di Guerra, Stato Maggiore Generale o Quadri Veterani\n\n§RMalus crescenti:§! ricerca, beni di consumo e stabilità."
 efw_vocation_army_2:0 "Armi: Ogni Cittadino un Soldato"
 efw_vocation_army_2_desc:0 "Anche il postino sa smontare una mitragliatrice. Le lettere arrivano in ritardo."
 efw_vocation_army_3:0 "Armi: Caserma Nazionale"
 efw_vocation_army_3_desc:0 "La sveglia suona alle cinque in tutto il paese. Per legge."
 efw_voc_army_1:0 "Nazione in Armi I"
 efw_voc_army_1_desc:0 "La parata del sabato è diventata un appuntamento fisso."
 efw_voc_army_2:0 "Nazione in Armi II"
 efw_voc_army_2_desc:0 "Le scuole insegnano geografia con le carte topografiche dello Stato Maggiore."
 efw_voc_army_3:0 "Nazione in Armi III"
 efw_voc_army_3_desc:0 "L'esercito migliore del continente. I laboratori, intanto, chiudono alle cinque."

 # === SIGNORI DEL MARE ===
 efw_vocation_navy_1:0 "Vocazione: Signori del Mare"
 efw_vocation_navy_1_desc:0 "Il futuro della nazione galleggia.\n\n§YIl percorso:§!\n§YI§! §G+6% produzione navale, +3% danno navale§!\n§YII§! §G+15% produzione navale, +6% danno e difesa navale, +10% riparazioni§!: 10 cantieri navali e una legge tra Grandi Cantieri Navali, Marina d'Altura, Dottrina del Siluro o Arsenali di Rimodernamento\n§YIII§! §G+30% produzione navale, +12% danno e difesa navale, +25% riparazioni e rimodernamenti§!: 25 cantieri navali, Grandi Cantieri Navali e una legge tra Marina d'Altura, Dottrina del Siluro, Arsenali di Rimodernamento o Sistema dei Convogli\n\n§RMalus crescenti:§! produzione militare e addestramento dell'esercito."
 efw_vocation_navy_2:0 "Mare: Varo Continuo"
 efw_vocation_navy_2_desc:0 "Ogni lunedì una bottiglia si rompe contro una prua. Il vetro lo ricicliamo."
 efw_vocation_navy_3:0 "Mare: Padroni delle Onde"
 efw_vocation_navy_3_desc:0 "Le carte nautiche nemiche hanno un nuovo simbolo: il nostro."
 efw_voc_navy_1:0 "Signori del Mare I"
 efw_voc_navy_1_desc:0 "I bambini giocano con le barchette. Il ministero prende appunti."
 efw_voc_navy_2:0 "Signori del Mare II"
 efw_voc_navy_2_desc:0 "I cantieri lavorano giorno e notte; i reggimenti aspettano i camion."
 efw_voc_navy_3:0 "Signori del Mare III"
 efw_voc_navy_3_desc:0 "La flotta migliore degli oceani. L'esercito, intanto, si allena in banchina."

 # === L'ARTE DELL'ARRANGIARSI ===
 efw_vocation_scrap_1:0 "Vocazione: l'Arte dell'Arrangiarsi"
 efw_vocation_scrap_1_desc:0 "Niente acciaio? Niente gomma? Niente problema. Abbiamo il fil di ferro.\n\n§YIl percorso:§!\n§YI§! §G-15% penalità per risorse mancanti, +5% efficienza iniziale§!\n§YII§! §G-35% penalità, +10% efficienza iniziale, +5% risorse locali, +5% produzione§!: §Y5.000 Pipe-Gun Rifle§! in magazzino e Raccolta di Rottami o Materiali Surrogati\n§YIII§! §G-60% penalità, +20% efficienza iniziale, +5% efficienza massima, +10% risorse locali, +12% produzione§!: §Y20.000 Pipe-Gun Rifle§! in magazzino, Raccolta di Rottami o Materiali Surrogati, Autarchia o Quote d'Importazione\n\nPerfetta per le nazioni povere di risorse.\n\n§RMalus crescenti:§! ricerca e stabilità."
 efw_vocation_scrap_2:0 "Arrangiarsi: Tutto Serve"
 efw_vocation_scrap_2_desc:0 "Le cancellate dei parchi sono sparite. Anche le panchine. E qualche lampione."
 efw_vocation_scrap_3:0 "Arrangiarsi: Genio del Fil di Ferro"
 efw_vocation_scrap_3_desc:0 "Gli ingegneri stranieri visitano le nostre fabbriche e non capiscono come facciano a funzionare. Nemmeno noi."
 efw_voc_scrap_1:0 "L'Arte dell'Arrangiarsi I"
 efw_voc_scrap_1_desc:0 "Il nastro isolante è stato dichiarato materiale strategico."
 efw_voc_scrap_2:0 "L'Arte dell'Arrangiarsi II"
 efw_voc_scrap_2_desc:0 "Ogni cantina è un deposito, ogni nonno un consulente tecnico."
 efw_voc_scrap_3:0 "L'Arte dell'Arrangiarsi III"
 efw_voc_scrap_3_desc:0 "Le fabbriche producono a pieno ritmo con metà delle risorse. Nessuno chiede come."

 # === RINNEGARE ===
 efw_vocation_abandon:0 "Rinnegare la Vocazione"
 efw_vocation_abandon_desc:0 "Abbiamo sbagliato strada. Succede. Si torna indietro, si perde il livello raggiunto e per §Y180 giorni§! il paese avrà una §RCrisi d'Identità Nazionale§!: nessuna nuova vocazione finché non passa."
 efw_vocation_crisis_idea:0 "Crisi d'Identità Nazionale"
 efw_vocation_crisis_idea_desc:0 "I giornali si chiedono chi siamo. Il governo, sinceramente, non lo sa."
