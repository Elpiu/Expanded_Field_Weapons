 efw_propaganda_center:0 "宣传与动员中心"
 efw_propaganda_center_desc:0 "协调政治运动、平民招募和公众动员的行政与宣传中心。"
 efw_labor_directorate:0 "国家劳动局"
 efw_labor_directorate_desc:0 "协调劳动、建设、生产和当地资源开发的机构。"
 efw_research_center:0 "国家研究中心"
 efw_research_center_desc:0 "致力于应用研究、协调各研究所、大学和国家实验室的综合机构。"
 efw_logistics_center:0 "后勤与民防中心"
 efw_logistics_center_desc:0 "集仓储、运输、维修、基础设施和民防于一体的地区枢纽。"
