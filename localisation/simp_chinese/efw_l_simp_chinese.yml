 modifier_state_production_efw_labor_directorate_factor_desc:0 "修改本地国家劳动局的建造速度。"
 modifier_production_speed_efw_research_center_factor:0 "国家研究中心建造速度"
 modifier_production_speed_efw_research_center_factor_desc:0 "修改国家研究中心的建造速度。"
 modifier_state_production_efw_research_center_factor:0 "本地国家研究中心建造速度"
 modifier_state_production_efw_research_center_factor_desc:0 "修改本地国家研究中心的建造速度。"
 modifier_production_speed_efw_logistics_center_factor:0 "后勤与民防中心建造速度"
 modifier_production_speed_efw_logistics_center_factor_desc:0 "修改后勤与民防中心的建造速度。"
 modifier_state_production_efw_logistics_center_factor:0 "本地后勤与民防中心建造速度"
 modifier_state_production_efw_logistics_center_factor_desc:0 "修改本地后勤与民防中心的建造速度。"
 efw_national_investments_idea:0 "国家投资计划"
 efw_national_investments_idea_desc:0 "国家集中政治和行政资源，扩大宣传和国家劳动组织。"
 efw_coordinated_economy_idea:0 "协调国民经济"
 efw_coordinated_economy_idea_desc:0 "工业、船坞和行政按国家经济计划统一协调——但要付出社会代价。"
 efw_research_funding_idea:0 "国家科研资助"
 efw_research_funding_idea_desc:0 "资金和加速程序支持国家科研网络的发展。"
 efw_logistics_plan_idea:0 "国家基础设施计划"
 efw_logistics_plan_idea_desc:0 "政府支持发展地区后勤中心及配套基础设施。"
 efw_national_mobilization_idea:0 "国家总动员"
 efw_national_mobilization_idea_desc:0 "国家的经济和行政机器已全面转向国家总体战。"
 efw_commission_propaganda_center:0 "建造宣传中心"
 efw_commission_propaganda_center_desc:0 "投入§Y10000名公共工人§!，在选定的州开始建造宣传与动员中心。"
 efw_commission_labor_directorate:0 "设立劳动局"
 efw_commission_labor_directorate_desc:0 "投入§Y20000名工人§!，在选定的州设立国家劳动局。"
 efw_commission_research_center:0 "建造国家研究中心"
 efw_commission_research_center_desc:0 "投入§Y15000名技术员、研究人员和职员§!，建立国家研究中心。"
 efw_commission_logistics_center:0 "建造后勤中心"
 efw_commission_logistics_center_desc:0 "投入§Y12000名工人和后勤人员§!，建立后勤与民防中心。"
 efw_launch_national_investments:0 "启动国家投资"
 efw_launch_national_investments_desc:0 "第一个宣传网络投入运作后，公共投资就可以集中并加速。"
 efw_coordinate_national_economy:0 "协调国民经济"
 efw_coordinate_national_economy_desc:0 "行政和劳动网络已足够广泛，可以在全国范围内协调工业和建设。"
 efw_fund_national_research:0 "资助国家科研"
 efw_fund_national_research_desc:0 "调拨政治和行政资源，建立协调统一的国家科研网络。"
 efw_launch_national_infrastructure_plan:0 "国家基础设施计划"
 efw_launch_national_infrastructure_plan_desc:0 "制定涵盖后勤、运输、仓储和民防的国家计划。"
 efw_mobilize_the_nation:0 "动员全国"
 efw_mobilize_the_nation_desc:0 "宣传、劳动、科研和后勤已充分发展，足以实现国家经济的全面动员。"
 efw_issue_national_bonds:0 "发行国债"
 efw_issue_national_bonds_desc:0 "立即获得§G+100政治点数§!，但在§Y365天§!后偿还§R150政治点数§!。"
 efw_issue_long_term_national_loan:0 "国家大借款"
 efw_issue_long_term_national_loan_desc:0 "立即获得§G+120政治点数§!，但在§Y730天§!后偿还§R200政治点数§!。"
 efw_national_mobilization.1.t:0 "国债到期"
 efw_national_mobilization.1.d:0 "一年前发行的国债已经到期，现在必须连本带息偿还。"
 efw_national_mobilization.1.a:0 "我们会履行义务。"
 efw_national_mobilization.2.t:0 "国家大借款到期"
 efw_national_mobilization.2.d:0 "两年前借入的国家借款已经到期，现在必须连本带息偿还。"
 efw_national_mobilization.2.a:0 "债务将会偿清。"
 EFW_MOD_NAME:0 "Expanded Field Weapons"
 efw_machinegun_equipment:0 "支援机枪"
 efw_machinegun_equipment_desc:0 "轻、中、重机枪合并为一个生产类别。装备本身不变，而支援武器研究会提升使用它的部队。"
 efw_machinegun_equipment_standard:0 "机枪"
 efw_machinegun_equipment_standard_short:0 "机枪"
 efw_mortar_equipment:0 "步兵迫击炮"
 efw_mortar_equipment_desc:0 "用于建制内近距离间瞄火力支援的轻型和中型迫击炮。"
 efw_mortar_equipment_standard:0 "迫击炮"
 efw_mortar_equipment_standard_short:0 "迫击炮"
 efw_antitank_equipment:0 "便携式反坦克武器"
 efw_antitank_equipment_desc:0 "步兵建制内的反坦克武器。改进的条令、弹药和战术通过科技加成体现，而不是新的生产型号。"
 efw_antitank_equipment_standard:0 "反坦克武器"
 efw_antitank_equipment_standard_short:0 "反坦克武器"
 efw_machinegun_company:0 "机枪连"
 efw_machinegun_company_desc:0 "专门提供持续自动火力的支援连。使用EFW机枪。"
 efw_mortar_company:0 "迫击炮连"
 efw_mortar_company_desc:0 "提供近距离间瞄火力的支援连。使用EFW迫击炮。"
 efw_antitank_company:0 "反坦克连"
 efw_antitank_company_desc:0 "编入部队的便携式反坦克小组。使用EFW反坦克武器。"
 efw_elite_heavy_weapons_battalion:0 "精锐重武器营"
 efw_elite_heavy_weapons_battalion_desc:0 "昂贵且消耗大量补给的一线营，将机枪、迫击炮和反坦克武器与精选步兵结合在一起。"
 efw_legionari_dellimpero:0 "帝国军团"
 efw_legionari_dellimpero_desc:0 "以步枪和建制机枪为核心的大型民兵营。压制力和防御火力强，补给消耗略低于普通步兵，但需要长时间训练：新兵部队很脆弱，而训练有素的军团兵强于正规步兵。"
 efw_unlock_core_weapons:0 "EFW：综合支援武器"
 efw_legionari_unlock:0 "EFW：帝国军团"
 efw_support_upgrade_2:0 "EFW：支援武器II"
 efw_support_upgrade_3:0 "EFW：支援武器III"
 efw_support_upgrade_4:0 "EFW：支援武器IV"
 efw_at_upgrade_1:0 "EFW：反坦克改进I"
 efw_at_upgrade_2:0 "EFW：反坦克改进II"
 efw_improvised_naval_modules_unlock:0 "简易海军计划"
 efw_motorboat_engine:0 "简易摩托艇发动机"
 efw_motorboat_engine_desc:0 "用于小型近岸船只的简单发动机。大幅降低舰船的成本、航程和耐久。"
 efw_motorboat_machinegun:0 "舰载机枪座"
 efw_motorboat_machinegun_desc:0 "改装用于海上的重机枪。"
 efw_midget_sub_engine:0 "袖珍潜艇发动机"
 efw_midget_sub_engine_desc:0 "用于极小型潜艇的微型推进系统。"
 efw_midget_sub_torpedo:0 "袖珍潜艇轻型鱼雷"
 efw_midget_sub_torpedo_desc:0 "为袖珍潜艇设计的紧凑型鱼雷装置。"
 efw_scrap_multirole_mount:0 "简易多用途炮座"
 efw_scrap_multirole_mount_desc:0 "用备用轻炮和简易防空瞄具焊成的两用炮座。略微增加轻型火力和防空火力，可装入多个栏位，但会稍微降低航速和可靠性。"
 efw_improvised_torpedo_rack:0 "简易鱼雷架"
 efw_improvised_torpedo_rack_desc:0 "放置备用鱼雷的简单甲板架，配有手工投放装置。增加少量鱼雷攻击和命中率，可叠加，但降低航速和可靠性。"
 efw_improvised_depth_charge_rack:0 "简易深水炸弹架"
 efw_improvised_depth_charge_rack_desc:0 "配有简单水听器线路的轻型深弹架。略微提高反潜攻击和侦测，可叠加，但稍微减慢舰船并降低可靠性。"
 efw_improvised_fuel_tank:0 "简易副油箱"
 efw_improvised_fuel_tank_desc:0 "用废钢焊成的廉价油箱。以低成本增加航程，但稍微降低航速和可靠性，中弹时可能漏油。"
 efw_wooden_sub_coating:0 "潜艇木质外壳"
 efw_wooden_sub_coating_desc:0 "用处理过的木材、帆布和焦油代替稀缺的金属板。降低成本，但削弱船体，并使潜艇更容易被发现。"
 efw_wooden_surface_refit:0 "木质改装"
 efw_wooden_surface_refit_desc:0 "使用木质上层建筑和非战略材料的临时改装。降低成本，但削弱船体、降低航速并损害可靠性。"
 efw_improvised_mine_rack:0 "简易水雷架（10枚）"
 efw_improvised_mine_rack_desc:0 "可放约十枚触发水雷的简单甲板架。大幅提高布雷能力，代价是航速和可靠性。"
 efw_improvised_sub_mine_rack:0 "简易潜艇水雷架（10枚）"
 efw_improvised_sub_mine_rack_desc:0 "可放约十枚水雷的紧凑外挂架。大幅提高潜艇布雷能力，仅略微损失航速和可靠性。"
 efw_small_sail:0 "小型简易风帆"
 efw_small_sail_desc:0 "甲板上挂起的小帆布帆。航速+15%，但舰船更显眼、可靠性略降。装在燃料箱栏位。"
 efw_large_sail:0 "大型简易风帆"
 efw_large_sail_desc:0 "一面巨大的临时风帆，把舰船变成简易帆船。航速+25%，但大幅提高可见度，并降低可靠性和船体强度。装在燃料箱栏位。"
 efw_careened_hull:0 "清理抛光的船体"
 efw_careened_hull_desc:0 "船体经过刮洗、涂焦油和抛光，条件允许时还包上简易铜皮。提高可靠性、航速、航程和侦测，略微降低可见度并增加少许船体强度。燃料箱栏位的可靠通用模块。"
 efw_fishing_net_armor:0 "渔网装甲"
 efw_fishing_net_armor_desc:0 "用伪装网和缠绕的渔网代替真正的装甲。略微降低可见度和鱼雷伤害，甚至还能省一点成本，但不提供任何装甲值。"
 efw_wooden_plank_armor:0 "木板装甲"
 efw_wooden_plank_armor_desc:0 "在船体上用螺栓固定的多层木板。廉价的额外防护和少许耐久，代价是航速和可靠性。"
 efw_scrap_plate_armor:0 "废钢板装甲"
 efw_scrap_plate_armor_desc:0 "焊在一起的回收钢板。比木板防护更好，但更重、更慢、更不可靠。"
 efw_fishing_net_armor_heavy:0 "渔网装甲（重型）"
 efw_fishing_net_armor_heavy_desc:0 "罩在主力舰上的大型伪装网和渔网。略微降低可见度和鱼雷伤害，但没有真正的装甲。"
 efw_wooden_plank_armor_heavy:0 "木板装甲（重型）"
 efw_wooden_plank_armor_heavy_desc:0 "固定在主力舰船体上的巨大木板。廉价防护和额外耐久，代价是航速和可靠性。"
 efw_scrap_plate_armor_heavy:0 "废钢板装甲（重型）"
 efw_scrap_plate_armor_heavy_desc:0 "焊在主力舰船体上的厚回收钢板。可靠的简易防护，但沉重、缓慢且不可靠。"
 efw_wooden_fighter_equipment:0 "简易木质战斗机"
 efw_wooden_fighter_equipment_desc:0 "用非战略材料和简单部件制造的极廉价飞机。易于生产，但速度慢、结构脆弱、武装薄弱。"
 efw_tin_tank_equipment:0 "铁皮坦克"
 efw_tin_tank_equipment_desc:0 "用薄铆接钢板保护、主要装备机枪的简陋轻型坦克。生产便宜，但几乎任何反坦克武器都能击穿它。"
 efw_wooden_air_bba_unlock:0 "简易航空计划"
 efw_wooden_air_legacy_unlock:0 "简易航空计划"
 efw_tin_tank_nsb_unlock:0 "简易装甲计划"
 efw_tin_tank_legacy_unlock:0 "简易装甲计划"
 efw_propaganda_center_unlock:0 "EFW宣传网络"
 efw_labor_directorate_unlock:0 "EFW劳动组织"
 efw_research_center_unlock:0 "EFW科研网络"
 efw_logistics_center_unlock:0 "EFW后勤网络"
 efw_industrialization_campaign_idea:0 "国家工业化运动"
 efw_state_industry_subsidies_idea:0 "国家工业补贴"
 efw_national_infrastructure_program_idea:0 "国家基础设施计划"
 efw_early_industrialization_campaign:0 "发起工业化运动"
 efw_army_public_works:0 "动用军队参加公共工程"
 efw_state_industry_subsidies:0 "国家工业补贴"
 efw_national_infrastructure_program:0 "国家基础设施计划"
 efw_pipe_gun_rifle:0 "管枪"
 efw_pipe_gun_rifle_short:0 "管枪"
 efw_pipe_gun_rifle_desc:0 "用液压管和回收零件匆忙拼成的粗糙简易武器。简陋、不可靠，毫无工业标准可言，但几乎不需要资源就能生产。"
 efw_army_munitions_works:0 "陆军兵工厂建设"
 efw_army_munitions_works_desc:0 "动员100000名新兵参加一年的军工生产，永久建成4座外部军用工厂。"
 efw_naval_yard_expansion:0 "海军船坞建设运动"
 efw_naval_yard_expansion_desc:0 "调派100000名新兵参加一年的沿海建设，建成4座永久外部船坞。"
 efw_industrial_plan_phase_1:0 "工业总体规划：第一阶段——奠基"
 efw_industrial_plan_phase_1_desc:0 "投入政治资本、火车和人力，为大规模国家工业复兴奠定基础。立即获得外部§G+8座民用工厂§!和§G+2座军用工厂§!，并加快建设。180天后解锁第二阶段。"
 efw_industrial_phase_1_idea:0 "工业计划：第一阶段动员"
 efw_industrial_plan_phase_2:0 "工业总体规划：第二阶段——重工扩张"
 efw_industrial_plan_phase_2_desc:0 "工业扩张的收尾阶段。再增加外部§G+7座民用工厂§!和§G+4座军用工厂§!。完成后，所有装备和一半动员劳动力将会归还。"
 efw_industrial_phase_2_idea:0 "工业计划：第二阶段动员"
 efw_national_mobilization.30.t:0 "工业计划：第一阶段完成"
 efw_national_mobilization.30.d:0 "首批重工业工厂和冶金联合厂已全面投产。基础已经打好，国家准备开始总体规划的第二阶段。"
 efw_national_mobilization.30.a:0 "开始第二阶段！"
 efw_national_mobilization.31.t:0 "工业计划：工业的胜利"
 efw_national_mobilization.31.d:0 "计划启动整整一年后，工业扩张完成：15座民用综合体和6座军工厂以最高效率运转。火车和卡车已归还库存。"
 efw_national_mobilization.31.a:0 "一个生产巨人诞生了！"
 efw_grand_public_works:0 "国家大型公共工程动员"
 efw_grand_public_works_desc:0 "派出公共工程队、工程师和卡车，扩展本土的承载能力。为所有本土核心州提供§G+1基础设施§!（低于5级时）和§G+2建筑栏位§!，并在540天内获得§G+30%§!建造速度。"
 efw_grand_works_idea:0 "大型公共工程热潮"
 efw_social_welfare_and_workshops:0 "社会契约与分散作坊"
 efw_social_welfare_and_workshops_desc:0 "把家庭人口福利与小型手工作坊的后勤整合结合起来。在3年内稳定人力增长、促进科研，并提高工厂产出和最大效率上限。"
 efw_social_welfare_workshops_idea:0 "社会契约与作坊网络"
 efw_emergency_naval_program:0 "海军紧急扩充计划"
 efw_emergency_naval_program_desc:0 "集中专业船坞工人和设备，建立§G+6座永久外部船坞§!。动员的人员和卡车一年后归还。"
 efw_national_mobilization.34.t:0 "国债到期偿还"
 efw_national_mobilization.34.d:0 "去年发行的国库券已经到期。政府必须连本带息偿还持有人，以维护财政信誉。"
 efw_national_mobilization.34.a:0 "履行我们的财政承诺。"
 efw_wooden_construction:0 "轻型木质结构"
 efw_wooden_construction_desc:0 "胶合板机身和翼梁，覆以处理过的帆布。大幅降低飞机的工业成本。"
 efw_wooden_frame_component:0 "木质结构面板"
 efw_wooden_frame_component_desc:0 "用木材和帆布代替金属部件。降低重量和成本，但结构强度下降。可多次安装。"
 efw_extended_fuel_tank:0 "外挂副油箱"
 efw_extended_fuel_tank_desc:0 "可抛弃的翼下油箱，显著增加航程。"
 efw_airdrop_supply_pod:0 "空投补给舱"
 efw_airdrop_supply_pod_desc:0 "用于补给被围部队并提供战术地面支援的应急降落伞容器。"
 efw_boost_power_system:0 "“爆发”增压系统"
 efw_boost_power_system_desc:0 "辅助压气机，提高最高速度并为重载提供额外推力。"
 efw_universal_hardpoint:0 "特种武器通用挂架"
 efw_universal_hardpoint_desc:0 "多用途翼下挂架：近距空中支援时挂炸弹，制空时提供辅助火力，海上任务时挂鱼雷和炸药。"
 efw_plywood_frame_module:0 "胶合板与布质机体"
 efw_plywood_frame_module_desc:0 "用胶合板和处理过的布料代替稀缺的铝。大幅降低成本和重量，带来出色的机动性，但生存力脆弱。"
 efw_overboost_compressor_module:0 "手工“超增压”压气机"
 efw_overboost_compressor_module_desc:0 "以高压酒精喷射超频发动机。带来惊人的推力（推力+8）和最高速度，代价是严重的机械磨损。"
 efw_improvised_bomb_rack_module:0 "简易破片与炸弹挂架"
 efw_improvised_bomb_rack_module_desc:0 "可挂迫击炮弹和集束弹药的翼下挂架。让轻型简易飞机对敌军编队提供猛烈的近距空中支援（对地攻击+6）。"
 efw_infantry_mg_pod_module:0 "步兵重机枪吊舱"
 efw_infantry_mg_pod_module_desc:0 "把步兵重机枪改装进翼下吊舱。让廉价飞机成为近距格斗中火力强大的致命截击机（空中攻击+8）。"
 efw_paper_drop_tank_module:0 "压制纸质副油箱"
 efw_paper_drop_tank_module_desc:0 "用涂漆纸浆和廉价树脂制成的一次性副油箱。几乎零成本获得巨大航程，但中弹时火灾风险极高。"
 efw_stripped_cockpit_module:0 "简化座舱与环形瞄准具"
 efw_stripped_cockpit_module_desc:0 "拆掉座舱装甲、暖气和笨重仪表，只留下敞开的座舱盖和简单的环形瞄准具。减轻重量并提升射击反应，但飞行员完全暴露。"
 efw_wooden_boost_airframe:0 "木质机体与“超增压”压气机"
 efw_wooden_boost_airframe_desc:0 "用轻如鸿毛的胶合板代替金属合金，同时增压发动机。降低成本和重量，适度提高速度和推力（推力+5）。每个模块降低6%可靠性和8%空中防御，但惩罚叠加较缓：装两三个仍然可用，并能让飞机便宜很多。"
 efw_improvised_drop_tank:0 "压制纸质辅助副油箱"
 efw_improvised_drop_tank_desc:0 "用涂漆纸浆和廉价树脂制成的一次性副油箱。以微不足道的成本大幅增加航程（+300公里），但极易燃。"
 efw_multirole_combat_rack:0 "野战多用途武器架"
 efw_multirole_combat_rack_desc:0 "一个紧凑的野战武器架，让任何机体都成为朴素的多用途飞机：空中攻击+2、对地攻击+2、战略轰炸+2、对舰攻击+2、对舰瞄准+2。还可执行制空、截击、近距空中支援、后勤打击、对舰攻击、海上巡逻、港口打击和战略轰炸任务。额外阻力使最高速度-15、机动性-1.5，但模块可以叠加：加成和惩罚都会累加。"
 efw_cast_iron_stove_armor:0 "简易“野战炉”装甲"
 efw_cast_iron_stove_armor_desc:0 "固定在飞行员座椅下的厚铸铁板或井盖。提供可靠的弹道防护（防御+7），但明显加重机体（重量+4），并略微降低最高速度和航程。"
 efw_bazooka_charlie_tubes:0 "“巴祖卡查理”火箭发射管"
 efw_bazooka_charlie_tubes_desc:0 "装在机翼支柱下的一组手工焊接步兵火箭发射管。对装甲师和海上目标发射毁灭性齐射（对地攻击+8），但工业成本和重量可观，明显降低机动性和防御。"
