l_simp_chinese:
 efw_tankette_equipment:0 "超轻型坦克"
 efw_tankette_equipment_desc:0 "两个人、一挺机枪，再加一台卡车发动机，全塞进一个铁皮盒子。跑得比自己的勇气还快：便宜灵活，但任何反坦克炮都能像开沙丁鱼罐头一样把它打开。"
 efw_tankette_equipment_1:0 "EFW超轻型坦克"
 efw_tankette_equipment_1_short:0 "超轻型坦克"
 efw_tankette_equipment_1_desc:0 "两个人、一挺机枪，再加一台卡车发动机，全塞进一个铁皮盒子。跑得比自己的勇气还快：便宜灵活，但任何反坦克炮都能像开沙丁鱼罐头一样把它打开。"
 efw_tankette_battalion:0 "超轻型坦克营"
 efw_tankette_battalion_desc:0 "双人迷你坦克。一个营的造价约为轻型坦克营的四分之一，能碾压没有反坦克武器的步兵，但装甲很薄。使用EFW超轻型坦克。"
 efw_tankette_unlock:0 "EFW：超轻型坦克"
 efw_motorcycle_mg_equipment:0 "机枪摩托车"
 efw_motorcycle_mg_equipment_desc:0 "一辆摩托车、一个挎斗，还有一挺装在本该坐着丈母娘的位置上的机枪。快速、吵闹，在土路上出奇地致命。"
 efw_motorcycle_mg_equipment_1:0 "EFW机枪摩托车"
 efw_motorcycle_mg_equipment_1_short:0 "机枪摩托"
 efw_motorcycle_mg_equipment_1_desc:0 "一辆摩托车、一个挎斗，还有一挺装在本该坐着丈母娘的位置上的机枪。快速、吵闹，在土路上出奇地致命。"
 efw_motorcycle_mg_company:0 "摩托机枪连"
 efw_motorcycle_mg_company_desc:0 "乘坐武装挎斗摩托的摩托化侦察部队。侦察能力与摩托化侦察相同，造价更低，并使全师步兵§G攻击+5%§!。占用侦察栏位。"
 efw_motorcycle_unlock:0 "EFW：摩托机枪手"
 efw_gun_truck_equipment:0 "炮车"
 efw_gun_truck_equipment_desc:0 "拿一辆卡车。拿一门反坦克炮。用大量绳子和一点信念把它们绑在一起。能打步兵和轻型车辆，在对方还击前就开走：毫无装甲。"
 efw_gun_truck_equipment_1:0 "EFW简易炮车"
 efw_gun_truck_equipment_1_short:0 "炮车"
 efw_gun_truck_equipment_1_desc:0 "拿一辆卡车。拿一门反坦克炮。用大量绳子和一点信念把它们绑在一起。能打步兵和轻型车辆，在对方还击前就开走：毫无装甲。"
 efw_gun_truck_battalion:0 "炮车连"
 efw_gun_truck_battalion_desc:0 "装在卡车上的反坦克炮。和摩托化步兵一样快的一线炮兵，穿甲能力好，但毫无防护。使用EFW简易炮车。"
 efw_gun_truck_unlock:0 "EFW：简易炮车"
