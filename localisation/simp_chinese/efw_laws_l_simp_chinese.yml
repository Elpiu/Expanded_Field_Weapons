 efw_lab_family_support:0 "家庭扶持"
 efw_lab_family_support_desc:0 "育儿津贴和奖金：人口更多，开支更大。"
 efw_lab_social_insurance:0 "社会保险"
 efw_lab_social_insurance_desc:0 "养老金和保险：公民更忠诚，民用工厂更忙。"
 efw_lab_extended_welfare:0 "全面福利"
 efw_lab_extended_welfare_desc:0 "人人享有医疗、教育和救助。代价高昂，但能凝聚国家。"
 efw_lab_labour_mobilization:0 "劳动动员"
 efw_lab_labour_mobilization_desc:0 "每个工人都被派往国家最需要的地方。"
 efw_lab_corporatism:0 "社团主义"
 efw_lab_corporatism_desc:0 "雇主和工人同属一个社团，由国家仲裁。"
 efw_ec_press:0 "新闻与宣传"
 efw_prs_free_press:0 "新闻自由"
 efw_prs_free_press_desc:0 "公开辩论、思想活跃，但战斗意志减弱。"
 efw_prs_moderate_censorship:0 "适度审查"
 efw_prs_moderate_censorship_desc:0 "几条尴尬的新闻永远到不了报摊。"
 efw_prs_patriotic_propaganda:0 "爱国宣传"
 efw_prs_patriotic_propaganda_desc:0 "海报、歌曲和演讲：国家整装待发。"
 efw_prs_state_radio:0 "国家电台"
