 efw_edu_research_exchange:0 "科学交流"
 efw_edu_research_exchange_desc:0 "与盟友共享研究：想法更多，秘密更少。"
 efw_so_population:0 "人口与卫生"
 efw_pop_public_health:0 "公共卫生"
 efw_pop_public_health_desc:0 "诊所和疫苗：人口更健康，民用开支更多。"
 efw_pop_birth_campaign:0 "生育运动"
 efw_pop_birth_campaign_desc:0 "奖励多子女家庭，工厂里的女性变少。"
 efw_pop_colonial_recruitment:0 "领地征兵"
 efw_pop_colonial_recruitment_desc:0 "我们也在非本民族地区征兵。"
 efw_pop_internal_migration:0 "国内迁移"
 efw_pop_internal_migration_desc:0 "把工人调到工地需要的地方。"
 efw_pop_reservists:0 "召回预备役"
 efw_pop_reservists_desc:0 "可用的人更多，成长中的家庭更少。"
 efw_pop_national_health:0 "国民医疗服务"
 efw_pop_national_health_desc:0 "人人享有医疗，人人共同承担。"
 efw_pop_total_manpower:0 "人口动员"
