 efw_cd_fortress_nation:0 "要塞国家"
 efw_cd_fortress_nation_desc:0 "祖国变成一张防御工事之网。"
 efw_cd_people_in_arms:0 "全民皆兵"
 efw_cd_people_in_arms_desc:0 "每个公民都准备保卫祖国。"
 efw_military_policies:0 "陆军与总参谋部"
 efw_military_policies_desc:0 "指挥、征兵、后勤、野战武器、医疗和条令：军队如何作战。"
 efw_mil_command:0 "指挥与军官"
 efw_cmd_junior_officers:0 "初级军官速成班"
 efw_cmd_junior_officers_desc:0 "年轻军官快速培养：经验更多，凝聚力更弱。"
 efw_cmd_military_academies:0 "军事学院"
 efw_cmd_military_academies_desc:0 "军官准备充分，但培养要多花几个月。"
 efw_cmd_centralized:0 "集中指挥"
 efw_cmd_centralized_desc:0 "计划自上而下；基层主动性减弱。"
 efw_cmd_decentralized:0 "分散指挥"
 efw_cmd_decentralized_desc:0 "前线指挥官自行决断：部队士气高，计划较慢。"
 efw_cmd_foreign_missions:0 "海外观察团"
 efw_cmd_foreign_missions_desc:0 "我们的军官去观察别人的战争。"
 efw_cmd_war_college:0 "陆军大学"
 efw_cmd_war_college_desc:0 "经过训练、能策划复杂作战的参谋部。"
 efw_cmd_general_staff:0 "大总参谋部"
 efw_cmd_general_staff_desc:0 "统辖全部陆军的唯一权威指挥机构。"
 efw_cmd_veteran_cadres:0 "老兵骨干"
 efw_cmd_veteran_cadres_desc:0 "每个部队都有经验丰富的士官：学习更多，征兵更慢。"
 efw_mil_recruitment:0 "训练与征兵"
 efw_rec_quick_training:0 "速成训练"
 efw_rec_quick_training_desc:0 "新兵更早就绪，但准备不足。"
 efw_rec_extended_training:0 "延长训练"
 efw_rec_extended_training_desc:0 "在军营多待几周，士兵更顽强。"
 efw_rec_territorial_reserves:0 "地方预备队"
 efw_rec_territorial_reserves_desc:0 "每个军区都保留自己的预备役。"
 efw_rec_volunteer_corps:0 "志愿军团"
 efw_rec_volunteer_corps_desc:0 "志愿兵到国外积累经验。"
 efw_rec_auxiliaries:0 "辅助勤务"
 efw_rec_auxiliaries_desc:0 "女性担任辅助角色：前线士兵更多，工人更少。"
 efw_rec_mass_conscription:0 "全面征兵"
 efw_rec_mass_conscription_desc:0 "所有适龄男子都要拿起武器。"
 efw_rec_elite_units:0 "精锐部队"
 efw_rec_elite_units_desc:0 "严格选拔、艰苦训练：人少，但更精。"
 efw_rec_live_fire:0 "实弹演习"
 efw_rec_live_fire_desc:0 "使用实弹的逼真演习。"
 efw_mil_logistics:0 "后勤与补给"
 efw_log_push_supply:0 "推送式补给"
 efw_log_push_supply_desc:0 "所有物资往前送：消耗更低，途中损耗更多。"
 efw_log_forward_depots:0 "前进仓库"
 efw_log_forward_depots_desc:0 "在前线附近建仓库，代价由民用承担。"
 efw_log_rail_priority:0 "铁路优先"
 efw_log_rail_priority_desc:0 "军列优先通行。"
 efw_log_mules:0 "骡子与大车"
