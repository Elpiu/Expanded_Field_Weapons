 efw_log_motor_pool:0 "车辆调配场"
 efw_log_motor_pool_desc:0 "部队配更多卡车：更快，但更费油。"
 efw_log_integrated:0 "一体化后勤"
 efw_log_integrated_desc:0 "铁路、卡车和仓库由统一指挥部管理。"
 efw_log_war_requisitions:0 "战时征用"
 efw_log_war_requisitions_desc:0 "为前线征用民用车辆和物资。"
 efw_log_fuel_economy:0 "节约燃料"
 efw_log_fuel_economy_desc:0 "每一升都算数：储备更大，车辆更谨慎。"
 efw_mil_field_weapons:0 "野战武器与步兵"
 efw_fw_mg_doctrine:0 "机枪条令"
 efw_fw_mg_doctrine_desc:0 "步兵围绕机枪坚守阵线。"
 efw_fw_light_indirect_fire:0 "轻型间瞄火力"
