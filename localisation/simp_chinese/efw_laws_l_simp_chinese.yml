 efw_prs_state_press:0 "官方报刊"
 efw_prs_state_press_desc:0 "全国只有一条编辑方针。"
 efw_prs_total_propaganda:0 "全面宣传"
 efw_prs_total_propaganda_desc:0 "一切传播手段都为国家事业服务。"
 efw_prs_national_culture:0 "民族文化"
 efw_prs_national_culture_desc:0 "博物馆、学校和大学是国家的骄傲。"
 efw_ec_order:0 "公共秩序"
 efw_ord_civil_police:0 "民事警察"
 efw_ord_civil_police_desc:0 "巡警和派出所：维持秩序而不过度。"
 efw_ord_gendarmerie:0 "宪兵队"
 efw_ord_gendarmerie_desc:0 "覆盖城乡的军事警察网络。"
 efw_ord_amnesty:0 "大赦"
 efw_ord_amnesty_desc:0 "监狱清空：可用人手更多，纪律更松。"
 efw_ord_penal_labour:0 "劳役刑"
 efw_ord_penal_labour_desc:0 "囚犯修建公路和铁路。"
 efw_ord_informants:0 "线人网络"
 efw_ord_informants_desc:0 "门房和酒保向该报告的人报告。"
 efw_ord_secret_police:0 "秘密警察"
 efw_ord_secret_police_desc:0 "异见在萌芽之前就被扼杀。"
 efw_ord_occupation_police:0 "占领区军警"
 efw_ord_occupation_police_desc:0 "专门负责控制占领地区的部队。"
 efw_ord_martial_law:0 "戒严令"
 efw_ord_martial_law_desc:0 "战时由军事法庭说了算。"
 efw_so_education:0 "教育与科研"
 efw_edu_basic_schools:0 "义务教育"
 efw_edu_basic_schools_desc:0 "人人上学：识字的国家学得更快。"
 efw_edu_technical_schools:0 "技术学校"
 efw_edu_technical_schools_desc:0 "培养技术员和熟练工人，而不是教授。"
 efw_edu_military_schools:0 "军事学校"
 efw_edu_military_schools_desc:0 "男孩们在学拉丁文的同时学习战术。"
 efw_edu_patriotic_education:0 "爱国教育"
 efw_edu_patriotic_education_desc:0 "怀着民族自豪感讲授历史和地理。"
 efw_edu_scholarships:0 "奖学金"
 efw_edu_scholarships_desc:0 "最优秀的学生由国家出资求学。"
 efw_edu_elite_universities:0 "精英大学"
 efw_edu_elite_universities_desc:0 "大学不多，但经费无人能及。"
 efw_edu_military_research:0 "军事研究"
