l_simp_chinese:
 efw_economy_policies:0 "经济与财政"
 efw_economy_policies_desc:0 "税收、贸易、工业、资本、补贴和资源：国家如何生产，又如何买单。"
 efw_ec_fiscal:0 "财政政策"
 efw_fis_low_taxes:0 "轻税"
 efw_fis_low_taxes_desc:0 "税更少，民心更安，但政府的回旋余地也更小。"
 efw_fis_high_taxes:0 "重税"
 efw_fis_high_taxes_desc:0 "国库收入更多，广场上的不满也更多。"
 efw_fis_consumption_tax:0 "消费税"
 efw_fis_consumption_tax_desc:0 "买什么就征什么：消费品更少，物价更高。"
 efw_fis_war_profits_tax:0 "战争利润税"
 efw_fis_war_profits_tax_desc:0 "军工企业的利润回流到国家总体战中。"
 efw_fis_balanced_budget:0 "预算平衡"
 efw_fis_balanced_budget_desc:0 "财政健康，政府可信，但建设资金不多。"
 efw_fis_progressive:0 "累进税制"
 efw_fis_progressive_desc:0 "多得者多缴：支持度上升，战争热情则没那么高。"
 efw_fis_war_finance:0 "战争财政"
 efw_fis_war_finance_desc:0 "债务、贷款和印钞机都为军工生产服务。"
 efw_fis_state_monopolies:0 "国家专营"
 efw_fis_state_monopolies_desc:0 "盐、烟草和火柴都成了政府的收入来源。"
 efw_ec_trade:0 "贸易与关税"
 efw_trade_free:0 "自由贸易"
 efw_trade_free_desc:0 "向商品和思想敞开大门；作为交换，我们出口更多资源。"
 efw_trade_moderate_protection:0 "温和保护主义"
 efw_trade_moderate_protection_desc:0 "适度关税保护本国工业。"
 efw_trade_export_drive:0 "出口攻势"
 efw_trade_export_drive_desc:0 "出口带来声望，但资源流出国门。"
 efw_trade_import_quotas:0 "进口配额"
 efw_trade_import_quotas_desc:0 "战略物资优先进口，消费品往后排。"
 efw_trade_bilateral:0 "双边协定"
 efw_trade_bilateral_desc:0 "与各国逐一签订贸易条约：谈判费时，签了有用。"
 efw_trade_autarky:0 "自给自足"
 efw_trade_autarky_desc:0 "一切自己造：工业更独立，贸易伙伴不高兴。"
 efw_trade_free_ports:0 "自由港"
 efw_trade_free_ports_desc:0 "商品和资本免税进出：工厂更高效，资源外流。"
 efw_trade_strategic_reserves:0 "战略储备"
 efw_trade_strategic_reserves_desc:0 "仓库里堆满资源和燃料，代价是民用工厂。"
 efw_ec_industry:0 "工业与建设"
 efw_ind_civil_priority:0 "民用优先"
 efw_ind_civil_priority_desc:0 "先建民用工厂，军工厂后建。"
 efw_ind_military_priority:0 "军用优先"
 efw_ind_military_priority_desc:0 "先建军工厂，其他一切靠后。"
 efw_ind_roads_rails:0 "公路与铁路"
 efw_ind_roads_rails_desc:0 "基础设施建得快，新工厂稍慢。"
 efw_ind_defence_works:0 "防御工事"
 efw_ind_defence_works_desc:0 "碉堡和海岸炮台在工地上享有优先权。"
 efw_ind_scientific_management:0 "科学管理"
 efw_ind_scientific_management_desc:0 "秒表和流水线：生产线进步飞快，工人怨声载道。"
 efw_ind_heavy_industry:0 "重工业"
 efw_ind_heavy_industry_desc:0 "钢铁厂和机械厂是经济的核心。"
 efw_ind_great_shipyards:0 "大型船厂"
 efw_ind_great_shipyards_desc:0 "舰队优先：人和钢铁都去港口。"
 efw_ind_five_year_plan:0 "五年计划"
 efw_ind_five_year_plan_desc:0 "由上而下为每个工地、每家工厂制定指标。"
 efw_ec_foreign_capital:0 "外国资本"
 efw_fc_closed_economy:0 "封闭经济"
 efw_fc_closed_economy_desc:0 "不要外国资本：外来影响更少，工厂也不那么现代。"
 efw_fc_regulated:0 "受管制的投资"
 efw_fc_regulated_desc:0 "外国人可以投资，但要受到严格监管。"
 efw_fc_licences:0 "特许生产"
 efw_fc_licences_desc:0 "购买别人的设计，而不是自主研发。"
 efw_fc_foreign_engineers:0 "外国工程师"
 efw_fc_foreign_engineers_desc:0 "高薪聘请的外国技术人员为我们的工厂授课。"
 efw_fc_concessions:0 "矿业特许权"
 efw_fc_concessions_desc:0 "租给外国人的矿山收入可观，但资源也被运走。"
 efw_fc_encouraged:0 "鼓励投资"
 efw_fc_encouraged_desc:0 "为在本国投资的人提供税收优惠和保障。"
 efw_fc_joint_ventures:0 "合资企业"
 efw_fc_joint_ventures_desc:0 "混合资本企业建设和生产，同时带来外国理念。"
 efw_fc_nationalisation:0 "国有化"
 efw_fc_nationalisation_desc:0 "外国公司收归国有。它们的政府很不高兴。"
 efw_ec_subsidies:0 "补贴与投资"
 efw_sub_research_grants:0 "科研经费"
 efw_sub_research_grants_desc:0 "为大学和实验室提供公共资金。"
 efw_sub_industrial_credit:0 "工业信贷"
 efw_sub_industrial_credit_desc:0 "为新建工厂的人提供低息贷款。"
 efw_sub_rural_development:0 "农村发展"
 efw_sub_rural_development_desc:0 "开垦土地并援助农村：家庭更多，开支更大。"
 efw_sub_public_works:0 "公共工程"
 efw_sub_public_works_desc:0 "国家出资的工地遍布全国。"
 efw_sub_armaments_contracts:0 "军备合同"
 efw_sub_armaments_contracts_desc:0 "为军队生产的人可获得有保障的订单。"
 efw_sub_development_bank:0 "开发银行"
 efw_sub_development_bank_desc:0 "由一家公共机构为每个重大项目融资。"
 efw_sub_defence_budget:0 "国防预算"
 efw_sub_defence_budget_desc:0 "越来越多的预算流向军工产业。"
 efw_sub_science_city:0 "科学城"
 efw_sub_science_city_desc:0 "实验室、研究所和科学家集中在一个大型中心。"
 efw_ec_resources:0 "原材料"
 efw_res_scrap_drive:0 "废铁回收"
 efw_res_scrap_drive_desc:0 "铁门和铁锅都送进了铸造厂。"
 efw_res_new_mines:0 "新矿山"
 efw_res_new_mines_desc:0 "全国各地勘探并开凿新矿井。"
 efw_res_synthetic:0 "合成产品"
 efw_res_synthetic_desc:0 "用化学方法制造橡胶和燃料。"
 efw_res_rationing:0 "配给制"
 efw_res_rationing_desc:0 "燃料和物资凭票供应：储备更多，笑容更少。"
 efw_res_export_quotas:0 "出口配额"
 efw_res_export_quotas_desc:0 "资源留在国内，伙伴们抱怨。"
 efw_res_intensive_mining:0 "强化开采"
 efw_res_intensive_mining_desc:0 "矿井两班倒，安全措施削减到极限。"
 efw_res_substitutes:0 "代用材料"
 efw_res_substitutes_desc:0 "即使没有合适的资源也能继续生产，只是质量较差。"
 efw_res_strategic_stockpile:0 "国家燃料储备"
 efw_res_strategic_stockpile_desc:0 "以民用开支为代价修建的巨型燃料库。"
 efw_society_policies:0 "社会与国内秩序"
 efw_society_policies_desc:0 "劳动、新闻、公共秩序、学校、人口和民防：后方战线。"
 efw_ec_labour:0 "劳动与福利"
 efw_lab_eight_hours:0 "八小时工作制"
 efw_lab_eight_hours_desc:0 "工人休息好了、心情好了，但少了几个班次。"
 efw_lab_long_shifts:0 "长班制"
 efw_lab_long_shifts_desc:0 "在工厂待的时间更长，产量更高，疲劳也更多。"
 efw_lab_state_unions:0 "国家工会"
