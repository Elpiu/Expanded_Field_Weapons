 efw_cd_coastal_watch:0 "海岸警戒"
 efw_cd_coastal_watch_desc:0 "沿海处处设有观察哨。"
 efw_cd_home_guard:0 "本土卫队"
 efw_cd_home_guard_desc:0 "受过训练、保卫自己城镇的公民。"
 efw_cd_decoys:0 "假目标"
