l_english:
 efw_national_mobilization_category:0 "National Mobilization and Investment"
 efw_national_mobilization_category_desc:0 "A network of propaganda, labour organization, research and logistics can gradually transform the country into a fully mobilized economic and military machine."
 efw_propaganda_center:0 "Propaganda and Mobilization Center"
 efw_propaganda_center_desc:0 "An administrative and propaganda center coordinating political campaigns, civilian recruitment and public mobilization."
 efw_labor_directorate:0 "National Labour Directorate"
 efw_labor_directorate_desc:0 "An organization coordinating labour, construction, production and exploitation of local resources."
 efw_research_center:0 "National Research Center"
 efw_research_center_desc:0 "A complex devoted to applied research and coordination of institutes, universities and national laboratories."
 efw_logistics_center:0 "Logistics and Civil Defence Center"
 efw_logistics_center_desc:0 "A regional hub for stockpiles, transport, maintenance, infrastructure and civil defence."
 modifier_production_speed_efw_propaganda_center_factor:0 "Propaganda Center construction speed"
 modifier_production_speed_efw_propaganda_center_factor_desc:0 "Modifies Propaganda and Mobilization Center construction speed."
 modifier_state_production_efw_propaganda_center_factor:0 "Local Propaganda Center construction speed"
 modifier_state_production_efw_propaganda_center_factor_desc:0 "Modifies local Propaganda Center construction speed."
 modifier_production_speed_efw_labor_directorate_factor:0 "Labour Directorate construction speed"
 modifier_production_speed_efw_labor_directorate_factor_desc:0 "Modifies National Labour Directorate construction speed."
 modifier_state_production_efw_labor_directorate_factor:0 "Local Labour Directorate construction speed"
 modifier_state_production_efw_labor_directorate_factor_desc:0 "Modifies local Labour Directorate construction speed."
 modifier_production_speed_efw_research_center_factor:0 "Research Center construction speed"
 modifier_production_speed_efw_research_center_factor_desc:0 "Modifies National Research Center construction speed."
 modifier_state_production_efw_research_center_factor:0 "Local Research Center construction speed"
 modifier_state_production_efw_research_center_factor_desc:0 "Modifies local Research Center construction speed."
 modifier_production_speed_efw_logistics_center_factor:0 "Logistics Center construction speed"
 modifier_production_speed_efw_logistics_center_factor_desc:0 "Modifies Logistics and Civil Defence Center construction speed."
 modifier_state_production_efw_logistics_center_factor:0 "Local Logistics Center construction speed"
 modifier_state_production_efw_logistics_center_factor_desc:0 "Modifies local Logistics Center construction speed."
 efw_national_investments_idea:0 "National Investment Program"
 efw_national_investments_idea_desc:0 "The state concentrates political and administrative resources on expanding propaganda and national labour organization."
 efw_coordinated_economy_idea:0 "Coordinated National Economy"
 efw_coordinated_economy_idea_desc:0 "Industry, dockyards and administration are coordinated under a national economic plan, at a social cost."
 efw_research_funding_idea:0 "National Research Funding"
 efw_research_funding_idea_desc:0 "Funding and accelerated procedures support the development of a national research network."
 efw_logistics_plan_idea:0 "National Infrastructure Plan"
 efw_logistics_plan_idea_desc:0 "The government supports the development of regional logistics centers and supporting infrastructure."
 efw_national_mobilization_idea:0 "National Mobilization"
 efw_national_mobilization_idea_desc:0 "The national economic and administrative apparatus is fully oriented toward the national effort."
 efw_commission_propaganda_center:0 "Build a Propaganda Center"
 efw_commission_propaganda_center_desc:0 "Commit §Y10,000 public workers§! to begin construction of a Propaganda and Mobilization Center in the selected state."
 efw_commission_labor_directorate:0 "Establish a Labour Directorate"
 efw_commission_labor_directorate_desc:0 "Commit §Y20,000 workers§! to establish a National Labour Directorate in the selected state."
 efw_commission_research_center:0 "Build a National Research Center"
 efw_commission_research_center_desc:0 "Commit §Y15,000 technicians, researchers and staff§! to establish a National Research Center."
 efw_commission_logistics_center:0 "Build a Logistics Center"
 efw_commission_logistics_center_desc:0 "Commit §Y12,000 workers and logistics personnel§! to establish a Logistics and Civil Defence Center."
 efw_launch_national_investments:0 "Launch National Investments"
 efw_launch_national_investments_desc:0 "With the first propaganda network operational, public investment can be centralized and accelerated."
 efw_coordinate_national_economy:0 "Coordinate the National Economy"
 efw_coordinate_national_economy_desc:0 "The administrative and labour network is broad enough to coordinate industry and construction nationally."
 efw_fund_national_research:0 "Fund National Research"
 efw_fund_national_research_desc:0 "Allocate political and administrative resources to a coordinated national research network."
 efw_launch_national_infrastructure_plan:0 "National Infrastructure Plan"
 efw_launch_national_infrastructure_plan_desc:0 "Create a national program for logistics, transport, stockpiles and civil defence."
 efw_mobilize_the_nation:0 "Mobilize the Nation"
 efw_mobilize_the_nation_desc:0 "Propaganda, labour, research and logistics are sufficiently developed for full national economic mobilization."
 efw_issue_national_bonds:0 "Issue National Bonds"
 efw_issue_national_bonds_desc:0 "Receive §G+100 Political Power§! immediately, but repay §R150 Political Power§! after §Y365 days§!."
 efw_issue_long_term_national_loan:0 "Great National Loan"
 efw_issue_long_term_national_loan_desc:0 "Receive §G+120 Political Power§! immediately, but repay §R200 Political Power§! after §Y730 days§!."
 efw_national_mobilization.1.t:0 "National Bonds Mature"
 efw_national_mobilization.1.d:0 "The bonds issued one year ago have matured. Principal and interest must now be repaid."
 efw_national_mobilization.1.a:0 "We will honor our obligations."
 efw_national_mobilization.2.t:0 "The Great National Loan Matures"
 efw_national_mobilization.2.d:0 "The national loan contracted two years ago has matured. Principal and interest must now be repaid."
 efw_national_mobilization.2.a:0 "The debt will be repaid."
 EFW_MOD_NAME:0 "Expanded Field Weapons"
 efw_machinegun_equipment:0 "Support Machine Guns"
 efw_machinegun_equipment_desc:0 "Light, medium and heavy machine guns abstracted into one production category. The equipment remains stable while Support Weapons research improves the formations using it."
 efw_machinegun_equipment_standard:0 "Machine Guns"
 efw_machinegun_equipment_standard_short:0 "Machine Guns"
 efw_mortar_equipment:0 "Infantry Mortars"
 efw_mortar_equipment_desc:0 "Light and medium mortars for organic short-range indirect fire support."
 efw_mortar_equipment_standard:0 "Mortars"
 efw_mortar_equipment_standard_short:0 "Mortars"
 efw_antitank_equipment:0 "Portable Anti-Tank Weapons"
 efw_antitank_equipment_desc:0 "Organic infantry anti-tank weapons. Improved doctrine, ammunition and employment are represented through technology bonuses rather than new production models."
 efw_antitank_equipment_standard:0 "Anti-Tank Weapons"
 efw_antitank_equipment_standard_short:0 "AT Weapons"
 efw_machinegun_company:0 "Machine Gun Company"
 efw_machinegun_company_desc:0 "A support company dedicated to sustained automatic fire. Uses EFW Machine Guns."
 efw_mortar_company:0 "Mortar Company"
 efw_mortar_company_desc:0 "A support company providing short-range indirect fire. Uses EFW Mortars."
 efw_antitank_company:0 "Anti-Tank Company"
 efw_antitank_company_desc:0 "Portable anti-tank teams integrated into the formation. Uses EFW Anti-Tank Weapons."
 efw_elite_heavy_weapons_battalion:0 "Elite Heavy Weapons Battalion"
 efw_elite_heavy_weapons_battalion_desc:0 "An expensive and supply-hungry frontline battalion combining machine guns, mortars and anti-tank weapons with selected infantry."
 efw_unlock_core_weapons:0 "EFW: Integrated Support Weapons"
 efw_support_upgrade_2:0 "EFW: Support Weapons II"
 efw_support_upgrade_3:0 "EFW: Support Weapons III"
 efw_support_upgrade_4:0 "EFW: Support Weapons IV"
 efw_at_upgrade_1:0 "EFW: Anti-Tank Improvements I"
 efw_at_upgrade_2:0 "EFW: Anti-Tank Improvements II"
 efw_test.1.t:0 "EXPANDED FIELD WEAPONS v1.2 ACTIVE!"
 efw_test.1.d:0 "Support Weapons I unlocks three permanent production lines: Machine Guns, Mortars and Anti-Tank Weapons. Later Support Weapons research directly improves the statistics of the new formations."
 efw_test.1.a:0 "Perfect."
 efw_improvised_naval_modules_unlock:0 "Improvised Naval Programme"
 efw_motorboat_engine:0 "Improvised Motorboat Engine"
 efw_motorboat_engine_desc:0 "A simple engine for tiny coastal craft. It drastically reduces the ship's cost, range and durability."
 efw_motorboat_machinegun:0 "Naval Machine-Gun Mount"
 efw_motorboat_machinegun_desc:0 "A heavy machine gun adapted for naval use."
 efw_midget_sub_engine:0 "Midget Submarine Engine"
 efw_midget_sub_engine_desc:0 "A tiny propulsion system for extremely small submarines."
 efw_midget_sub_torpedo:0 "Midget Submarine Light Torpedo"
 efw_midget_sub_torpedo_desc:0 "A compact torpedo installation intended for midget submarines."
 efw_wooden_fighter_equipment:0 "Improvised Wooden Fighter"
 efw_wooden_fighter_equipment_desc:0 "An extremely cheap aircraft built from non-strategic materials and simple components. Easy to manufacture, but slow, fragile and lightly armed."
 efw_tin_tank_equipment:0 "Tin Tank"
 efw_tin_tank_equipment_desc:0 "A rudimentary light tank protected by thin riveted plates and armed primarily with a machine gun. Cheap to manufacture, but vulnerable to almost any anti-tank weapon."
 efw_wooden_air_bba_unlock:0 "Improvised Aircraft Programme"
 efw_wooden_air_legacy_unlock:0 "Improvised Aircraft Programme"
 efw_tin_tank_nsb_unlock:0 "Improvised Armour Programme"
 efw_tin_tank_legacy_unlock:0 "Improvised Armour Programme"
