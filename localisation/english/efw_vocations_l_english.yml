l_english:
 # === WELCOME EVENT ===
 efw_welcome.1.t:0 "An Inspector with a Hydraulic Pipe"
 efw_welcome.1.d:0 "An official from the Ministry of Armaments walks in without knocking. Under his arm: a hydraulic pipe, a roll of electrical tape and a folder marked §YEXPANDED FIELD WEAPONS§!.\n\n\"Excellency, machine guns, mortars and anti-tank weapons now have their own production lines with §YSupport Weapons I§!. We have a rifle that costs no steel. A wooden fighter, sailing ships and a fleet of motorboats. And four new sections of laws.\"\n\nThen he lowers his voice: \"But the real news is §YNational Vocations§!. Pick a path, build the right buildings, pass the right laws... and the ministry will multiply everything. Up to §G+40% research§!, if you are stubborn enough.\"\n\nHe puts the pipe on the desk. \"In the meantime, a small welcome gift. What would you prefer?\""
 efw_welcome.1.a:0 "\"To the laboratories!\""
 efw_welcome.1.b:0 "\"More factories, less talk.\""
 efw_welcome.1.c:0 "\"Soldiers come first.\""
 efw_welcome.1.e:0 "\"We found some pipes in the basement.\""
 efw_welcome.1.f:0 "\"No gifts. I have a war to prepare.\""
 efw_welcome_vocation_tt:0 "§YTip:§! the §YNational Vocations§! decision category explains how to turn this gift into a permanent bonus."
 efw_welcome_research_idea:0 "Enthusiasm in the Laboratories"
 efw_welcome_research_idea_desc:0 "The researchers received a letter of encouragement from the government. They framed it."
 efw_welcome_industry_idea:0 "First Building Sites"
 efw_welcome_industry_idea_desc:0 "New bulldozers, new helmets, same workers. But motivated."
 efw_welcome_army_idea:0 "Motivated Recruits"
 efw_welcome_army_idea_desc:0 "The sergeant promised leave to anyone who can assemble a rifle blindfolded."

 # === CATEGORY ===
 efw_vocation_category:0 "National Vocations"
 efw_vocation_category_desc:0 "Every nation is good at something. Pick §YONE§! and go all in: every tier needs EFW buildings and matching laws, and at tier three the bonus becomes huge. But a nation that specialises in everything specialises in nothing: the drawbacks hit the other fields.\n\n§ROne vocation per nation. 120 days must pass between tiers.§!"
 efw_vocation_settling_tt:0 "The ministry is still getting organised (§Y120 days§! between tiers)"
 efw_vocation_crisis_tt:0 "No §RNational Identity Crisis§! in progress"

 # === REPUBLIC OF SCIENTISTS ===
 efw_vocation_research_1:0 "Vocation: Republic of Scientists"
 efw_vocation_research_1_desc:0 "Microscopes instead of cannons: the nation bets everything on research.\n\n§YThe path:§!\n§YI§! §G+10% research§!\n§YII§! §G+22% research§!: 2 National Research Centers, 4 research slots and one law among Scholarships, Elite Universities, Scientific Exchange or Military Research\n§YIII§! §G+40% research§!: 4 Research Centers, 5 research slots, Elite Universities or Scientific Exchange, Research Grants or Science City\n\n§RGrowing drawbacks:§! consumer goods, military output and, in the end, war support."
 efw_vocation_research_2:0 "Scientists: the Great Laboratory"
 efw_vocation_research_2_desc:0 "The professors asked for more funding. Strangely, they got it."
 efw_vocation_research_3:0 "Scientists: Brains in Power"
 efw_vocation_research_3_desc:0 "The cabinet now meets in a lecture hall. Slides are mandatory."
 efw_voc_research_1:0 "Republic of Scientists I"
 efw_voc_research_1_desc:0 "Every school has a laboratory, every laboratory has a dream."
 efw_voc_research_2:0 "Republic of Scientists II"
 efw_voc_research_2_desc:0 "Factories lend their engineers to the laboratories. The factories are not happy."
 efw_voc_research_3:0 "Republic of Scientists III"
 efw_voc_research_3_desc:0 "The nation thinks faster than anyone else. Fighting, on the other hand, it enjoys less."

 # === WORKSHOP OF THE NATION ===
 efw_vocation_industry_1:0 "Vocation: Workshop of the Nation"
 efw_vocation_industry_1_desc:0 "Chimneys, shifts and sirens: the nation becomes a factory.\n\n§YThe path:§!\n§YI§! §G+6% factory output, +8% construction§!\n§YII§! §G+14% output, +15% construction, +10% efficiency growth§!: 2 Labour Directorates and one law among Heavy Industry, Five-Year Plan or Scientific Management\n§YIII§! §G+28% output, +25% construction, +20% efficiency growth, +5% max efficiency§!: 4 Labour Directorates, 2 Propaganda Centers, Heavy Industry or Five-Year Plan, one law among Long Shifts, Labour Mobilisation or Corporatism\n\n§RGrowing drawbacks:§! research, stability and population growth."
 efw_vocation_industry_2:0 "Workshop: Chimneys Everywhere"
 efw_vocation_industry_2_desc:0 "The sky is grey, the GDP is green."
 efw_vocation_industry_3:0 "Workshop: the Country is a Factory"
 efw_vocation_industry_3_desc:0 "The night-shift siren has become the unofficial anthem."
 efw_voc_industry_1:0 "Workshop of the Nation I"
 efw_voc_industry_1_desc:0 "The first shift starts at six. So does the second, somewhere else."
 efw_voc_industry_2:0 "Workshop of the Nation II"
 efw_voc_industry_2_desc:0 "Every town has a factory. Some towns are a factory."
 efw_voc_industry_3:0 "Workshop of the Nation III"
 efw_voc_industry_3_desc:0 "The nation out-produces everyone. Citizens sleep when they can."

 # === NATION IN ARMS ===
 efw_vocation_army_1:0 "Vocation: Nation in Arms"
 efw_vocation_army_1_desc:0 "Every square has a barracks, every boy a backpack.\n\n§YThe path:§!\n§YI§! §G+3% attack and defence, -5% training time§!\n§YII§! §G+8% attack and defence, +3% conscription, -10% training time§!: 2 Propaganda Centers and one law among Heavy Weapons for All, Assault Squads or Defence in Depth\n§YIII§! §G+16% attack and defence, +5% organisation, +6% conscription, -20% training time, +15% experience§!: 4 Propaganda Centers, 2 Logistics Centers, one 100 PP Field Weapons law and one among War College, Great General Staff or Veteran Cadres\n\n§RGrowing drawbacks:§! research, consumer goods and stability."
 efw_vocation_army_2:0 "Arms: Every Citizen a Soldier"
 efw_vocation_army_2_desc:0 "Even the postman can strip a machine gun. Letters arrive late."
 efw_vocation_army_3:0 "Arms: the National Barracks"
 efw_vocation_army_3_desc:0 "The whole country wakes up at five. By law."
 efw_voc_army_1:0 "Nation in Arms I"
 efw_voc_army_1_desc:0 "The Saturday parade has become a fixture."
 efw_voc_army_2:0 "Nation in Arms II"
 efw_voc_army_2_desc:0 "Schools teach geography with General Staff maps."
 efw_voc_army_3:0 "Nation in Arms III"
 efw_voc_army_3_desc:0 "The best army on the continent. The laboratories, meanwhile, close at five."

 # === LORDS OF THE SEA ===
 efw_vocation_navy_1:0 "Vocation: Lords of the Sea"
 efw_vocation_navy_1_desc:0 "The nation's future floats.\n\n§YThe path:§!\n§YI§! §G+6% dockyard output, +3% naval damage§!\n§YII§! §G+15% dockyard output, +6% naval damage and defence, +10% repairs§!: 10 dockyards and one law among Great Shipyards, Blue-Water Navy, Torpedo Doctrine or Refit Arsenals\n§YIII§! §G+30% dockyard output, +12% naval damage and defence, +25% repairs and refits§!: 25 dockyards, Great Shipyards and one law among Blue-Water Navy, Torpedo Doctrine, Refit Arsenals or Convoy System\n\n§RGrowing drawbacks:§! military output and army training."
 efw_vocation_navy_2:0 "Sea: Continuous Launches"
 efw_vocation_navy_2_desc:0 "Every Monday a bottle breaks against a bow. We recycle the glass."
 efw_vocation_navy_3:0 "Sea: Masters of the Waves"
 efw_vocation_navy_3_desc:0 "Enemy nautical charts have a new symbol: ours."
 efw_voc_navy_1:0 "Lords of the Sea I"
 efw_voc_navy_1_desc:0 "Children play with toy boats. The ministry takes notes."
 efw_voc_navy_2:0 "Lords of the Sea II"
 efw_voc_navy_2_desc:0 "The shipyards work day and night; the regiments wait for their trucks."
 efw_voc_navy_3:0 "Lords of the Sea III"
 efw_voc_navy_3_desc:0 "The finest fleet on the oceans. The army, meanwhile, trains on the quayside."

 # === THE ART OF MAKING DO ===
 efw_vocation_scrap_1:0 "Vocation: the Art of Making Do"
 efw_vocation_scrap_1_desc:0 "No steel? No rubber? No problem. We have wire.\n\n§YThe path:§!\n§YI§! §G-15% lack-of-resources penalty, +5% starting efficiency§!\n§YII§! §G-35% penalty, +10% starting efficiency, +5% local resources, +5% factory output§!: §Y5,000 Pipe-Gun Rifles§! in the stockpile and Scrap Drive or Substitute Materials\n§YIII§! §G-60% penalty, +20% starting efficiency, +5% max efficiency, +10% local resources, +12% factory output§!: §Y20,000 Pipe-Gun Rifles§! in the stockpile, Scrap Drive or Substitute Materials, Autarky or Import Quotas\n\nPerfect for resource-poor nations.\n\n§RGrowing drawbacks:§! research and stability."
 efw_vocation_scrap_2:0 "Making Do: Everything is Useful"
 efw_vocation_scrap_2_desc:0 "The park railings are gone. So are the benches. And a few lamp posts."
 efw_vocation_scrap_3:0 "Making Do: Genius of the Wire"
 efw_vocation_scrap_3_desc:0 "Foreign engineers visit our factories and cannot understand how they work. Neither can we."
 efw_voc_scrap_1:0 "The Art of Making Do I"
 efw_voc_scrap_1_desc:0 "Electrical tape has been declared a strategic material."
 efw_voc_scrap_2:0 "The Art of Making Do II"
 efw_voc_scrap_2_desc:0 "Every basement is a depot, every grandfather a technical consultant."
 efw_voc_scrap_3:0 "The Art of Making Do III"
 efw_voc_scrap_3_desc:0 "The factories run at full speed on half the resources. Nobody asks how."

 # === ABANDON ===
 efw_vocation_abandon:0 "Renounce the Vocation"
 efw_vocation_abandon_desc:0 "We took the wrong road. It happens. We turn back, lose the tier we reached and for §Y180 days§! the country suffers a §RNational Identity Crisis§!: no new vocation until it passes."
 efw_vocation_crisis_idea:0 "National Identity Crisis"
 efw_vocation_crisis_idea_desc:0 "The newspapers wonder who we are. The government, honestly, does not know."
