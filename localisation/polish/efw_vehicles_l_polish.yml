l_polish:
 efw_tankette_equipment:0 "Tankietki"
 efw_tankette_equipment_desc:0 "Dwóch ludzi, karabin maszynowy i silnik od ciężarówki w blaszanej skrzynce. Szybsza niż własna odwaga: tania i zwrotna, ale każde działo przeciwpancerne otwiera ją jak puszkę sardynek."
 efw_tankette_equipment_1:0 "Tankietka EFW"
 efw_tankette_equipment_1_short:0 "Tankietka"
 efw_tankette_equipment_1_desc:0 "Dwóch ludzi, karabin maszynowy i silnik od ciężarówki w blaszanej skrzynce. Szybsza niż własna odwaga: tania i zwrotna, ale każde działo przeciwpancerne otwiera ją jak puszkę sardynek."
 efw_tankette_battalion:0 "Batalion tankietek"
 efw_tankette_battalion_desc:0 "Dwuosobowe miniczołgi. Batalion kosztuje mniej więcej ćwierć batalionu lekkich czołgów i miażdży piechotę bez broni przeciwpancernej, ale pancerz jest cienki. Używa tankietek EFW."
 efw_tankette_unlock:0 "EFW: tankietki"
 efw_motorcycle_mg_equipment:0 "Motocykle z karabinem maszynowym"
 efw_motorcycle_mg_equipment_desc:0 "Motocykl, przyczepa i karabin maszynowy tam, gdzie powinna siedzieć teściowa. Szybki, głośny i zaskakująco zabójczy na polnych drogach."
 efw_motorcycle_mg_equipment_1:0 "Motocykl z KM EFW"
 efw_motorcycle_mg_equipment_1_short:0 "Motocykl z KM"
 efw_motorcycle_mg_equipment_1_desc:0 "Motocykl, przyczepa i karabin maszynowy tam, gdzie powinna siedzieć teściowa. Szybki, głośny i zaskakująco zabójczy na polnych drogach."
 efw_motorcycle_mg_company:0 "Kompania motocyklistów-cekaemistów"
 efw_motorcycle_mg_company_desc:0 "Rozpoznanie zmotoryzowane na motocyklach z uzbrojoną przyczepą. Widzi tak daleko jak rozpoznanie zmotoryzowane, kosztuje mniej i daje całej piechocie dywizji §G+5% ataku§!. Zajmuje miejsce rozpoznania."
 efw_motorcycle_unlock:0 "EFW: motocykliści-cekaemiści"
 efw_gun_truck_equipment:0 "Ciężarówki z działem"
 efw_gun_truck_equipment_desc:0 "Weź ciężarówkę. Weź działo przeciwpancerne. Zwiąż je razem dużą ilością sznura i odrobiną wiary. Strzela do piechoty i lekkich pojazdów i odjeżdża, zanim ktoś odpowie: pancerza brak."
 efw_gun_truck_equipment_1:0 "Improwizowane autodziało EFW"
 efw_gun_truck_equipment_1_short:0 "Autodziało"
 efw_gun_truck_equipment_1_desc:0 "Weź ciężarówkę. Weź działo przeciwpancerne. Zwiąż je razem dużą ilością sznura i odrobiną wiary. Strzela do piechoty i lekkich pojazdów i odjeżdża, zanim ktoś odpowie: pancerza brak."
 efw_gun_truck_battalion:0 "Bateria autodział"
 efw_gun_truck_battalion_desc:0 "Działa przeciwpancerne na ciężarówkach. Artyleria liniowa szybka jak piechota zmotoryzowana, z dobrą przebijalnością i bez ochrony. Używa improwizowanych autodział EFW."
 efw_gun_truck_unlock:0 "EFW: improwizowane autodziała"
 efw_wooden_transport_equipment:0 "Drewniane transportowce"
 efw_wooden_transport_equipment_desc:0 "Sklejka, płótno i silnik, który widział lepsze dni. Przewozi spadochroniarzy i skrzynie zaopatrzenia za mniej niż połowę ceny prawdziwego transportowca, bez aluminium. Mniej niezawodny, a trafiony rozpada się: potrzebna przewaga powietrzna."
 efw_wooden_transport_equipment_1:0 "Drewniany transportowiec EFW"
 efw_wooden_transport_equipment_1_short:0 "Drewniany transportowiec"
 efw_wooden_transport_equipment_1_desc:0 "Sklejka, płótno i silnik, który widział lepsze dni. Przewozi spadochroniarzy i skrzynie zaopatrzenia za mniej niż połowę ceny prawdziwego transportowca, bez aluminium. Mniej niezawodny, a trafiony rozpada się: potrzebna przewaga powietrzna."
 efw_wooden_transport:0 "Drewniane transportowce"
 efw_wooden_transport_desc:0 "Skrzydło drewnianych transportowców EFW: desanty spadochronowe i zaopatrzenie z powietrza."
 efw_air_transport_unlock:0 "EFW: improwizowany transport lotniczy"
 efw_militia_paratrooper:0 "Spadochroniarze milicji"
 efw_militia_paratrooper_desc:0 "Ochotnicy po dwutygodniowym kursie, ze spadochronem złożonym przez kogoś innego. To nie siły specjalne, więc można ich szkolić ilu się chce. Słabsi od prawdziwych spadochroniarzy, ale znacznie lżejsi: do zrzutu potrzeba mniej więcej o jedną trzecią mniej samolotów."
