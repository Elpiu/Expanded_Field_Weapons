 efw_national_investments_idea:0 "Program inwestycji narodowych"
 efw_national_investments_idea_desc:0 "Państwo skupia zasoby polityczne i administracyjne na rozbudowie propagandy i narodowej organizacji pracy."
 efw_coordinated_economy_idea:0 "Skoordynowana gospodarka narodowa"
 efw_coordinated_economy_idea_desc:0 "Przemysł, stocznie i administracja są koordynowane według narodowego planu gospodarczego – za cenę kosztów społecznych."
 efw_research_funding_idea:0 "Narodowe finansowanie nauki"
 efw_research_funding_idea_desc:0 "Fundusze i przyspieszone procedury wspierają rozwój narodowej sieci badawczej."
 efw_logistics_plan_idea:0 "Narodowy plan infrastruktury"
 efw_logistics_plan_idea_desc:0 "Rząd wspiera rozwój regionalnych ośrodków logistycznych i towarzyszącej im infrastruktury."
 efw_national_mobilization_idea:0 "Mobilizacja narodowa"
 efw_national_mobilization_idea_desc:0 "Aparat gospodarczy i administracyjny kraju jest całkowicie nastawiony na wysiłek narodowy."
 efw_commission_propaganda_center:0 "Zbuduj ośrodek propagandy"
 efw_commission_propaganda_center_desc:0 "Skieruj §Y10 000 pracowników publicznych§! do budowy Ośrodka Propagandy i Mobilizacji w wybranym regionie."
 efw_commission_labor_directorate:0 "Utwórz dyrekcję pracy"
 efw_commission_labor_directorate_desc:0 "Skieruj §Y20 000 robotników§! do utworzenia Narodowej Dyrekcji Pracy w wybranym regionie."
 efw_commission_research_center:0 "Zbuduj Narodowy Ośrodek Badawczy"
 efw_commission_research_center_desc:0 "Skieruj §Y15 000 techników, naukowców i pracowników§! do utworzenia Narodowego Ośrodka Badawczego."
 efw_commission_logistics_center:0 "Zbuduj ośrodek logistyki"
 efw_commission_logistics_center_desc:0 "Skieruj §Y12 000 robotników i logistyków§! do utworzenia Ośrodka Logistyki i Obrony Cywilnej."
 efw_launch_national_investments:0 "Uruchom inwestycje narodowe"
 efw_launch_national_investments_desc:0 "Gdy pierwsza sieć propagandy działa, inwestycje publiczne można scentralizować i przyspieszyć."
 efw_coordinate_national_economy:0 "Skoordynuj gospodarkę narodową"
 efw_coordinate_national_economy_desc:0 "Sieć administracyjna i pracy jest wystarczająco szeroka, by koordynować przemysł i budownictwo w całym kraju."
 efw_fund_national_research:0 "Finansuj naukę narodową"
 efw_fund_national_research_desc:0 "Przeznacz zasoby polityczne i administracyjne na skoordynowaną narodową sieć badawczą."
 efw_launch_national_infrastructure_plan:0 "Narodowy plan infrastruktury"
 efw_launch_national_infrastructure_plan_desc:0 "Stwórz narodowy program logistyki, transportu, magazynów i obrony cywilnej."
 efw_mobilize_the_nation:0 "Zmobilizuj naród"
 efw_mobilize_the_nation_desc:0 "Propaganda, praca, nauka i logistyka są dostatecznie rozwinięte, by w pełni zmobilizować gospodarkę kraju."
 efw_issue_national_bonds:0 "Wyemituj obligacje państwowe"
 efw_issue_national_bonds_desc:0 "Natychmiast otrzymaj §G+100 siły politycznej§!, ale po §Y365 dniach§! oddaj §R150 siły politycznej§!."
 efw_issue_long_term_national_loan:0 "Wielka pożyczka narodowa"
 efw_issue_long_term_national_loan_desc:0 "Natychmiast otrzymaj §G+120 siły politycznej§!, ale po §Y730 dniach§! oddaj §R200 siły politycznej§!."
 efw_national_mobilization.1.t:0 "Termin wykupu obligacji"
 efw_national_mobilization.1.d:0 "Obligacje wyemitowane rok temu osiągnęły termin wykupu. Trzeba teraz spłacić kapitał wraz z odsetkami."
 efw_national_mobilization.1.a:0 "Dotrzymamy zobowiązań."
 efw_national_mobilization.2.t:0 "Termin spłaty wielkiej pożyczki"
 efw_national_mobilization.2.d:0 "Pożyczka narodowa zaciągnięta dwa lata temu jest wymagalna. Trzeba teraz spłacić kapitał wraz z odsetkami."
 efw_national_mobilization.2.a:0 "Dług zostanie spłacony."
 EFW_MOD_NAME:0 "Expanded Field Weapons"
 efw_machinegun_equipment:0 "Karabiny maszynowe wsparcia"
 efw_machinegun_equipment_desc:0 "Ręczne, średnie i ciężkie karabiny maszynowe połączone w jedną kategorię produkcji. Sprzęt się nie zmienia, a badania nad bronią wsparcia ulepszają korzystające z niego jednostki."
 efw_machinegun_equipment_standard:0 "Karabiny maszynowe"
 efw_machinegun_equipment_standard_short:0 "KM"
 efw_mortar_equipment:0 "Moździerze piechoty"
 efw_mortar_equipment_desc:0 "Lekkie i średnie moździerze do organicznego wsparcia ogniem stromotorowym na krótkim dystansie."
 efw_mortar_equipment_standard:0 "Moździerze"
 efw_mortar_equipment_standard_short:0 "Moździerze"
 efw_antitank_equipment:0 "Przenośna broń przeciwpancerna"
 efw_antitank_equipment_desc:0 "Organiczna broń przeciwpancerna piechoty. Lepsze doktryny, amunicja i taktyka są odwzorowane premiami technologii, a nie nowymi modelami."
 efw_antitank_equipment_standard:0 "Broń przeciwpancerna"
 efw_antitank_equipment_standard_short:0 "Broń ppanc."
 efw_machinegun_company:0 "Kompania karabinów maszynowych"
 efw_machinegun_company_desc:0 "Kompania wsparcia prowadząca ciągły ogień automatyczny. Używa karabinów maszynowych EFW."
 efw_mortar_company:0 "Kompania moździerzy"
 efw_mortar_company_desc:0 "Kompania wsparcia ognia stromotorowego na krótkim dystansie. Używa moździerzy EFW."
 efw_antitank_company:0 "Kompania przeciwpancerna"
 efw_antitank_company_desc:0 "Przenośne zespoły przeciwpancerne w składzie formacji. Używa broni przeciwpancernej EFW."
 efw_elite_heavy_weapons_battalion:0 "Elitarny batalion broni ciężkiej"
 efw_elite_heavy_weapons_battalion_desc:0 "Drogi i wymagający zaopatrzenia batalion frontowy łączący karabiny maszynowe, moździerze i broń przeciwpancerną z doborową piechotą."
 efw_legionari_dellimpero:0 "Legionari dell'Impero"
 efw_legionari_dellimpero_desc:0 "Duży batalion milicji z karabinami i organicznymi karabinami maszynowymi. Silne tłumienie i ogień obronny, nieco mniejsze zużycie zaopatrzenia niż zwykła piechota, ale długie szkolenie: niewyszkolone oddziały są kruche, a w pełni wyszkoleni legioniści przewyższają regularną piechotę."
 efw_unlock_core_weapons:0 "EFW: zintegrowana broń wsparcia"
 efw_legionari_unlock:0 "EFW: Legionari dell'Impero"
 efw_support_upgrade_2:0 "EFW: broń wsparcia II"
 efw_support_upgrade_3:0 "EFW: broń wsparcia III"
 efw_support_upgrade_4:0 "EFW: broń wsparcia IV"
 efw_at_upgrade_1:0 "EFW: ulepszenia przeciwpancerne I"
 efw_at_upgrade_2:0 "EFW: ulepszenia przeciwpancerne II"
 efw_improvised_naval_modules_unlock:0 "Program improwizowanej floty"
 efw_motorboat_engine:0 "Improwizowany silnik motorówki"
 efw_motorboat_engine_desc:0 "Prosty silnik dla maleńkich jednostek przybrzeżnych. Drastycznie obniża koszt, zasięg i wytrzymałość okrętu."
 efw_motorboat_machinegun:0 "Okrętowe stanowisko KM"
 efw_motorboat_machinegun_desc:0 "Ciężki karabin maszynowy przystosowany do użytku na morzu."
 efw_midget_sub_engine:0 "Silnik miniaturowego okrętu podwodnego"
 efw_midget_sub_engine_desc:0 "Maleńki napęd dla bardzo małych okrętów podwodnych."
 efw_midget_sub_torpedo:0 "Lekka torpeda miniaturowego okrętu podwodnego"
 efw_midget_sub_torpedo_desc:0 "Kompaktowa wyrzutnia torped dla miniaturowych okrętów podwodnych."
 efw_scrap_multirole_mount:0 "Improwizowane stanowisko wielozadaniowe"
 efw_scrap_multirole_mount_desc:0 "Spawane stanowisko dwuzadaniowe z zapasowych lekkich dział i improwizowanych celowników plot. Daje nieco lekkiej i przeciwlotniczej siły ognia, mieści się w kilku slotach, ale lekko obniża prędkość i niezawodność."
 efw_improvised_torpedo_rack:0 "Improwizowany stojak na torpedy"
 efw_improvised_torpedo_rack_desc:0 "Prosty pokładowy stojak na zapasowe torpedy z ręcznie robionym zwalniaczem. Trochę siły torpedowej i celności, kumuluje się, ale kosztuje prędkość i niezawodność."
 efw_improvised_depth_charge_rack:0 "Improwizowany zrzutnik bomb głębinowych"
 efw_improvised_depth_charge_rack_desc:0 "Lekki zrzutnik bomb głębinowych z prostym okablowaniem hydrofonu. Nieco lepszy atak ZOP i wykrywanie, kumuluje się, ale lekko spowalnia okręt i obniża niezawodność."
 efw_improvised_fuel_tank:0 "Improwizowany zbiornik dodatkowy"
 efw_improvised_fuel_tank_desc:0 "Tani zbiornik spawany ze złomu. Większy zasięg za niewielką cenę, ale lekko niższa prędkość i niezawodność, a po trafieniu może przeciekać."
 efw_wooden_sub_coating:0 "Drewniane poszycie okrętu podwodnego"
 efw_wooden_sub_coating_desc:0 "Warstwy impregnowanego drewna, płótna i smoły zamiast deficytowego metalu. Obniża koszt, ale osłabia kadłub i ułatwia wykrycie okrętu."
 efw_wooden_surface_refit:0 "Drewniana przebudowa"
 efw_wooden_surface_refit_desc:0 "Prowizoryczna przebudowa z drewnianymi nadbudówkami i materiałami niestrategicznymi. Obniża koszt, ale osłabia kadłub, spowalnia okręt i szkodzi niezawodności."
 efw_improvised_mine_rack:0 "Improwizowany stojak na miny (10 min)"
 efw_improvised_mine_rack_desc:0 "Prosty pokładowy stojak na około dziesięć min kontaktowych. Znacznie zwiększa zdolność stawiania min kosztem prędkości i niezawodności."
 efw_improvised_sub_mine_rack:0 "Improwizowany stojak minowy okrętu podwodnego (10 min)"
 efw_improvised_sub_mine_rack_desc:0 "Kompaktowy zewnętrzny stojak na około dziesięć min. Znacznie zwiększa zdolność stawiania min przez okręt podwodny przy niewielkiej utracie prędkości i niezawodności."
 efw_small_sail:0 "Mały improwizowany żagiel"
 efw_small_sail_desc:0 "Mały płócienny żagiel na pokładzie. Daje +15% prędkości, ale okręt jest lepiej widoczny i nieco mniej niezawodny. Pasuje do slotu zbiornika paliwa."
 efw_large_sail:0 "Duży improwizowany żagiel"
 efw_large_sail_desc:0 "Ogromny prowizoryczny żagiel zmienia okręt w improwizowany windjammer. Daje +25% prędkości, ale mocno zwiększa widoczność i obniża niezawodność oraz wytrzymałość kadłuba. Pasuje do slotu zbiornika paliwa."
 efw_careened_hull:0 "Oczyszczony i wypolerowany kadłub"
 efw_careened_hull_desc:0 "Kadłub oczyszczony, osmołowany i wypolerowany, gdzie się da – z improwizowanym okuciem miedzianym. Poprawia niezawodność, prędkość, zasięg i wykrywanie, lekko zmniejsza widoczność i dodaje nieco wytrzymałości. Solidny moduł uniwersalny do slotu zbiornika paliwa."
 efw_fishing_net_armor:0 "Pancerz z sieci rybackich"
 efw_fishing_net_armor_desc:0 "Siatki maskujące i splątane sieci rybackie zamiast prawdziwego pancerza. Lekko zmniejsza widoczność i obrażenia od torped, a nawet trochę oszczędza, ale nie daje pancerza."
 efw_wooden_plank_armor:0 "Pancerz z desek"
 efw_wooden_plank_armor_desc:0 "Warstwy desek przykręconych do kadłuba. Tania dodatkowa ochrona i trochę wytrzymałości kosztem prędkości i niezawodności."
 efw_scrap_plate_armor:0 "Pancerz ze złomu"
 efw_scrap_plate_armor_desc:0 "Zespawane płyty ze złomu stalowego. Lepsza ochrona niż drewno, ale cięższy, wolniejszy i mniej niezawodny."
 efw_fishing_net_armor_heavy:0 "Pancerz z sieci rybackich (ciężki)"
 efw_fishing_net_armor_heavy_desc:0 "Ciężkie siatki maskujące i sieci rybackie na dużym okręcie. Lekko zmniejszają widoczność i obrażenia od torped, ale nie dają prawdziwego pancerza."
 efw_wooden_plank_armor_heavy:0 "Pancerz z desek (ciężki)"
 efw_wooden_plank_armor_heavy_desc:0 "Masywne deski przykręcone do kadłuba dużego okrętu. Tania ochrona i dodatkowa wytrzymałość kosztem prędkości i niezawodności."
 efw_scrap_plate_armor_heavy:0 "Pancerz ze złomu (ciężki)"
 efw_scrap_plate_armor_heavy_desc:0 "Grube płyty ze złomu stalowego na kadłubie dużego okrętu. Solidna improwizowana ochrona, ale ciężka, wolna i zawodna."
 efw_wooden_fighter_equipment:0 "Improwizowany drewniany myśliwiec"
 efw_wooden_fighter_equipment_desc:0 "Niezwykle tani samolot z materiałów niestrategicznych i prostych części. Łatwy w produkcji, ale wolny, kruchy i słabo uzbrojony."
 efw_tin_tank_equipment:0 "Blaszany czołg"
 efw_tin_tank_equipment_desc:0 "Prymitywny lekki czołg z cienkich nitowanych płyt, uzbrojony głównie w karabin maszynowy. Tani w produkcji, ale podatny niemal na każdą broń przeciwpancerną."
 efw_wooden_air_bba_unlock:0 "Program improwizowanego lotnictwa"
 efw_wooden_air_legacy_unlock:0 "Program improwizowanego lotnictwa"
 efw_tin_tank_nsb_unlock:0 "Program improwizowanej broni pancernej"
 efw_tin_tank_legacy_unlock:0 "Program improwizowanej broni pancernej"
