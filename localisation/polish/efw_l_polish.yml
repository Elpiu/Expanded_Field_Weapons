 efw_labor_directorate_unlock:0 "Organizacja pracy EFW"
 efw_research_center_unlock:0 "Sieć badawcza EFW"
 efw_logistics_center_unlock:0 "Sieć logistyczna EFW"
 efw_industrialization_campaign_idea:0 "Narodowa kampania industrializacji"
 efw_state_industry_subsidies_idea:0 "Państwowe subsydia przemysłowe"
 efw_national_infrastructure_program_idea:0 "Narodowy program infrastruktury"
 efw_early_industrialization_campaign:0 "Rozpocznij kampanię industrializacji"
 efw_army_public_works:0 "Zatrudnij armię przy robotach publicznych"
 efw_state_industry_subsidies:0 "Państwowe subsydia przemysłowe"
 efw_national_infrastructure_program:0 "Narodowy program infrastruktury"
 efw_pipe_gun_rifle:0 "Karabin z rury"
 efw_pipe_gun_rifle_short:0 "Karabin z rury"
 efw_pipe_gun_rifle_desc:0 "Prymitywna improwizowana broń, naprędce złożona z rury hydraulicznej i odzyskanych części. Toporna, zawodna i bez żadnego standardu przemysłowego, ale można ją produkować niemal bez zasobów."
 efw_army_munitions_works:0 "Budowa arsenałów wojskowych"
 efw_army_munitions_works_desc:0 "Skieruj 100 000 rekrutów na rok do produkcji zbrojeniowej, aby na stałe zbudować 4 zewnętrzne fabryki wojskowe."
 efw_naval_yard_expansion:0 "Akcja budowy stoczni wojennych"
 efw_naval_yard_expansion_desc:0 "Skieruj 100 000 rekrutów na rok do budownictwa nadbrzeżnego i utwórz 4 stałe zewnętrzne stocznie."
 efw_industrial_plan_phase_1:0 "Wielki plan przemysłowy: faza I – fundamenty"
 efw_industrial_plan_phase_1_desc:0 "Inwestuje kapitał polityczny, pociągi i ludzi w fundamenty wielkiego odrodzenia przemysłu. Natychmiast daje §G+8 fabryk cywilnych§! i §G+2 fabryki wojskowe§! poza regionami oraz przyspiesza budowę. Po 180 dniach odblokowuje fazę II."
 efw_industrial_phase_1_idea:0 "Plan przemysłowy: mobilizacja fazy I"
 efw_industrial_plan_phase_2:0 "Wielki plan przemysłowy: faza II – rozbudowa ciężka"
 efw_industrial_plan_phase_2_desc:0 "Końcowa faza rozbudowy przemysłu. Dodaje kolejne §G+7 fabryk cywilnych§! i §G+4 fabryki wojskowe§! poza regionami. Po zakończeniu cały sprzęt i połowa zmobilizowanych pracowników wracają."
 efw_industrial_phase_2_idea:0 "Plan przemysłowy: mobilizacja fazy II"
 efw_national_mobilization.30.t:0 "Plan przemysłowy: faza I ukończona"
 efw_national_mobilization.30.d:0 "Pierwsze ciężkie fabryki i kombinaty hutnicze działają pełną parą. Fundamenty położone, kraj jest gotów rozpocząć fazę II."
 efw_national_mobilization.30.a:0 "Przechodzimy do fazy II!"
 efw_national_mobilization.31.t:0 "Plan przemysłowy: triumf przemysłu"
 efw_national_mobilization.31.d:0 "Dokładnie rok po rozpoczęciu programu rozbudowa jest ukończona: 15 kompleksów cywilnych i 6 fabryk zbrojeniowych pracuje z najwyższą wydajnością. Pociągi i ciężarówki wróciły do zasobów."
 efw_national_mobilization.31.a:0 "Narodził się gigant produkcji!"
 efw_grand_public_works:0 "Mobilizacja do wielkich robót publicznych"
 efw_grand_public_works_desc:0 "Brygady robót publicznych, inżynierowie i ciężarówki zwiększają możliwości ojczyzny. Daje §G+1 infrastruktury§! (jeśli poniżej 5) i §G+2 sloty budowlane§! we wszystkich rdzennych regionach metropolii oraz §G+30%§! szybkości budowy na 540 dni."
 efw_grand_works_idea:0 "Fala wielkich robót publicznych"
 efw_social_welfare_and_workshops:0 "Pakt społeczny i sieć warsztatów"
 efw_social_welfare_and_workshops_desc:0 "Łączy wsparcie rodzin z logistyczną integracją małych warsztatów rzemieślniczych. Stabilizuje przyrost rezerw ludzkich, wspiera naukę i zwiększa produkcję oraz maksymalną wydajność fabryk na 3 lata."
 efw_social_welfare_workshops_idea:0 "Pakt społeczny i sieć warsztatów"
 efw_emergency_naval_program:0 "Nadzwyczajny program rozbudowy floty"
 efw_emergency_naval_program_desc:0 "Skupia wyspecjalizowanych stoczniowców i sprzęt, by utworzyć §G+6 stałych zewnętrznych stoczni§!. Zmobilizowani ludzie i ciężarówki wracają po roku."
 efw_national_mobilization.34.t:0 "Wykup obligacji państwowych"
 efw_national_mobilization.34.d:0 "Obligacje skarbowe wyemitowane w zeszłym roku osiągnęły termin wykupu. Rząd musi spłacić posiadaczy wraz z odsetkami, by zachować wiarygodność finansową."
 efw_national_mobilization.34.a:0 "Dotrzymać zobowiązań finansowych."
 efw_wooden_construction:0 "Lekka konstrukcja drewniana"
 efw_wooden_construction_desc:0 "Kadłub i dźwigary ze sklejki z impregnowanym płótnem. Drastycznie obniża koszt przemysłowy samolotu."
 efw_wooden_frame_component:0 "Drewniane panele konstrukcyjne"
 efw_wooden_frame_component_desc:0 "Zastępuje metalowe części drewnem i płótnem. Obniża masę i koszt kosztem wytrzymałości. Można montować wielokrotnie."
 efw_extended_fuel_tank:0 "Zewnętrzny zbiornik dodatkowy"
 efw_extended_fuel_tank_desc:0 "Zrzucany zbiornik podskrzydłowy, który znacznie zwiększa zasięg."
 efw_airdrop_supply_pod:0 "Zasobnik zrzutowy zaopatrzenia"
 efw_airdrop_supply_pod_desc:0 "Awaryjne zasobniki spadochronowe do zaopatrywania okrążonych wojsk i taktycznego wsparcia naziemnego."
 efw_boost_power_system:0 "System doładowania „Zryw”"
 efw_boost_power_system_desc:0 "Pomocnicza sprężarka zwiększająca prędkość maksymalną i ciąg przy dużych obciążeniach."
 efw_universal_hardpoint:0 "Uniwersalny węzeł uzbrojenia specjalnego"
 efw_universal_hardpoint_desc:0 "Wielozadaniowy węzeł podskrzydłowy: bomby do wsparcia bezpośredniego, dodatkowy ogień do walki o przewagę albo torpedy i ładunki do misji morskich."
 efw_plywood_frame_module:0 "Płatowiec ze sklejki i tkaniny"
 efw_plywood_frame_module_desc:0 "Zastępuje deficytowe aluminium klejoną sklejką i impregnowaną tkaniną. Drastycznie obniża koszt i masę, daje znakomitą zwrotność kosztem kruchości."
 efw_overboost_compressor_module:0 "Ręcznie robiona sprężarka „Overboost”"
 efw_overboost_compressor_module_desc:0 "Podkręca silnik wtryskiem alkoholu pod wysokim ciśnieniem. Daje ogromny ciąg (+8 ciągu) i prędkość kosztem silnego zużycia."
 efw_improvised_bomb_rack_module:0 "Improwizowany wyrzutnik bomb i odłamków"
 efw_improvised_bomb_rack_module_desc:0 "Podskrzydłowe wyrzutniki na pociski moździerzowe i amunicję kasetową. Pozwala lekkim samolotom zapewniać niszczycielskie wsparcie bezpośrednie (+6 ataku naziemnego)."
 efw_infantry_mg_pod_module:0 "Zasobnik z ciężkim KM piechoty"
 efw_infantry_mg_pod_module_desc:0 "Ciężkie karabiny maszynowe piechoty w zasobnikach skrzydłowych. Zmienia tanie samoloty w groźne myśliwce przechwytujące w walce kołowej (+8 ataku powietrznego)."
 efw_paper_drop_tank_module:0 "Zrzucane zbiorniki z prasowanego papieru"
 efw_paper_drop_tank_module_desc:0 "Jednorazowe zbiorniki z lakierowanej masy papierowej i taniej żywicy. Ogromny zasięg prawie za darmo, ale po trafieniu duże ryzyko pożaru."
 efw_stripped_cockpit_module:0 "Odchudzona kabina i celownik pierścieniowy"
 efw_stripped_cockpit_module_desc:0 "Usunięto pancerz kabiny, ogrzewanie i ciężkie przyrządy – zostaje otwarta osłona i prosty celownik pierścieniowy. Oszczędza masę i poprawia strzelanie, ale pilot jest zupełnie odsłonięty."
 efw_wooden_boost_airframe:0 "Drewniany płatowiec i sprężarka „Overboost”"
 efw_wooden_boost_airframe_desc:0 "Lekka jak piórko sklejka zamiast stopów metali i doładowany silnik. Obniża koszt i masę, z umiarkowanym zyskiem prędkości i ciągu (+5 ciągu). Każda kopia kosztuje 6% niezawodności i 8% obrony powietrznej, ale kary rosną łagodnie: dwie lub trzy kopie nadal się sprawdzają i mocno obniżają koszt samolotu."
 efw_improvised_drop_tank:0 "Dodatkowy zbiornik zrzucany z prasowanego papieru"
 efw_improvised_drop_tank_desc:0 "Jednorazowy zbiornik z lakierowanej masy papierowej i taniej żywicy. Znacznie zwiększa zasięg (+300 km) za grosze, ale jest bardzo łatwopalny."
 efw_multirole_combat_rack:0 "Polowy wielozadaniowy stojak uzbrojenia"
 efw_multirole_combat_rack_desc:0 "Kompaktowy stojak polowy zmienia każdy płatowiec w skromny samolot wielozadaniowy: +2 ataku powietrznego, +2 ataku naziemnego, +2 bombardowania strategicznego, +2 ataku na okręty i +2 namierzania okrętów. Odblokowuje też misje przewagi powietrznej, przechwytywania, wsparcia bezpośredniego, ataku na logistykę, ataków na okręty, patroli morskich, ataku na port i bombardowania strategicznego. Dodatkowy opór kosztuje 15 prędkości maksymalnej i 1,5 zwrotności, ale moduł się kumuluje: premie i kary się sumują."
 efw_cast_iron_stove_armor:0 "Improwizowany pancerz „Kuchnia polowa”"
 efw_cast_iron_stove_armor_desc:0 "Ciężka żeliwna płyta albo pokrywa włazu pod fotelem pilota. Solidna ochrona balistyczna (+7 obrony), ale wyraźnie obciąża płatowiec (+4 masy) i lekko zmniejsza prędkość i zasięg."
 efw_bazooka_charlie_tubes:0 "Wyrzutnie rakiet „Bazooka Charlie”"
 efw_bazooka_charlie_tubes_desc:0 "Bateria ręcznie spawanych piechotnych wyrzutni rakiet pod zastrzałami skrzydeł. Niszczycielskie salwy przeciw dywizjom pancernym i celom morskim (+8 ataku naziemnego), ale wysoki koszt i masa wyraźnie pogarszają zwrotność i obronę."
