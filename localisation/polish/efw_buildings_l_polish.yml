 efw_wheat_fields:0 "Pola pszenicy"
 efw_wheat_fields_plural:0 "Pola pszenicy"
 efw_wheat_fields_desc:0 "Państwowe gospodarstwa, które czynią naród samowystarczalnym w żywności: chleb dla miast i frontu bez żadnego importu. Każdy region z polami pszenicy obniża §Ydobra konsumpcyjne o 1%§! i zwiększa stabilność oraz przyrost ludności. Melioracja otwiera nowe miejsce pod budowę, a spichlerze zaopatrują przechodzące wojska."
